<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>向往的自由 · Web3文旅生态操作系统 · 三端高保真原型</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23E87722'/%3E%3Cpath d='M20 44V24l12-8 12 8v20' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
/* SVG 图标基础规则：默认 18px 描边样式，上下文规则（.tab svg 等）优先级更高不受影响 */
.ic{ width:18px; height:18px; display:inline-block; vertical-align:-3px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
:root{
  --brand:#e87722; --brand2:#f5a623; --brand-soft:#fff3e8; --brand-deep:#c25e10;
  --ink:#1a2233; --ink2:#4d5665; --sub:#8a919c; --faint:#b6bdc7;
  --bg:#f4f5f7; --card:#ffffff; --line:#ecedf1;
  --deep:#243b55;
  --green:#0f9d58; --red:#e5484d; --gold:#b98a2f;
  --shadow:0 1px 4px rgba(20,40,80,.06);
  --shadow2:0 8px 28px rgba(20,40,80,.12);
  --r:16px;
}
[data-end="partner"]{ --brand:#2f6f9f; --brand2:#5ba8c9; --brand-soft:#eaf3f9; --brand-deep:#23567c; }
[data-end="merch"]{ --brand:#7b5aa6; --brand2:#a97fd1; --brand-soft:#f3edf9; --brand-deep:#5f4484; }
html,body{ height:100%; }
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#e8ebf0; color:var(--ink); min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{ font-family:inherit; border:none; background:none; cursor:pointer; color:inherit; }
input{ font-family:inherit; border:none; outline:none; background:none; }
.num{ font-variant-numeric:tabular-nums; }

/* ===== 舞台布局 ===== */
#stage{ display:flex; gap:26px; justify-content:center; align-items:flex-start; padding:26px 20px; max-width:1180px; margin:0 auto; }

/* ===== 手机壳 ===== */
.phone-frame{
  width:400px; height:868px; background:#0b0e14; border-radius:50px; padding:13px;
  box-shadow:0 30px 80px rgba(10,20,40,.35), inset 0 0 0 2px #2a2f3a;
  flex-shrink:0; position:relative;
}
.phone-frame::before,.phone-frame::after{ content:''; position:absolute; width:3px; border-radius:2px; background:#2a2f3a; }
.phone-frame::before{ left:-3px; top:170px; height:56px; }
.phone-frame::after{ right:-3px; top:150px; height:88px; }
.phone-screen{ width:100%; height:100%; background:var(--bg); border-radius:38px; overflow:hidden; display:flex; flex-direction:column; position:relative; }

/* 状态栏 —— 沉浸式：绝对定位浮在内容之上，底色由 JS 按当前页首色自动适配 */
.statusbar{ position:absolute; top:0; left:0; right:0; height:44px; z-index:79; display:flex; align-items:center; justify-content:space-between; padding:0 24px 0 26px; font-size:13.5px; font-weight:700; color:var(--ink); pointer-events:none; transition:color .22s; }
.statusbar .sicons{ display:flex; align-items:center; gap:5px; }
.statusbar svg{ display:block; }

/* ===== 应用根 / 页面栈（顶到 0，状态栏浮于其上）===== */
.app-root{ position:absolute; inset:0; overflow:hidden; }
/* 状态栏安全区：普通页面顶部下压44px；沉浸式头部用负外边距顶回去 */
#baseScroll{ padding-top:44px; }
.page{ padding-top:44px; }
.page.top-bleed{ padding-top:0; }
.layer{ position:absolute; inset:0; z-index:1; display:flex; flex-direction:column; transition:transform .3s cubic-bezier(.25,.9,.3,1), filter .3s; }
.layer.pushed{ transform:translateX(-15%); filter:brightness(.94); }
.page{ position:absolute; inset:0; background:var(--bg); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .34s cubic-bezier(.25,.9,.3,1); z-index:20; box-shadow:-10px 0 30px rgba(10,20,40,.10); }
.page.in{ transform:none; }
.page.out{ transform:translateX(100%); }
.navbar{ height:46px; flex-shrink:0; display:flex; align-items:center; padding:0 6px; background:rgba(255,255,255,.92); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); position:relative; z-index:5; }
.nav-title{ position:absolute; left:50%; transform:translateX(-50%); font-size:15.5px; font-weight:700; max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* 返回键必须「一眼就是个按钮」：细灰线在缩放/投影下会糊成一片白，所以给浅灰圆底 + 加粗箭头 */
.nav-btn{ width:40px; height:40px; display:flex; align-items:center; justify-content:center; border-radius:50%;
  color:#111418; background:#eef1f5; flex-shrink:0; transition:background .15s, transform .15s; }
.nav-btn .ic{ width:20px; height:20px; stroke-width:2.9; }
.nav-btn:active{ background:#dfe4ea; transform:scale(.94); }
.nav-right{ margin-left:auto; display:flex; align-items:center; gap:2px; padding-right:6px; }
/* 跳转返回浮标：从别的 tab 点进来时才出现，做成一条实心返回栏，避免压住页面标题 */
.ret-chip{ position:absolute; top:44px; left:0; right:0; height:36px; z-index:60; display:none; }
.ret-chip.on{ display:flex; align-items:center; padding:0 10px; background:rgba(255,255,255,.97);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line); animation:retIn .2s ease; }
.ret-chip button{ display:flex; align-items:center; gap:1px; height:28px; padding:0 12px 0 4px; border-radius:14px;
  background:#eef1f5; font-size:12px; font-weight:800; color:#111418; }
.ret-chip .ic{ width:16px; height:16px; stroke-width:2.9; }
.ret-chip button:active{ background:#dfe4ea; transform:scale(.96); }
/* 44px 是状态栏让位，36px 是返回栏让位 —— 两者相加才不会被压住 */
#appRoot.has-ret #baseScroll{ padding-top:80px; background:#fff; }
@keyframes retIn{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:none; } }

/* 滚动区 + 下拉刷新 */
.scroll{ flex:1; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:none; position:relative; }
.scroll::-webkit-scrollbar{ display:none; }
.ptr{ height:0; overflow:hidden; display:flex; align-items:center; justify-content:center; gap:7px; color:var(--sub); font-size:11.5px; transition:height .22s; }
.ptr.show{ height:46px; }
.ptr .spin{ width:15px; height:15px; border:2px solid var(--faint); border-top-color:var(--brand); border-radius:50%; animation:rot .7s linear infinite; }
@keyframes rot{ to{ transform:rotate(360deg); } }

/* ===== 底部 Tab ===== */
.tabbar{ height:66px; flex-shrink:0; background:rgba(255,255,255,.86); backdrop-filter:blur(18px); border-top:1px solid var(--line); display:flex; z-index:40; padding:6px 4px 4px; }
.tab{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--sub); font-size:10px; transition:color .15s; }
.tab svg{ width:23px; height:23px; }
.tab.on{ color:var(--brand); font-weight:700; }
.tab:active svg{ transform:scale(.9); }

/* ===== 通用组件 ===== */
.hero{ background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; padding:16px 18px 34px; position:relative; overflow:hidden; }
.hero::before{ content:''; position:absolute; right:-46px; top:-46px; width:170px; height:170px; border-radius:50%; background:rgba(255,255,255,.10); }
.hero::after{ content:''; position:absolute; right:26px; top:64px; width:88px; height:88px; border-radius:50%; background:rgba(255,255,255,.07); }
.hero-deep{ background:linear-gradient(160deg,#243b55,#3a5a78); }
.card{ background:var(--card); border-radius:var(--r); margin:0 14px 12px; box-shadow:var(--shadow); overflow:hidden; }
.sec-title{ padding:15px 16px 7px; font-size:15.5px; font-weight:800; display:flex; justify-content:space-between; align-items:baseline; }
.sec-title .more{ font-size:11.5px; color:var(--sub); font-weight:400; display:flex; align-items:center; gap:2px; }
.btn{ display:flex; align-items:center; justify-content:center; gap:6px; height:46px; border-radius:12px; font-size:15px; font-weight:700; background:var(--brand); color:#fff; width:100%; transition:transform .12s, opacity .12s; }
.btn:active{ transform:scale(.97); opacity:.94; }
.btn.ghost{ background:var(--brand-soft); color:var(--brand-deep); }
.btn.line{ background:#fff; color:var(--brand); border:1.5px solid var(--brand); }
.btn.sm{ height:34px; font-size:12.5px; border-radius:9px; width:auto; padding:0 16px; }
.btn.deep{ background:var(--deep); }
.btn[disabled]{ opacity:.45; pointer-events:none; }
.chips{ display:flex; gap:8px; padding:10px 14px; overflow-x:auto; scrollbar-width:none; }
.chips::-webkit-scrollbar{ display:none; }
.chip{ padding:6px 13px; border-radius:15px; background:#fff; font-size:12px; color:var(--ink2); border:1px solid var(--line); white-space:nowrap; flex-shrink:0; transition:all .15s; }
.chip.on{ background:var(--brand); color:#fff; border-color:transparent; font-weight:700; }
.row{ display:flex; align-items:center; padding:13px 16px; gap:12px; font-size:14px; transition:background .12s; }
.row:active{ background:#f7f8fa; }
.row + .row{ border-top:1px solid #f4f5f7; }
.row .ric{ width:22px; height:22px; color:var(--brand); flex-shrink:0; }
.row .rt{ flex:1; min-width:0; }
.row .rt b{ display:block; font-size:14px; font-weight:600; color:var(--ink); }
.row .rt span{ display:block; font-size:11px; color:var(--sub); margin-top:2px; }
.row .arr{ color:#c6ccd6; flex-shrink:0; }
.tag{ display:inline-flex; align-items:center; font-size:9.5px; padding:2px 7px; border-radius:6px; background:var(--brand-soft); color:var(--brand-deep); font-weight:700; line-height:1.5; }
.tag.gray{ background:#f2f3f5; color:var(--sub); }
.tag.green{ background:#e7f6ee; color:var(--green); }
.tag.red{ background:#fdeced; color:var(--red); }
.tag.gold{ background:#faf3e2; color:var(--gold); }
.tag.deep{ background:#e9eef5; color:var(--deep); }
.stats{ display:grid; grid-template-columns:repeat(4,1fr); background:#fff; border-radius:var(--r); margin:0 14px 12px; padding:15px 0; box-shadow:var(--shadow); }
.stat{ text-align:center; position:relative; }
.stat + .stat::before{ content:''; position:absolute; left:0; top:14%; height:72%; width:1px; background:#f0f1f4; }
.stat b{ display:block; font-size:16.5px; font-weight:800; }
.stat span{ display:block; font-size:10px; color:var(--sub); margin-top:3px; }
.empty{ text-align:center; padding:44px 20px; color:var(--faint); font-size:12.5px; }
.empty svg{ width:44px; height:44px; margin-bottom:10px; opacity:.5; }
.note{ font-size:10.5px; color:var(--faint); line-height:1.7; padding:2px 18px 16px; }
.divider{ height:8px; background:#f0f1f4; }
.switch{ width:44px; height:26px; border-radius:14px; background:#e3e6eb; position:relative; transition:background .2s; flex-shrink:0; }
.switch::after{ content:''; position:absolute; left:2.5px; top:2.5px; width:21px; height:21px; border-radius:50%; background:#fff; box-shadow:0 2px 5px rgba(0,0,0,.18); transition:transform .2s; }
.switch.on{ background:var(--brand); }
.switch.on::after{ transform:translateX(18px); }
.stepper{ display:flex; align-items:center; gap:14px; }
.stepper .sb{ width:30px; height:30px; border-radius:9px; background:#f2f3f5; display:flex; align-items:center; justify-content:center; color:var(--ink); font-size:17px; font-weight:700; }
.stepper .sb:active{ background:#e6e8ec; }
.stepper .sv{ min-width:26px; text-align:center; font-size:15px; font-weight:800; }

/* 骨架屏 */
.sk{ background:linear-gradient(90deg,#edf0f3 25%,#f7f9fb 37%,#edf0f3 63%); background-size:400% 100%; animation:skmove 1.3s ease infinite; border-radius:10px; }
@keyframes skmove{ 0%{ background-position:100% 50%; } 100%{ background-position:0 50%; } }

/* Toast */
.toast{ position:absolute; left:50%; bottom:118px; transform:translate(-50%,12px); background:rgba(18,24,36,.9); color:#fff; padding:10px 17px; border-radius:13px; font-size:12.5px; line-height:1.65; z-index:95; opacity:0; transition:all .28s; max-width:78%; text-align:center; pointer-events:none; backdrop-filter:blur(8px); white-space:pre-line; }
.toast.show{ opacity:1; transform:translate(-50%,0); }

/* 底部弹层 */
.mask{ position:absolute; inset:0; background:rgba(13,20,34,.48); z-index:80; opacity:0; pointer-events:none; transition:opacity .26s; }
.mask.show{ opacity:1; pointer-events:auto; }
.sheet{ position:absolute; left:0; right:0; bottom:0; background:#fff; border-radius:22px 22px 0 0; z-index:81; transform:translateY(103%); transition:transform .32s cubic-bezier(.25,.9,.3,1); padding:6px 18px calc(20px + env(safe-area-inset-bottom)); max-height:80%; overflow-y:auto; scrollbar-width:none; }
.sheet::-webkit-scrollbar{ display:none; }
.sheet.show{ transform:none; }
.sheet-grab{ width:38px; height:4.5px; background:#e4e6eb; border-radius:3px; margin:7px auto 13px; }
.sheet-title{ font-size:16.5px; font-weight:800; text-align:center; margin-bottom:14px; }
.sheet-sub{ font-size:11.5px; color:var(--sub); text-align:center; margin:-8px 0 14px; }

/* 居中弹窗 */
.dialog{ position:absolute; left:50%; top:50%; transform:translate(-50%,-46%) scale(.92); width:74%; background:#fff; border-radius:18px; z-index:82; opacity:0; pointer-events:none; transition:all .25s; padding:22px 20px 16px; text-align:center; }
.dialog.show{ opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
.dialog h3{ font-size:16px; font-weight:800; margin-bottom:8px; }
.dialog p{ font-size:12.5px; color:var(--ink2); line-height:1.7; margin-bottom:16px; }
.dialog .btns{ display:flex; gap:10px; }
.dialog .btns .btn{ height:40px; font-size:13.5px; }

#confetti{ position:absolute; inset:0; z-index:96; pointer-events:none; }
</style>

<style>
/* ===== 登录流 ===== */
.login{ position:absolute; inset:0; z-index:70; background:var(--bg); display:flex; flex-direction:column; }
.login-hero{ background:linear-gradient(150deg,#e87722 0%,#f5a623 60%,#f7bc5c 100%); color:#fff; padding:74px 26px 56px; position:relative; overflow:hidden; flex-shrink:0; }
.login-hero::before{ content:''; position:absolute; right:-70px; top:-70px; width:240px; height:240px; border-radius:50%; border:44px solid rgba(255,255,255,.09); }
.login-hero::after{ content:''; position:absolute; left:-50px; bottom:-90px; width:200px; height:200px; border-radius:50%; background:rgba(255,255,255,.07); }
.logo-mark{ width:62px; height:62px; background:#fff; border-radius:18px; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 26px rgba(180,90,10,.28); margin-bottom:18px; }
.login-hero h1{ font-size:29px; font-weight:900; letter-spacing:2px; }
.login-hero .slogan{ font-size:13px; opacity:.95; margin-top:8px; letter-spacing:3px; }
.login-hero .sub{ font-size:10.5px; opacity:.75; margin-top:14px; letter-spacing:1px; }
.login-body{ flex:1; background:var(--bg); border-radius:22px 22px 0 0; margin-top:-26px; padding:24px 24px 20px; position:relative; z-index:2; overflow-y:auto; scrollbar-width:none; }
.login-body::-webkit-scrollbar{ display:none; }
.login-step{ display:none; animation:stepIn .3s cubic-bezier(.25,.9,.3,1); }
.login-step.on{ display:block; }
@keyframes stepIn{ from{ opacity:0; transform:translateX(22px); } to{ opacity:1; transform:none; } }
.login-title{ font-size:20px; font-weight:900; margin-bottom:6px; }
.login-desc{ font-size:12px; color:var(--sub); margin-bottom:22px; }
.field{ display:flex; align-items:center; gap:10px; background:#fff; border:1.5px solid var(--line); border-radius:13px; padding:0 14px; height:52px; margin-bottom:14px; transition:border-color .2s; }
.field:focus-within{ border-color:var(--brand); }
.field .pre{ font-size:15px; font-weight:700; color:var(--ink); padding-right:10px; border-right:1px solid var(--line); }
.field input{ flex:1; font-size:16px; font-weight:600; letter-spacing:.5px; height:100%; }
.field input::placeholder{ color:var(--faint); font-weight:400; }
.code-boxes{ display:flex; gap:9px; margin-bottom:20px; }
.code-box{ flex:1; height:52px; background:#fff; border:1.5px solid var(--line); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; transition:all .15s; }
.code-box.focus{ border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); }
.code-box.filled{ border-color:var(--brand); background:var(--brand-soft); }
/* 登录方式分段器：一键体验 / 手机号 + 验证码 平级并列 */
.login-seg{ display:flex; background:#eceff4; border-radius:12px; padding:3px; margin-bottom:18px; }
.login-seg button{ flex:1; padding:9px 0; border-radius:10px; font-size:11.5px; font-weight:800; color:var(--sub); background:transparent; transition:all .16s; white-space:nowrap; }
.login-seg button.on{ background:#fff; color:var(--ink); box-shadow:0 2px 7px rgba(20,30,50,.10); }
.role-card{ display:flex; align-items:center; gap:14px; background:#fff; border-radius:16px; padding:16px; margin-bottom:12px; border:2px solid transparent; box-shadow:var(--shadow); transition:all .18s; text-align:left; width:100%; }
.role-card:active{ transform:scale(.98); }
.role-card .ri{ width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.role-card b{ display:block; font-size:15.5px; font-weight:800; }
.role-card span{ display:block; font-size:11px; color:var(--sub); margin-top:3px; }
.role-card .go{ margin-left:auto; color:var(--faint); }
/* 身份卡：把「这个身份属于哪一层、进去有几个模块」直接摆在卡上，四张卡第一眼即可对比 */
.role-card .rl-layer{ display:inline-block; font-size:8.5px; font-weight:800; padding:2px 6px; border-radius:5px; margin-left:7px; vertical-align:2px; letter-spacing:.2px; white-space:nowrap; }
.role-card .rl-mods{ display:flex; align-items:center; gap:4px; font-size:9px; color:var(--faint); margin-top:5px; }
.role-card .rl-mods i{ font-style:normal; color:#c9ced8; }
.login-foot{ padding:14px 24px calc(18px + env(safe-area-inset-bottom)); text-align:center; }
.login-foot p{ font-size:9.5px; color:var(--faint); line-height:1.8; }
.login-foot .agree{ font-size:10.5px; color:var(--sub); margin-bottom:6px; }
.login-foot .agree a{ color:var(--brand-deep); }
.login-back{ position:absolute; left:14px; top:56px; width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.22); display:flex; align-items:center; justify-content:center; color:#fff; z-index:3; }

/* ===== 游客端 ===== */
.greet-row{ display:flex; align-items:center; gap:12px; }
.avatar{ width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.24); display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800; border:1.5px solid rgba(255,255,255,.35); flex-shrink:0; }
.greet-row .gi b{ font-size:16.5px; font-weight:800; display:block; }
.greet-row .gi span{ font-size:10.5px; opacity:.85; display:flex; align-items:center; gap:5px; margin-top:3px; }
.lv-badge{ background:rgba(255,255,255,.22); padding:2px 8px; border-radius:9px; font-size:9.5px; font-weight:700; }
.did-chip{ display:inline-flex; align-items:center; gap:4px; background:rgba(255,255,255,.16); padding:3px 9px; border-radius:9px; font-size:9px; margin-top:7px; }
.searchbar{ margin:-22px 14px 12px; background:#fff; border-radius:13px; height:44px; display:flex; align-items:center; gap:8px; padding:0 14px; box-shadow:var(--shadow2); position:relative; z-index:3; color:var(--sub); font-size:12.5px; }
.searchbar svg{ color:var(--brand); flex-shrink:0; }
.cat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px 6px; padding:14px 12px 4px; background:#fff; border-radius:var(--r); margin:0 14px 12px; box-shadow:var(--shadow); }
.cat{ display:flex; flex-direction:column; align-items:center; gap:6px; transition:transform .12s; }
.cat:active{ transform:scale(.92); }
.cat .ci{ width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; }
.cat .ci svg{ width:23px; height:23px; }
.cat span{ font-size:10.5px; color:var(--ink2); font-weight:600; }
.promo{ margin:0 14px 12px; border-radius:var(--r); overflow:hidden; position:relative; box-shadow:var(--shadow); }
.tour{ margin:0 14px 12px; background:#fff; border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow); transition:transform .12s; }
.tour:active{ transform:scale(.985); }
.tour-cover{ height:132px; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; }

.bottom-bar{ flex-shrink:0; background:rgba(255,255,255,.94); backdrop-filter:blur(14px); border-top:1px solid var(--line); padding:10px 16px calc(12px + env(safe-area-inset-bottom)); display:flex; align-items:center; gap:12px; }

/* 订单表单 sheet */

.form-input{ display:block; width:100%; height:48px; background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:0 14px; font-size:13.5px; color:var(--ink); font-family:inherit; transition:border-color .2s; }

.beans-row .bt{ flex:1; }
.beans-row .bt b{ font-size:12.5px; display:block; }
.beans-row .bt span{ font-size:10px; color:var(--sub); margin-top:2px; display:block; }
.pay-ok{ text-align:center; padding:10px 0 4px; }
.pay-ok .ok-ic{ width:62px; height:62px; border-radius:50%; background:#e7f6ee; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; animation:pop .45s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop{ from{ transform:scale(.4); opacity:0; } to{ transform:scale(1); opacity:1; } }

.pay-ok .sub{ font-size:11.5px; color:var(--sub); margin:6px 0 16px; }
.pay-detail{ background:#f8f9fb; border-radius:12px; padding:13px 15px; text-align:left; margin-bottom:16px; }
.spinner{ width:44px; height:44px; border:3.5px solid #eef0f3; border-top-color:var(--brand); border-radius:50%; animation:rot .8s linear infinite; margin:26px auto 14px; }

/* 搜索页 */

/* 时间轴/步骤 */
.flow-steps{ padding:6px 0; }
.flow-step{ display:flex; gap:12px; padding:9px 0; }
.flow-step .fsn{ width:22px; height:22px; border-radius:50%; background:var(--brand-soft); color:var(--brand-deep); font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

/* QR */

/* 海报 */

.poster-bg{ background:linear-gradient(160deg,#2f6f9f,#5ba8c9); padding:30px 22px 26px; color:#fff; text-align:center; position:relative; overflow:hidden; }

.poster-step span{ display:block; font-size:9px; color:var(--sub); margin-top:2px; }
.poster-step .pn{ width:24px; height:24px; border-radius:50%; background:var(--brand); color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; margin:0 auto; }

/* 等级分润 */

.level-row .li{ flex:1; }

/* 合伙人 hero */
.partner-hero{ background:linear-gradient(135deg,#2f6f9f,#5ba8c9); margin:12px 14px; border-radius:18px; padding:20px; color:#fff; position:relative; overflow:hidden; }

.highlight-pulse{ animation:pulse 1.1s ease 2; border-radius:10px; }

/* 商户端 */
.merch-hero{ background:linear-gradient(135deg,#7b5aa6,#a97fd1); margin:12px 14px; border-radius:18px; padding:20px; color:#fff; position:relative; overflow:hidden; }
.merch-hero::before{ content:''; position:absolute; right:-40px; top:-40px; width:150px; height:150px; border-radius:50%; background:rgba(255,255,255,.08); }

/* 联动日志 */

/* ==========================================================================
   视觉增强层 v2 · 场景图 / 卡片重制 / 图表 / 新模块
   ========================================================================== */

/* ---------- 场景图容器 ---------- */
.scene{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.imgwrap{ position:relative; overflow:hidden; background:#e6e9ee; }
.imgwrap > .scene{ position:absolute; }
.imgwrap::after{ content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(180deg, rgba(8,12,22,.12) 0%, rgba(8,12,22,0) 30%, rgba(8,12,22,.58) 100%); }
.imgwrap.flat::after{ background:linear-gradient(180deg, rgba(8,12,22,.06), rgba(8,12,22,.22)); }
.imgwrap .ovl{ position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; justify-content:flex-end; padding:11px 12px; }
.scene-slow .scene{ animation:kenburns 26s ease-in-out infinite alternate; }
@keyframes kenburns{ from{ transform:scale(1) translate(0,0); } to{ transform:scale(1.09) translate(-2%,-1.5%); } }

/* ---------- 线路卡 v2 ---------- */
.tour{ margin:0 14px 13px; background:#fff; border-radius:18px; overflow:hidden; box-shadow:0 6px 20px rgba(18,28,45,.07); transition:transform .14s, box-shadow .14s; }
.tour:active{ transform:scale(.986); box-shadow:0 3px 12px rgba(18,28,45,.10); }
.tour .tc{ height:168px; position:relative; overflow:hidden; }
.tour .tc .tt2h{ position:absolute; left:13px; right:13px; bottom:11px; z-index:3; color:#fff; }
.tour .tc .tt2h .loc2{ font-size:10.5px; opacity:.9; display:flex; align-items:center; gap:4px; margin-bottom:5px; font-weight:600; }
.tour .tc .tt2h h3{ font-size:19.5px; font-weight:900; letter-spacing:.4px; text-shadow:0 2px 12px rgba(0,0,0,.30); line-height:1.25; }
.tour .flags{ position:absolute; top:11px; left:11px; display:flex; gap:5px; z-index:3; }
.tour .flags .fg2{ font-size:9px; font-weight:800; padding:3.5px 8px; border-radius:7px; color:#fff; backdrop-filter:blur(6px); letter-spacing:.5px; }
.tour .tc .ph-count{ position:absolute; right:11px; bottom:11px; z-index:3; font-size:9px; color:#fff; background:rgba(10,16,28,.42); backdrop-filter:blur(8px); padding:4px 8px; border-radius:8px; display:flex; align-items:center; gap:4px; }
.tour .ti2{ padding:11px 13px 12px; }
.tour .ti2 .row1{ display:flex; align-items:flex-start; gap:8px; }
.tour .ti2 .row1 p{ flex:1; font-size:11px; color:var(--sub); line-height:1.55; }
.tour .ti2 .row2{ display:flex; align-items:flex-end; margin-top:10px; }
.tour .ti2 .price2{ font-size:21px; font-weight:900; color:var(--brand); line-height:1; letter-spacing:-.5px; }
.tour .ti2 .price2 small{ font-size:10px; font-weight:600; color:var(--sub); margin-left:2px; }
.tour .ti2 .ds{ font-size:9px; color:var(--faint); text-decoration:line-through; margin-left:5px; margin-bottom:2px; }
.tour .ti2 .eb{ margin-left:auto; font-size:9.5px; font-weight:800; color:#8a5b12; background:linear-gradient(135deg,#fff3d8,#ffe7b3); padding:5px 9px; border-radius:9px; display:flex; align-items:center; gap:3px; }
.tour .ti2 .meta2{ display:flex; align-items:center; gap:9px; margin-top:8px; padding-top:8px; border-top:1px dashed #eef1f4; font-size:9.5px; color:var(--sub); }
.tour .ti2 .meta2 .m{ display:flex; align-items:center; gap:3.5px; }
.tour .ti2 .meta2 .m svg{ width:11px; height:11px; }
.tour .ti2 .meta2 .avs{ margin-left:auto; display:flex; }
.tour .ti2 .meta2 .avs span{ width:17px; height:17px; border-radius:50%; border:1.5px solid #fff; margin-left:-5px; background:#dfe4ea; display:flex; align-items:center; justify-content:center; font-size:7.5px; color:#fff; font-weight:700; }

/* 横滑卡片组 */
.hsc{ display:flex; gap:11px; overflow-x:auto; padding:2px 14px 4px; scrollbar-width:none; scroll-snap-type:x mandatory; }
.hsc::-webkit-scrollbar{ display:none; }
.hsc .mini{ flex:0 0 132px; scroll-snap-align:start; background:#fff; border-radius:15px; overflow:hidden; box-shadow:0 4px 14px rgba(18,28,45,.07); }
.hsc .mini .mc{ height:88px; position:relative; }
.hsc .mini .mi{ padding:8px 10px 10px; }
.hsc .mini .mi b{ display:block; font-size:11.5px; font-weight:800; line-height:1.35; }
.hsc .mini .mi .mp{ display:flex; align-items:baseline; gap:4px; margin-top:6px; }
.hsc .mini .mi .mp b{ color:var(--brand); font-size:14px; font-weight:900; }
.hsc .mini .mi .mp span{ font-size:8.5px; color:var(--faint); }

/* ---------- 商品卡 v2 ---------- */
.prod{ margin:0 14px 11px; background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 5px 18px rgba(18,28,45,.07); display:flex; gap:11px; padding:11px; transition:transform .12s; }
.prod:active{ transform:scale(.986); }
.prod .pp{ width:94px; height:94px; flex:0 0 94px; border-radius:13px; overflow:hidden; position:relative; }
.prod .pi2{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; }
.prod .pi2 h3{ font-size:13px; font-weight:800; line-height:1.38; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.prod .pi2 .pd{ font-size:9.5px; color:var(--sub); margin-top:3px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
.prod .pi2 .ptags{ display:flex; gap:4px; margin-top:5px; flex-wrap:nowrap; overflow:hidden; }
.prod .pi2 .pf{ margin-top:auto; display:flex; align-items:baseline; gap:5px; }
.prod .pi2 .pf b{ color:var(--brand); font-size:16.5px; font-weight:900; letter-spacing:-.3px; }
.prod .pi2 .pf del{ font-size:9px; color:var(--faint); }
.prod .pi2 .pf .sold{ font-size:8.5px; color:var(--faint); margin-left:auto; }

/* ---------- 详情页图廊 ---------- */
.gal{ height:250px; position:relative; overflow:hidden; }
.gal .gslides{ display:flex; height:100%; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
.gal .gslides::-webkit-scrollbar{ display:none; }
.gal .gs{ flex:0 0 100%; height:100%; position:relative; scroll-snap-align:center; }
.gal .gdots{ position:absolute; bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:5px; z-index:4; }
.gal .gdots i{ width:5px; height:5px; border-radius:3px; background:rgba(255,255,255,.5); transition:all .25s; }
.gal .gdots i.on{ width:16px; background:#fff; }
.gal .gidx{ position:absolute; top:52px; right:13px; z-index:4; font-size:9.5px; color:#fff; background:rgba(10,16,28,.4); backdrop-filter:blur(8px); padding:4px 9px; border-radius:9px; font-weight:700; }
.gal .gtitle{ position:absolute; left:14px; right:14px; bottom:34px; z-index:3; color:#fff; }
.gal .gtitle h2{ font-size:22px; font-weight:900; line-height:1.25; text-shadow:0 2px 14px rgba(0,0,0,.35); }
.gal .gtitle .gm{ display:flex; gap:12px; margin-top:8px; font-size:10px; opacity:.94; }
.gal .gtitle .gm span{ display:flex; align-items:center; gap:4px; }

/* ---------- 图表 ---------- */
.chart{ width:100%; height:auto; display:block; color:var(--ink); }
.chart.ring{ width:auto; }
.chart-box{ background:#fff; margin:0 14px 12px; border-radius:16px; padding:14px; box-shadow:0 5px 18px rgba(18,28,45,.06); }
.chart-box .ch{ display:flex; align-items:center; margin-bottom:12px; }
.chart-box .ch b{ font-size:13px; font-weight:800; }
.chart-box .ch .cv{ margin-left:auto; font-size:9.5px; color:var(--sub); }
.chart-box .legend{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
.chart-box .legend i{ display:flex; align-items:center; gap:5px; font-size:9.5px; color:var(--sub); }
.chart-box .legend i em{ width:7px; height:7px; border-radius:2px; display:block; }

/* 大数字 + 迷你趋势 */
.kpi-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin:0 14px 12px; }
.kpi{ background:#fff; border-radius:15px; padding:11px 12px; box-shadow:0 4px 14px rgba(18,28,45,.06); }
.kpi .kl{ font-size:9.5px; color:var(--sub); display:flex; align-items:center; gap:4px; }
.kpi .kv{ font-size:19px; font-weight:900; margin-top:5px; letter-spacing:-.5px; font-variant-numeric:tabular-nums; }
.kpi .kv small{ font-size:10px; font-weight:600; color:var(--sub); margin-left:2px; }
.kpi .kd{ font-size:9px; margin-top:4px; display:flex; align-items:center; gap:3px; }
.kpi .kd.up{ color:#e03131; }
.kpi .kd.down{ color:#0f9d58; }

/* ---------- 徽章墙 v2 ---------- */
.badge-wall{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px 6px; padding:4px 0 2px; }
.badge-item{ text-align:center; }
.badge-item .medal-svg{ width:56px; height:56px; display:block; margin:0 auto; filter:drop-shadow(0 3px 8px rgba(20,30,50,.16)); transition:transform .2s; }

.badge-n{ font-size:9.5px; font-weight:700; margin-top:6px; line-height:1.3; }
.badge-s{ font-size:8px; color:var(--faint); margin-top:2px; }

/* ---------- 榜单 ---------- */
.rank{ background:#fff; margin:0 14px 12px; border-radius:16px; overflow:hidden; box-shadow:0 5px 18px rgba(18,28,45,.06); }
.rank .rh{ display:flex; align-items:center; padding:12px 14px 8px; }
.rank .rh b{ font-size:13px; font-weight:800; }
.rank .rh span{ margin-left:auto; font-size:9.5px; color:var(--sub); display:flex; align-items:center; gap:3px; }
.rank .ri{ display:flex; align-items:center; gap:10px; padding:8px 14px; }
.rank .ri:active{ background:#fafbfc; }
.rank .ri .no{ width:19px; flex:0 0 19px; font-size:12px; font-weight:900; color:#c8ced8; text-align:center; font-style:italic; }
.rank .ri.top1 .no{ color:#e87722; }
.rank .ri.top2 .no{ color:#f59f00; }
.rank .ri.top3 .no{ color:#b08d57; }
.rank .ri .rimg{ width:40px; height:40px; border-radius:10px; overflow:hidden; flex:0 0 40px; position:relative; }
.rank .ri .rt2{ flex:1; min-width:0; }

.rank .ri .rt2 span{ font-size:9px; color:var(--sub); }
.rank .ri .rv2{ text-align:right; font-size:11px; font-weight:800; color:var(--brand); }
.rank .ri .rv2 em{ display:block; font-size:8.5px; color:var(--faint); font-weight:500; font-style:normal; margin-top:2px; }
.rank .rf{ padding:10px 14px 12px; text-align:center; font-size:10px; color:var(--sub); border-top:1px solid #f4f6f8; display:flex; align-items:center; justify-content:center; gap:4px; }

/* ---------- 笔记/内容流（两列瀑布） ---------- */
.notes{ column-count:2; column-gap:9px; padding:0 14px; }
.notes .nt{ break-inside:avoid; margin-bottom:9px; background:#fff; border-radius:13px; overflow:hidden; box-shadow:0 3px 12px rgba(18,28,45,.06); }
.notes .nt .nc{ position:relative; }
.notes .nt .nc.a{ height:126px; }
.notes .nt .nc.b{ height:92px; }
.notes .nt .nc.c{ height:158px; }
.notes .nt .nb{ padding:8px 9px 9px; }
.notes .nt .nb p{ font-size:10.5px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.notes .nt .nb .nf{ display:flex; align-items:center; gap:5px; margin-top:7px; }
.notes .nt .nb .nf .av2{ width:16px; height:16px; border-radius:50%; overflow:hidden; flex:0 0 16px; }
.notes .nt .nb .nf span{ font-size:8.5px; color:var(--sub); }
.notes .nt .nb .nf .lk{ margin-left:auto; font-size:8.5px; color:var(--faint); display:flex; align-items:center; gap:2px; }
.notes .nt .nc .tagp{ position:absolute; top:6px; left:6px; z-index:2; font-size:8px; color:#fff; background:rgba(10,16,28,.42); backdrop-filter:blur(6px); padding:2.5px 6px; border-radius:6px; }

/* ---------- 时间轴 ---------- */
.tl{ position:relative; padding-left:0; }
.tl .tli{ display:flex; gap:11px; position:relative; padding-bottom:15px; }
.tl .tli:last-child{ padding-bottom:0; }
.tl .tli .dot{ width:9px; height:9px; border-radius:50%; background:var(--brand); flex:0 0 9px; margin-top:4px; position:relative; z-index:2; box-shadow:0 0 0 3px rgba(232,119,34,.14); }
.tl .tli.done .dot{ background:#0f9d58; box-shadow:0 0 0 3px rgba(15,157,88,.14); }
.tl .tli.off .dot{ background:#d3d9e0; box-shadow:none; }
.tl .tli .bar{ position:absolute; left:4px; top:13px; bottom:0; width:1.5px; background:#eceff3; z-index:1; }
.tl .tli:last-child .bar{ display:none; }
.tl .tli .tx{ flex:1; }
.tl .tli .tx b{ font-size:12px; font-weight:700; display:block; }
.tl .tli .tx span{ font-size:10px; color:var(--sub); line-height:1.5; display:block; margin-top:2px; }
.tl .tli .tx .tm{ font-size:9px; color:var(--faint); margin-top:3px; }

/* ---------- 进度条 ---------- */
.pbar{ height:6px; border-radius:4px; background:#eef1f4; overflow:hidden; }
.pbar i{ display:block; height:100%; border-radius:4px; background:linear-gradient(90deg,#ffb15c,#e87722); }
.pbar.g i{ background:linear-gradient(90deg,#57cc99,#0f9d58); }
.pbar.b i{ background:linear-gradient(90deg,#74c0fc,#1c7ed6); }

/* ---------- 分段控件 ---------- */
.seg{ display:flex; background:#f1f3f6; border-radius:11px; padding:3px; margin:0 14px 12px; }
.seg button{ flex:1; font-size:11px; font-weight:700; color:var(--sub); padding:7px 0; border-radius:9px; transition:all .18s; }
.seg button.on{ background:#fff; color:var(--ink); box-shadow:0 2px 6px rgba(20,30,50,.10); }

/* ---------- 信息密度：键值行 ---------- */
.kvs{ display:flex; justify-content:space-between; padding:7px 0; font-size:11.5px; }
.kvs + .kvs{ border-top:1px dashed #f0f2f5; }
.kvs span{ color:var(--sub); }
.kvs b{ font-weight:700; }

/* ---------- 经营简报 / 洞察卡 ---------- */
.insight{ margin:0 14px 12px; border-radius:16px; padding:13px 14px; background:linear-gradient(135deg,#f2f8ff,#eaf3ff); border:1px solid #e2eeff; }
.insight .ih{ display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:800; color:#1864ab; }
.insight p{ font-size:10.5px; color:#3c5878; line-height:1.6; margin-top:7px; }
.insight.warm{ background:linear-gradient(135deg,#fff7ec,#fff1de); border-color:#ffe3c2; }
.insight.warm .ih{ color:#a85b12; }
.insight.warm p{ color:#7a5326; }
.insight.gr{ background:linear-gradient(135deg,#eefaf3,#e4f7ec); border-color:#cdeedd; }
.insight.gr .ih{ color:#0b7a4b; }
.insight.gr p{ color:#24614a; }

/* ---------- 热力日历 ---------- */
.heat{ display:grid; grid-template-columns:repeat(14,1fr); gap:3px; }
.heat i{ aspect-ratio:1; border-radius:2.5px; background:#eef1f4; display:block; }
.heat i.l1{ background:#ffe0bf; } .heat i.l2{ background:#ffc283; }
.heat i.l3{ background:#f79c42; } .heat i.l4{ background:#e87722; }

/* ---------- 立绘式角色卡 ---------- */
.role-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 0 2px; }
.role-pick{ background:#fff; border:1.5px solid #eef0f3; border-radius:15px; padding:0; text-align:left; overflow:hidden; transition:all .18s; position:relative; }
.role-pick .rp-img{ height:74px; position:relative; overflow:hidden; }
.role-pick .rp-body{ padding:9px 10px 10px; }
.role-pick b{ font-size:12.5px; font-weight:800; display:block; }
.role-pick span{ font-size:9px; color:var(--sub); display:block; margin-top:3px; line-height:1.45; }
.role-pick.on{ border-color:var(--brand); box-shadow:0 0 0 3px rgba(232,119,34,.12); }
.role-pick .tick{ position:absolute; top:7px; right:7px; width:15px; height:15px; border-radius:50%; background:var(--brand); color:#fff; display:none; align-items:center; justify-content:center; z-index:4; }
.role-pick .tick svg{ width:9px; height:9px; }
.role-pick.on .tick{ display:flex; }

/* ---------- 票券 ---------- */
.ticket{ position:relative; background:#fff; border-radius:14px; margin:0 0 11px; box-shadow:0 4px 14px rgba(18,28,45,.07); overflow:hidden; display:flex; }
.ticket .tk-l{ flex:1; padding:13px; }
.ticket .tk-r{ width:88px; flex:0 0 88px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  border-left:1.5px dashed #e7ebf0; background:linear-gradient(180deg,#fffaf3,#fff6ea); }
.ticket .tk-r b{ font-size:17px; font-weight:900; color:var(--brand); }
.ticket .tk-r span{ font-size:8.5px; color:var(--sub); }
.ticket .tk-notch{ position:absolute; width:11px; height:11px; border-radius:50%; background:var(--bg); }
.ticket .tk-notch.l{ left:-1px; top:50%; margin-top:-5.5px; transform:translateX(-50%); }
.ticket .tk-notch.r{ right:-1px; top:50%; margin-top:-5.5px; transform:translateX(50%); }

/* ---------- 核销盖章 ---------- */
.stamp-wrap{ position:relative; display:flex; justify-content:center; padding:6px 0 2px; }
.stamp-svg{ width:104px; height:104px; transform:rotate(-11deg); opacity:0; }
.stamp-svg.hit{ animation:stampin .5s cubic-bezier(.2,1.4,.4,1) forwards; }
@keyframes stampin{
  0%{ transform:rotate(-11deg) scale(2.6); opacity:0; }
  62%{ transform:rotate(-11deg) scale(.94); opacity:1; }
  100%{ transform:rotate(-11deg) scale(1); opacity:.92; }
}

/* ---------- DID 卡修正 ---------- */
.did-card{ background:linear-gradient(135deg,#1b2a44,#243b5e 58%,#2f4d73); border-radius:18px; padding:15px; color:#fff; position:relative; overflow:hidden; }
.did-card::before{ content:''; position:absolute; right:-46px; top:-52px; width:150px; height:150px; border-radius:50%; background:radial-gradient(circle,rgba(120,180,255,.30),rgba(120,180,255,0) 66%); }
.did-card::after{ content:''; position:absolute; left:-30px; bottom:-70px; width:140px; height:140px; border-radius:50%; background:radial-gradient(circle,rgba(232,119,34,.26),rgba(232,119,34,0) 68%); }
.did-card .dh{ display:flex; align-items:center; gap:9px; position:relative; z-index:2; }
.did-card .dh .di{ width:36px; height:36px; border-radius:11px; background:linear-gradient(135deg,#ffb15c,#e87722); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.did-card .dh .di svg{ width:19px; height:19px; color:#fff; }
.did-card .dh b{ font-size:15.5px; font-weight:900; letter-spacing:.3px; display:block; }

  background:#f3f8fc; color:#2f6f9f; font-size:9.5px; font-weight:800; cursor:pointer; }

/* ===== 演示模式：自适应铺满一屏（v1.9.1）===== */
.fit-btn{ position:fixed; top:14px; right:16px; z-index:999; height:32px; padding:0 13px;
  border-radius:16px; background:rgba(255,255,255,.94); border:1px solid var(--line);
  box-shadow:0 4px 16px rgba(10,20,40,.14); font-size:12px; font-weight:700; color:var(--ink2);
  align-items:center; gap:6px; cursor:pointer; font-family:inherit; }
.fit-btn:hover{ color:var(--brand); border-color:#bcd4e6; }
.fit-btn svg{ flex-shrink:0; }
/* 卡片级跳转入口（旅豆三层闭环 → 闭环详情） */
.loop-jump{ cursor:pointer; transition:transform .12s, box-shadow .12s; }
.loop-jump:active{ transform:scale(.985); box-shadow:inset 0 0 0 1px rgba(0,0,0,.04); }

/* ===== 经营驾驶舱 · 口径切换与派生视图（v1.10）===== */
/* 口径切换器：吸顶，切 tab 不丢上下文 */
.rng-bar{ display:flex; gap:4px; margin:0 14px 9px; padding:5px; background:#fff;
  border-radius:13px; box-shadow:var(--shadow); position:sticky; top:0; z-index:7; }
.rng-bar b{ flex:1; text-align:center; font-size:10.5px; font-weight:700; padding:7px 0;
  border-radius:9px; color:var(--sub); cursor:pointer; transition:.16s; white-space:nowrap; }
.rng-bar b.on{ background:linear-gradient(135deg,#0f766e,#14b8a6); color:#fff;
  box-shadow:0 4px 10px -5px rgba(15,118,110,.75); }
.rng-bar b:active{ transform:scale(.96); }
.rng-hint{ margin:-4px 16px 11px; font-size:9px; color:var(--sub); display:flex;
  align-items:center; gap:5px; line-height:1.5; }
.rng-hint em{ font-style:normal; color:var(--ink2); font-weight:700; }

/* KPI 目标达成条 */
.admin-kpi .ak .tgt{ height:3px; border-radius:2px; background:#eef1f4; margin-top:6px; overflow:hidden; }
.admin-kpi .ak .tgt i{ display:block; height:100%; border-radius:2px;
  background:linear-gradient(90deg,#57cc99,#0f9d58); transition:width .5s; }
.admin-kpi .ak .tgt.mid i{ background:linear-gradient(90deg,#ffd43b,#f59f00); }
.admin-kpi .ak .tgt.low i{ background:linear-gradient(90deg,#ffa8a8,#e03131); }
.admin-kpi .ak .kn{ font-size:15.5px; font-weight:900; display:block; letter-spacing:-.3px; }
.admin-kpi .ak .tr .dv{ font-variant-numeric:tabular-nums; }
.vup{ color:#e03131; } .vdn{ color:#0f9d58; } .vflat{ color:var(--sub); }

/* 诊断条：把数字翻译成结论 */
.dgn{ margin:0 14px 12px; background:#fff; border-radius:var(--r); box-shadow:var(--shadow);
  overflow:hidden; }
.dgn-h{ display:flex; align-items:center; gap:7px; padding:12px 14px 9px; font-size:12.5px; font-weight:800; }
.dgn-h span{ margin-left:auto; font-size:9px; color:var(--sub); font-weight:400; }
.dgn-row{ display:flex; gap:9px; padding:9px 14px; border-top:1px solid #f4f5f7;
  font-size:10.5px; line-height:1.62; color:var(--sub); align-items:flex-start; }
.dgn-row.jump{ cursor:pointer; }
.dgn-row.jump:active{ background:#fafbfc; }
.dgn-row em{ flex-shrink:0; width:3px; align-self:stretch; border-radius:2px; margin-top:1px; }
.dgn-row .dt{ flex-shrink:0; font-weight:800; font-size:10.5px; color:var(--ink2); }
.dgn-row .db{ flex:1; min-width:0; }
.dgn-row .db b{ color:var(--ink); font-weight:800; }
.dgn-row .go{ flex-shrink:0; color:#b6c2cf; }

/* 分城经营明细 */
.ct-h, .ct-r{ display:grid; grid-template-columns:1.65fr .95fr .62fr .58fr; gap:6px; align-items:center; }
.ct-h{ font-size:8.5px; color:var(--sub); padding:0 0 7px; border-bottom:1px solid #eef1f4; }
.ct-h b:not(:first-child), .ct-r span, .ct-r em{ text-align:right; }
.ct-r{ padding:9px 0; border-bottom:1px solid #f7f8fa; font-size:10.5px; }
.ct-r:last-child{ border-bottom:0; }
.ct-r .cn{ display:flex; align-items:center; gap:6px; overflow:hidden; }
.ct-r .cn i{ width:6px; height:6px; border-radius:2px; flex-shrink:0; }
.ct-r .cn b{ font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; }
.ct-r .cg{ font-weight:800; color:#0f766e; }
.ct-r em{ font-style:normal; font-size:9px; color:var(--sub); }
.ct-tot{ display:flex; align-items:center; justify-content:space-between; margin-top:9px;
  padding-top:9px; border-top:1px dashed #e6eaee; font-size:10px; color:var(--sub); }
.ct-tot b{ color:var(--ink); font-weight:800; }

/* ===== 列表「还有 N 条」折叠行（v1.11 数据扩容配套）===== */
.more-line{ margin:12px 14px 4px; padding:13px 0; text-align:center; font-size:11.5px;
  font-weight:700; color:#0f766e; background:#fff; border-radius:12px;
  box-shadow:var(--shadow); cursor:pointer; display:flex; align-items:center;
  justify-content:center; gap:5px; }
.more-line:active{ transform:scale(.985); background:#f7fbfa; }
.more-line svg{ width:12px; height:12px; }

</style>

/* ===== 数字滚动 ===== */
function countUp(el, to, dur=800, prefix=''){
  const from = 0, start = performance.now();
  function step(t){
    const p = Math.min(1, (t-start)/dur), e = 1-Math.pow(1-p,3);
    el.textContent = prefix + Math.round(from + (to-from)*e).toLocaleString('zh-CN');
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function runCounters(root){
  root.querySelectorAll('[data-count]').forEach(el=>{
    if(el.dataset.done) return; el.dataset.done = '1';
    countUp(el, parseFloat(el.dataset.count), 900, el.dataset.prefix||'');
  });
}

/* ===== 礼花 ===== */
const confetti = (()=>{
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  let ps = [], raf = null;
  function resize(){ cv.width = cv.offsetWidth; cv.height = cv.offsetHeight; }
  window.addEventListener('resize', resize);
  function fire(){
    resize();
    const colors = ['#e87722','#f5a623','#4ade80','#60a5fa','#c084fc','#f472b6'];
    for(let i=0;i<90;i++){
      ps.push({ x:cv.width/2 + (Math.random()-.5)*120, y:cv.height*0.42,
        vx:(Math.random()-.5)*9, vy:-(Math.random()*11+5),
        s:Math.random()*5+3, c:colors[i%colors.length], r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, life:1 });
    }
    if(!raf) tick();
  }
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{ p.vy += 0.32; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= 0.012; });
    ps = ps.filter(p=>p.life>0 && p.y < cv.height+30);
    ps.forEach(p=>{ ctx.save(); ctx.globalAlpha = Math.max(0,p.life); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62); ctx.restore(); });
    if(ps.length){ raf = requestAnimationFrame(tick); } else { raf = null; ctx.clearRect(0,0,cv.width,cv.height); }
  }
  return { fire };
})();

/* ===== 下拉刷新 ===== */
function bindPullRefresh(scrollEl, onRefresh){
  if(scrollEl._ptrBound) return;
  scrollEl._ptrBound = true;
  let sy = 0, pulling = false, dist = 0;
  const ptr = scrollEl.querySelector('.ptr');
  scrollEl.addEventListener('touchstart', e=>{ if(scrollEl.scrollTop<=0){ sy = e.touches[0].clientY; pulling = true; dist=0; } }, {passive:true});
  scrollEl.addEventListener('touchmove', e=>{
    if(!pulling) return;
    dist = e.touches[0].clientY - sy;
    if(dist>0 && ptr){ ptr.style.height = Math.min(60, dist*0.5)+'px'; ptr.innerHTML = dist>70 ? '松开刷新' : '下拉刷新'; }
  }, {passive:true});
  scrollEl.addEventListener('touchend', ()=>{
    if(!pulling) return; pulling = false;
    if(dist>70 && ptr){
      ptr.classList.add('show'); ptr.innerHTML = '<span class="spin"></span>正在刷新';
      setTimeout(()=>{ ptr.style.height='0'; ptr.classList.remove('show'); onRefresh && onRefresh(); }, 800);
    } else if(ptr){ ptr.style.height='0'; }
  });
}

function _ridge(R, baseY, amp, W, H, steps){
  var pts = [], i;
  for(i=0;i<=steps;i++){
    var x = W*i/steps;
    var peak = (i%2===1);
    var y = baseY - amp*(peak ? 0.62+0.55*R() : 0.10+0.28*R());
    pts.push([x, y]);
  }
  var d = 'M0 '+baseY;
  for(i=0;i<pts.length;i++){
    var p = pts[i];
    if(i===0){ d += ' L '+p[0].toFixed(1)+' '+p[1].toFixed(1); continue; }
    var q = pts[i-1];
    var mx = (q[0]+p[0])/2, my = Math.min(q[1],p[1]) - amp*0.06;
    d += ' Q '+mx.toFixed(1)+' '+my.toFixed(1)+' '+p[0].toFixed(1)+' '+p[1].toFixed(1);
  }
  return d + ' L '+W+' '+H+' L 0 '+H+' Z';
}

/* 江南屋顶：三角瓦顶 + 翘角 */
function _roof(x, y, w, h, fill){
  const e = w*0.09;

         ' q '+(-e*0.5)+' '+h*0.16+' '+(-e)+' 0 L '+x+' '+(y+h)+' Z" fill="'+fill+'"/>';
}

    for(let i=0;i<46;i++){

      waves += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="1.2" rx=".6" fill="#ffffff" opacity="'+_r(R,.08,.28).toFixed(2)+'"/>';

    + (c.water ? '<linearGradient id="'+uid+'w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+c.near+'"/><stop offset="1" stop-color="'+c.ground+'"/></linearGradient>' : '')

    + '<radialGradient id="'+uid+'v" cx=".5" cy=".45" r=".78"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="'+(c.vig)+'"/></radialGradient>'
    + '</defs>'

    + stars + clouds

function sceneOf(o){

/* ===== 剧本闯关 · 朱家角地图（全程序化生成，无外部图片）===== */
function scriptMapSVG(curId, doneIds){
  const W = 400, H = 250;
  const R = srnd(20261019);
  const nodes = DB.scriptData.nodes;
  let g = '';
  /* 宣纸底 + 纸纹 */
  g += '<rect width="'+W+'" height="'+H+'" fill="#f6f1e7"/>';
  for(let i=0;i<24;i++){
    g += '<line x1="'+_r(R,0,W).toFixed(1)+'" y1="0" x2="'+_r(R,0,W).toFixed(1)+'" y2="'+H+'" stroke="#e6decb" stroke-width="'+_r(R,.4,1).toFixed(1)+'" opacity=".55"/>';
  }
  /* 远山 */
  g += '<path d="M0 92 q 58 -32 118 -6 q 58 26 116 -10 q 62 -32 166 4 L '+W+' 0 L0 0 Z" fill="#dfe7dc" opacity=".85"/>';
  /* 漕港河 */
  const river = 'M -10 212 C 70 198, 96 150, 168 148 S 300 178, 330 96 S 380 40, 412 34';
  g += '<path d="'+river+'" fill="none" stroke="#a9c9d0" stroke-width="26" stroke-linecap="round" opacity=".8"/>';
  g += '<path d="'+river+'" fill="none" stroke="#d6ebef" stroke-width="12" stroke-linecap="round"/>';
  for(let i=0;i<14;i++){
    const x = _r(R, 24, W-24), y = 158 + Math.sin(i*1.1)*42 + _r(R,-12,12);
    g += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+_r(R,10,26).toFixed(1)+'" height="1.4" rx=".7" fill="#8fb8c0" opacity=".4"/>';
  }
  /* 街巷虚线 */
  const road = 'M ' + nodes.map(n=>(n.x/100*W).toFixed(1)+' '+(n.y/100*H).toFixed(1)).join(' L ');
  g += '<path d="'+road+'" fill="none" stroke="#c9b896" stroke-width="7" stroke-dasharray="1 7" stroke-linecap="round" opacity=".9"/>';
  /* 节点 */
  nodes.forEach(n=>{
    const px = n.x/100*W, py = n.y/100*H;
    const isCur = n.id===curId, isDone = (doneIds||[]).indexOf(n.id)>=0;
    const c = isDone ? '#0f9d58' : (isCur ? '#e87722' : '#8a919c');
    g += '<circle cx="'+px+'" cy="'+py+'" r="13" fill="#fff" stroke="'+c+'" stroke-width="'+(isCur?3:2)+'"/>';
    if(isDone){
      g += '<path d="M '+(px-5)+' '+(py+1)+' l 4 5 l 7 -9" fill="none" stroke="'+c+'" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>';
    } else {
      g += '<circle cx="'+px+'" cy="'+py+'" r="4" fill="'+c+'"/>';
    }
    if(isCur){
      g += '<circle cx="'+px+'" cy="'+py+'" r="13" fill="none" stroke="'+c+'" stroke-width="2" opacity=".75"><animate attributeName="r" from="13" to="26" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" from=".75" to="0" dur="1.6s" repeatCount="indefinite"/></circle>';
      g += '<g transform="translate('+(px-8)+','+(py-36)+')"><rect x="0" y="0" width="2" height="14" fill="#5a4a3a"/><path d="M2 1 q 12 4 16 0 q -3 10 -16 8 Z" fill="#e87722"/></g>';
    }
    const anchor = px > W*0.78 ? 'end' : (px < W*0.2 ? 'start' : 'middle');
    const tx = anchor==='end' ? px+16 : (anchor==='start' ? px-16 : px);
    g += '<text x="'+tx+'" y="'+(py+30)+'" text-anchor="'+anchor+'" font-size="11" font-weight="800" fill="#4a3f2f">'+n.n+'</text>';
    if(isCur){ g += '<text x="'+tx+'" y="'+(py+43)+'" text-anchor="'+anchor+'" font-size="8" fill="#e87722">当前位置</text>'; }
  });
  /* 罗盘 */
  g += '<g transform="translate(364,28)" opacity=".75"><circle r="13" fill="none" stroke="#8a919c" stroke-width="1.4"/><path d="M0 -9 L 4 0 L 0 9 L -4 0 Z" fill="#c92a2a"/><text y="-15" text-anchor="middle" font-size="8" fill="#4a3f2f">北</text></g>';
  /* 图例 */
  g += '<g transform="translate(14,'+(H-24)+')"><circle r="5" fill="#0f9d58"/><text x="10" y="3.5" font-size="8.5" fill="#4a3f2f">已完成</text><circle cx="72" r="5" fill="#e87722"/><text x="82" y="3.5" font-size="8.5" fill="#4a3f2f">当前位置</text><circle cx="152" r="5" fill="#fff" stroke="#8a919c" stroke-width="1.6"/><text x="162" y="3.5" font-size="8.5" fill="#4a3f2f">待解锁</text></g>';
  return '<svg class="script-map" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+g+'</svg>';
}

<script>

/* 柱状图 */
function barsSVG(data, opt){
  opt = opt || {};

  data.forEach(function(d,i){
    const bh = Math.max(4, (d.v/max)*(H-22));
    const x = pad + i*bw + bw*0.16, w = bw*0.68;
    const hi = opt.hi === i;
    out += '<rect x="'+x.toFixed(1)+'" y="'+(H-16-bh).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="'+(w/2.6).toFixed(1)+'" fill="'+(hi?(opt.hc||'#e87722'):'url(#'+id+')')+'" opacity="'+(hi?1:0.92)+'"/>';

}

/* 面积折线 */
function sparkSVG(data, opt){
  opt = opt || {};

  const max = Math.max.apply(null, data) * 1.1 || 1, min = Math.min.apply(null, data) * 0.9;
  const step = (W - pad*2) / Math.max(1, data.length - 1);

    const x = pad + i*step, y = H - 14 - ((v-min)/(max-min||1))*(H-26);
    return [x, y];
  });
  let line = '';
  pts.forEach(function(p,i){
    if(i===0) line += 'M'+p[0].toFixed(1)+' '+p[1].toFixed(1);
    else {
      const q = pts[i-1], cx = (q[0]+p[0])/2;
      line += ' C '+cx.toFixed(1)+' '+q[1].toFixed(1)+' '+cx.toFixed(1)+' '+p[1].toFixed(1)+' '+p[0].toFixed(1)+' '+p[1].toFixed(1);
    }
  });
  const area = line + ' L'+(W-pad)+' '+H+' L'+pad+' '+H+' Z';
  const id = _u('sp'), col = opt.c || '#e87722';
  let out = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">'

  }
  return out + '</svg>';
}

/* 环形占比 */
function donutSVG(parts, opt){
  opt = opt || {};
  const S = opt.size || 120, r = S*0.36, sw = S*0.13, cx = S/2, cy = S/2;
  const total = parts.reduce(function(a,p){ return a + p.v; }, 0) || 1;
  let a0 = -Math.PI/2, out = '<svg class="chart" style="width:'+S+'px;height:'+S+'px;flex:0 0 auto" viewBox="0 0 '+S+' '+S+'" xmlns="http://www.w3.org/2000/svg">';
  out += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="currentColor" stroke-width="'+sw+'" opacity=".08"/>';
  parts.forEach(function(p){
    const ang = (p.v/total)*Math.PI*2, a1 = a0 + ang;
    const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0), x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
    const la = ang > Math.PI ? 1 : 0;
    out += '<path d="M'+x0.toFixed(2)+' '+y0.toFixed(2)+' A '+r+' '+r+' 0 '+la+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2)+'" fill="none" stroke="'+p.c+'" stroke-width="'+sw+'" stroke-linecap="butt"/>';
    a0 = a1;
  });
  if(opt.center){
    out += '<text x="'+cx+'" y="'+(cy+2)+'" text-anchor="middle" font-size="'+(S*0.2)+'" font-weight="800" fill="currentColor">'+opt.center+'</text>';

  }
  return out + '</svg>';
}

/* 漏斗 */
function funnelSVG(steps){
  const W = 320, rowH = 42, H = steps.length*rowH;
  let out = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  const max = steps[0].v || 1;
  steps.forEach(function(s,i){
    const wRatio = Math.max(0.32, s.v/max);
    const bw = (W-96)*wRatio, x = 8 + (W-96-bw)/2, y = i*rowH + 6, h = rowH - 16;
    out += '<rect x="'+x.toFixed(1)+'" y="'+(y)+'" width="'+bw.toFixed(1)+'" height="'+h+'" rx="6" fill="'+s.c+'" opacity="'+(0.95-i*0.12)+'"/>';

    if(i>0){

    }
  });
  return out + '</svg>';
}

function ringSVG(pct, opt){
  opt = opt || {};

/* ==========================================================================
   v1.10 · 经营口径引擎（平台运营端多时间维度）
   —— 一份逐日底账聚合出「今日 / 近 7 日 / 近 30 日 / 近 90 日 / 本月」全部口径
   —— 铁律：视图层不得硬写数字，KPI 值、环比、目标达成、分城占比全部派生
   ========================================================================== */

/* 确定性伪随机（固定种子）—— 保证每次加载得到同一份底账，多口径可复现 */
function _lcg(seed){
  let s = seed % 2147483647;
  if(s <= 0) s += 2147483646;
  return function(){ s = s * 16807 % 2147483647; return (s - 1) / 2147483646; };
}

/* 在途核销参数：最近 N 天订单仍在核销期内，核销率按系数折损。
   生成底账与「诊断是否属在途」共用这一组常量，避免两处各写一套。 */
const LAG = { days:4, factor:0.92 };

/* 近 180 日逐日经营底账
   ord=成交单 / gmv=成交额 / vf=已核销单 / ugc=内容提交
   aov=当日客单价（中枢 ¥298，与「一单 ¥298 分账」口径严格一致）
   节奏 = 月度爬坡 × 周末上扬 × 噪声；核销率含「最近 4 日在途折损」 */
DB.x.ledger = (function(){
  const LAST = new Date(2026, 9, 19);            /* 演示数据截止日 2026-10-19 */
  const N = 180, rnd = _lcg(20261019), out = [];
  for(let i = 0; i < N; i++){
    const back = N - 1 - i;                      /* 距截止日天数，0=当日 */
    const dt = new Date(LAST.getTime() - back * 86400000);
    const t = i / (N - 1);                       /* 0=最早 → 1=当日 */
    const ramp = 0.70 + 0.58 * t;                /* 爬坡 0.70 → 1.28 */
    const wd = dt.getDay();                      /* 0=周日 */
    const wk = (wd === 6 || wd === 0) ? 1.22 : (wd === 5 ? 1.10 : (wd === 1 ? 0.96 : 1));
    const noise = 0.94 + rnd() * 0.12;
    const ord = Math.max(8, Math.round(37 * ramp * wk * noise));
    const aov = 258 + Math.round(rnd() * 8) * 10;  /* 258–338，中枢 298 */
    const vr  = 0.70 + rnd() * 0.06;               /* 理论核销率 70%–76% */
    const lag = back < LAG.days ? LAG.factor : 1;  /* 最近数日在途未核销 */
    out.push({
      d: String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'),
      m: dt.getMonth() + 1, g: dt.getDate(), wd: wd,
      ord: ord, gmv: ord * aov, aov: aov,
      vf: Math.round(ord * vr * lag),
      ugc: Math.max(1, Math.round(ord * 0.40 * noise)),
      rep: 0.355 + rnd() * 0.10,                   /* 复购单占比 */
      nat: 0.300 + rnd() * 0.085,                  /* 自然获客单占比 */
      cac: 30 + rnd() * 18,                        /* 单客获取成本（元） */
    });
  }
  return out;
})();

/* 目标基线（驾驶舱与目标对比的唯一来源） */
DB.x.goal = { gmvPerDay:15000, verify:72, rep:40, nat:33, aov:298 };

/* 分城结构
   w   = 占大盘权重（合计 1.000）
   dev = 相对大盘环比的偏离（pp）—— 核心城各自独立增长，不用固定值硬套各口径
   vf  = 核销率相对大盘的系数
   core= 战略城市（参与结构诊断）；false 为长尾「其他城市」，作上期差口的平衡项 */
DB.x.cities = [
  { n:'上海 · 青浦朱家角', w:0.34, dev:2,   vf:1.03, c:'#0f766e', core:true  },
  { n:'湖州 · 安吉',       w:0.24, dev:7,   vf:0.95, c:'#0e9f8a', core:true  },
  { n:'苏州 · 姑苏',       w:0.21, dev:-9,  vf:0.99, c:'#2f6f9f', core:true  },
  { n:'上饶 · 婺源',       w:0.12, dev:16,  vf:0.88, c:'#f59f00', core:true  },
  { n:'其他城市',          w:0.09, dev:0,   vf:0.91, c:'#8a94a6', core:false },
];

/* 四条业务线在长周期里的占比漂移（SaaS 与跨境随合作深入自然上升） */
const BIZ_W = {
  '7d':  [62, 21, 12, 5],
  '30d': [60, 22, 13, 5],
  '90d': [56, 23, 15, 6],
  'mtd': [61, 21, 13, 5],
};

/* 口径定义
   刻意不含「今日」单日口径：单日样本下城市环比纯属噪音，会产出错误结论。
   实时性由 hero 的「实时」徽标与「实时业务流」承担，与区间分析分开。 */
const RANGE_OPTS = [
  { k:'7d',  l:'近 7 日',  days:7 },
  { k:'30d', l:'近 30 日', days:30 },
  { k:'90d', l:'近 90 日', days:90 },
  { k:'mtd', l:'本月',     days:0 },   /* 动态：自然月 1 日至今 */
];
DB.x.range = { cur:'7d' };

function _sumBy(arr, f){ return arr.reduce(function(a, x){ return a + f(x); }, 0); }

/* 取某口径的 [本期窗口, 上期等长窗口] */
function _window(k){
  const L = DB.x.ledger, n = L.length, last = L[n-1];
  if(k === 'mtd'){
    const arr = L.filter(function(x){ return x.m === last.m; });
    const days = arr.length;
    const prev = L.slice(Math.max(0, n - arr.length - days), Math.max(0, n - arr.length))
                  .filter(function(x){ return x.m === last.m - 1; })
                  .slice(-days);
    return { cur:arr, prev:prev, days:days,
             label: last.m + ' 月 1 日 – ' + last.m + ' 月 ' + last.g + ' 日',
             prevLabel: (last.m - 1) + ' 月同期' };
  }
  const d = Number(String(k).replace('d', '')) || 7;
  const cur = L.slice(Math.max(0, n - d));
  const prev = L.slice(Math.max(0, n - 2*d), Math.max(0, n - d));
  return { cur:cur, prev:prev, days:cur.length,
           label: cur[0].d + ' – ' + cur[cur.length-1].d,
           prevLabel: '前 ' + d + ' 日' };
}

/* 窗口聚合 */
function _agg(rows){
  const a = { ord:0, gmv:0, vf:0, ugc:0, rep:0, nat:0, cac:0 };
  rows.forEach(function(x){
    a.ord += x.ord; a.gmv += x.gmv; a.vf += x.vf; a.ugc += x.ugc;
    a.rep += x.rep * x.ord; a.nat += x.nat * x.ord; a.cac += x.cac * x.ord;
  });
  const o = a.ord || 1;
  const aov = a.ord ? a.gmv / a.ord : 0;
  const ltv = aov * 0.72;                        /* LTV = 客单价 × 预期复购次数 */
  const cac = a.cac / o;
  return {
    ord: a.ord, gmv: a.gmv, aov: aov, vf: a.vf, ugc: a.ugc,
    verify: a.ord ? a.vf / a.ord * 100 : 0,
    rep: a.rep / o * 100, nat: a.nat / o * 100,
    cac: cac, ltv: ltv, ltvCac: cac > 0 ? ltv / cac : 0,
  };
}

/* 趋势柱子：自动换粒度（≤10 列，长周期按段聚合），不用 90 根细柱糊成一片。
   一律取「日均」而非「段合计」——尾段常不足一格天数，合计口径会让它假性暴跌；
   日均口径下每列含义一致，目标线也成为一条水平线，可与任意口径直接对照。 */
function _buckets(rows, maxCols){
  const n = rows.length, per = Math.max(1, Math.ceil(n / (maxCols || 10))), out = [];
  for(let i = 0; i < n; i += per){
    const seg = rows.slice(i, i + per);
    const sum = _sumBy(seg, function(x){ return x.gmv; });
    out.push({
      v: sum / seg.length / 1000,                       /* 日均（千元） */
      sum: sum,
      days: seg.length,
      l: per === 1 ? '日一二三四五六'[seg[0].wd] : (seg[0].m + '/' + seg[0].g),
      full: seg[0].d + (seg.length > 1 ? ' ~ ' + seg[seg.length-1].d : '') +
            '（' + seg.length + ' 天）· 日均 ¥' + Math.round(sum / seg.length).toLocaleString() +
            ' · 合计 ¥' + Math.round(sum).toLocaleString(),
      cur: i + per >= n,
    });
  }
  return { per: per, items: out };
}

/* 主派生：dashRange(k) —— 驾驶舱唯一的数字来源 */
function dashRange(k){
  k = k || DB.x.range.cur;
  if(!RANGE_OPTS.some(function(o){ return o.k === k; })) k = '7d';
  const W = _window(k), G = DB.x.goal;
  const cur = _agg(W.cur), prev = _agg(W.prev);
  const pick = RANGE_OPTS.filter(function(o){ return o.k === k; })[0];

  /* 环比：比率型用 pp（百分点），金额型用 % */
  const pc = function(a, b){ return b > 0 ? (a / b - 1) * 100 : 0; };
  const delta = {
    gmv: pc(cur.gmv, prev.gmv),
    ord: pc(cur.ord, prev.ord),
    aov: pc(cur.aov, prev.aov),
    verify: cur.verify - prev.verify,
    rep: cur.rep - prev.rep,
    nat: cur.nat - prev.nat,
    ltvCac: pc(cur.ltvCac, prev.ltvCac),
  };

  /* 趋势：目标值一并纳入刻度上限，保证目标虚线不会贴边被裁 */
  const trend = _buckets(W.cur, 10);
  const tv = G.gmvPerDay / 1000;                                    /* 日均目标（千元），各列相同 */
  const peak = Math.max.apply(null, trend.items.map(function(x){ return x.v; }).concat([1]));
  const maxV = Math.max(peak, tv) * 1.04;

  /* 漏斗：以「下单」为锚反推上游，整体转化率自动算出 */
  const fOrd = cur.ord, fVf = cur.vf;
  const funnel = {
    e: Math.round(fOrd * 9.20), v: Math.round(fOrd * 3.74), o: fOrd, f: fVf,
    rate: fOrd > 0 ? fVf / (fOrd * 9.20) * 100 : 0,
    c2: fOrd > 0 ? fVf / fOrd * 100 : 0,
  };

  /* 分城：本期 = 大盘 × 权重；核心城上期由「相对大盘偏离」反算，
     长尾「其他城市」吸收上期差口 —— 于是「分城上期合计 = 大盘上期」恒成立，
     且各核心城环比不必被归一化扭曲（跨口径时能真实体现短期波动 vs 长期趋势） */
  const rows = DB.x.cities.map(function(c){
    const g = cur.gmv * c.w;
    return { c: c, g: g, p: c.core ? g / (1 + (delta.gmv + c.dev) / 100) : null };
  });
  const pCore = _sumBy(rows, function(r){ return r.p || 0; });
  const iOther = rows.map(function(r){ return r.c.core; }).indexOf(false);
  if(iOther >= 0){
    const rest = prev.gmv - pCore;
    /* 差口异常（长尾上期为负）时按本期占比兜底，防止出现负 GMV */
    rows[iOther].p = rest > 1000 ? rest : prev.gmv * rows[iOther].c.w / 100;
  }
  const cities = rows.map(function(r){
    const c = r.c;
    return {
      n: c.n, c: c.c, core: c.core,
      gmv: r.g, prev: r.p,
      share: c.w * 100,
      ord: Math.round(cur.ord * c.w),
      up: pc(r.g, r.p),
      verify: cur.verify * c.vf,
    };
  });

  /* 业务线占比：按口径权重归一 */
  const bw = BIZ_W[k] || BIZ_W['7d'];
  const bsum = _sumBy(bw, function(x){ return x; });
  const biz = DB.x.bizLines.map(function(b, i){
    return { n:b.n, c:b.c, d:b.d, v: Math.round(bw[i] / bsum * 1000) / 10 };
  });

  /* KPI 六卡 */
  const goalGmv = G.gmvPerDay * W.days;
  const kpi = [
    { k:'gmv',    l:'成交额',      v: cur.gmv, fmt:'money', pct: cur.gmv / goalGmv * 100,
      d: delta.gmv, unit:'%', note:'目标 ' + (goalGmv >= 10000 ? '¥' + (goalGmv / 10000).toFixed(1) + ' 万' : '¥' + Math.round(goalGmv).toLocaleString('zh-CN')) },
    { k:'ord',    l:'成交订单',    v: cur.ord, fmt:'int',   pct: cur.ord / (goalGmv / G.aov) * 100,
      d: delta.ord, unit:'%', note:'目标 ' + Math.round(goalGmv / G.aov) + ' 单' },
    { k:'aov',    l:'客单价',      v: cur.aov, fmt:'yuan',  pct: cur.aov / G.aov * 100,
      d: delta.aov, unit:'%', note:'基准 ¥' + G.aov },
    { k:'verify', l:'权益核销率',  v: cur.verify, fmt:'pct1', pct: cur.verify / G.verify * 100,
      d: delta.verify, unit:'pp', note:'目标 ' + G.verify + '%' },
    { k:'rep',    l:'90 天复购率', v: cur.rep, fmt:'pct1',  pct: cur.rep / G.rep * 100,
      d: delta.rep, unit:'pp', note:'目标 ' + G.rep + '%' },
    { k:'ltvcac', l:'LTV / CAC',   v: cur.ltvCac, fmt:'x1', pct: cur.ltvCac / 3 * 100 >= 100 ? 100 : cur.ltvCac / 3 * 100,
      d: delta.ltvCac, unit:'%', note:'¥' + Math.round(cur.ltv) + ' / ¥' + Math.round(cur.cac) },
  ];

  const r = {
    k:k, l:pick.l, days:W.days, label:W.label, prevLabel:W.prevLabel,
    cur:cur, prev:prev, d:delta, trend:trend, maxV:maxV, tv:tv,
    funnel:funnel, cities:cities, biz:biz, kpi:kpi,
    goal:{ gmv:goalGmv, verify:G.verify, rep:G.rep, nat:G.nat, aov:G.aov },
  };
  r.insight = dashInsight(r);
  return r;
}

/* 驾驶舱诊断：把数字翻译成结论（好/坏/要看什么/去哪里处置） */
function dashInsight(r){
  const out = [], c = r.cur, d = r.d, G = r.goal;

  /* 1 · 规模达成 */
  const ach = c.gmv / G.gmv * 100;
  out.push(ach >= 100
    ? { lv:'ok',  t:'规模达标', d:'成交额达成目标 <b>' + ach.toFixed(1) + '%</b>，日均 ¥' + Math.round(c.gmv / r.days).toLocaleString() + '，' + r.prevLabel + '环比 <b>' + (d.gmv>=0?'+':'') + d.gmv.toFixed(1) + '%</b>。', act:'' }
    : { lv:'bad', t:'规模欠口', d:'成交额达成目标 <b>' + ach.toFixed(1) + '%</b>，缺口 ¥' + Math.round(G.gmv - c.gmv).toLocaleString() + '，环比 <b>' + (d.gmv >= 0 ? '+' : '') + d.gmv.toFixed(1) + '%</b>' + (d.gmv > 0 ? '（仍在增长，只是尚未追平目标线）' : '（且在下滑，需先止血）') + '，按当前日均需再提 <b>' + Math.round((G.gmv / c.gmv - 1) * 100) + '%</b>。', act:'setTab(\'calc\')' });

  /* 2 · 核销率：先扣掉「在途未核销」的可解释折损，剩下才是真问题
     在途折损 ≈ (1 − 折损系数) × 在途天数 ÷ 区间天数 —— 区间越短，虚低越明显 */
  const vGap = c.verify - G.verify;
  const drag = (1 - LAG.factor) * Math.min(LAG.days, r.days) / r.days * 100;
  if(vGap >= 0){
    out.push({ lv:'ok', t:'核销健康', d:'核销率 <b>' + c.verify.toFixed(1) + '%</b>，高于目标 ' + vGap.toFixed(1) + 'pp，权益成本按核销回填，无超发风险。', act:'pushRightsPage()' });
  } else if(Math.abs(vGap) <= drag + 0.3){
    out.push({ lv:'warn', t:'核销率在途折损',
      d:'核销率 <b>' + c.verify.toFixed(1) + '%</b>，低于目标 ' + Math.abs(vGap).toFixed(1) + 'pp；最近 ' + LAG.days + ' 天订单仍在核销期，本口径可解释折损 <b>' + drag.toFixed(1) + 'pp</b> —— 属<b>在途未核销</b>，非实质下滑。' + (r.k === '7d' ? '切「近 30 日」可看真实水平。' : ''),
      act: r.k === '7d' ? 'setDashRange(\'30d\')' : 'pushRightsPage()' });
  } else {
    out.push({ lv:'bad', t:'核销率实质下滑', d:'核销率 <b>' + c.verify.toFixed(1) + '%</b>，低于目标 ' + Math.abs(vGap).toFixed(1) + 'pp，已超在途折损可解释上限（' + drag.toFixed(1) + 'pp），需核查商户履约。', act:'pushRightsPage()' });
  }

  /* 3 · 结构拖累：找环比最弱的城市 */
  const core = r.cities.filter(function(x){ return x.core; });
  const worst = core.slice().sort(function(a, b){ return a.up - b.up; })[0];
  if(worst && worst.up < d.gmv){
    out.push({ lv:'warn', t:'结构拖累',
      d:'<b>' + worst.n + '</b> 环比 ' + (worst.up>=0?'+':'') + worst.up.toFixed(1) + '%，低于大盘 ' + (d.gmv>=0?'+':'') + d.gmv.toFixed(1) + '% ' + (worst.up < d.gmv ? '<b>' + (d.gmv - worst.up).toFixed(1) + 'pp</b>' : '') + '，占大盘 ' + worst.share.toFixed(1) + '%。下沉到该城看核销与货盘。',
      act:'scrollCity()' });
  } else {
    out.push({ lv:'ok', t:'结构均衡', d:'各城环比均为正，最低 ' + (worst?worst.n:'—') + ' ' + (worst?(worst.up>=0?'+':'')+worst.up.toFixed(1):'—') + '%，无单城依赖。', act:'' });
  }

  /* 4 · 获客效率 */
  const natGap = c.nat - G.nat;
  out.push(natGap >= 0
    ? { lv:'ok', t:'获客健康', d:'自然获客占比 <b>' + c.nat.toFixed(1) + '%</b>（目标 ' + G.nat + '%），LTV/CAC <b>' + c.ltvCac.toFixed(1) + ' 倍</b>，不靠买量也能长。', act:'' }
    : { lv:'bad', t:'获客偏贵', d:'自然获客占比 <b>' + c.nat.toFixed(1) + '%</b>，低于目标 ' + Math.abs(natGap).toFixed(1) + 'pp，CAC ¥' + Math.round(c.cac) + '，LTV/CAC ' + c.ltvCac.toFixed(1) + ' 倍，获客结构在向买量倾斜。', act:'setTab(\'calc\')' });

  return out.slice(0, 4);
}

function calcFromRange(){
  const r = dashRange(DB.x.range.cur), c = DB.admin.calc;
  const clamp = function(v, lo, hi, step){
    return Math.max(lo, Math.min(hi, Math.round(v / step) * step));
  };
  c.orders = clamp(r.cur.ord / r.days * 30, 500, 10000, 100);
  c.price  = clamp(r.cur.aov, 99, 999, 10);
  toast('已代入 ' + r.l + ' 实测：月订单 ' + c.orders.toLocaleString() + ' 单 · 客单价 ¥' + c.price);
  renderBase();
}

/* ============================================================
   权益结算实绩 → 一单 ¥298 分账回流（v1.7）
   —— 把「核销对账」的真实成本回写进分账视图，两边账实一致
   ============================================================ */

/** 协议变更单当前适用的协议单价：有「已生效」变更单以新价为准，否则沿用协议原价
    —— 变更一旦审批通过，结算成本立即按新价重算，无需人工改价 */
function agrPrice(m){
  const c = DB.rights.contracts.filter(function(x){ return x.m === m.n && x.st === '已生效'; })[0];
  return c ? c.to : m.price;
}
/** 待审批变更单若通过可省下的成本（仅为预估，不计入实绩） */
function agrPendingSave(m){
  const c = DB.rights.contracts.filter(function(x){ return x.m === m.n && x.st === '待审批'; })[0];
  return c ? m.cnt * (c.to - c.from) : 0;
}
/** 单条商户结算条线的实付金额 = 协议应收（m.amt，含申诉上浮）− 已处置差异核减
    m.amt 是账实权威：协议变更生效时按新单价重算、申诉受理时按主张上浮，
    net 只负责扣核减，避免同一笔钱在两处各算一遍 */
function rightsLineNet(m){
  const R = DB.rights;
  const cut = R.diffs.filter(function(d){ return d.m === m.n && d.st === '已处置'; })
    .reduce(function(a,d){ return a + d.amt; }, 0);
  return m.amt - cut;
}
/** 结算实绩汇总：已确认 / 待确认 / 差异 / 实付合计 */
function rightsRealized(){
  const R = DB.rights;
  const ok = R.merchants.filter(function(m){ return m.st === '已确认'; });
  const wait = R.merchants.filter(function(m){ return m.st === '待确认'; });
  const diff = R.merchants.filter(function(m){ return m.st === '差异' || m.st === '申诉中'; });
  const net = R.merchants.reduce(function(a,m){ return a + rightsLineNet(m); }, 0);
  const okNet = ok.reduce(function(a,m){ return a + rightsLineNet(m); }, 0);
  const cut = R.diffs.filter(function(d){ return d.st === '已处置'; })
    .reduce(function(a,d){ return a + d.amt; }, 0);
  return {
    ok: ok, wait: wait, diff: diff,
    net: net, okNet: okNet, cut: cut,
    cnt: R.merchants.reduce(function(a,m){ return a + m.cnt; }, 0),
    orders: R.budget.orders,
    perPlan: R.budget.per,
    perReal: net / R.budget.orders,
    perOk: okNet / R.budget.orders,
  };
}
/** 分账五口径实绩行：标准口径 → 实绩口径（权益超支吃掉留存毛利，总额恒为 ¥298） */
function splitRowsReal(){
  const base = DB.x.waterfall.map(function(w){ return { n:w.n, c:w.c, g:w.g, to:w.to, d:w.d, v:w.v, p:w.p, plan:w.v }; });
  const z = rightsRealized();
  const pool = base.filter(function(w){ return w.g === 'pool'; })[0];
  const keep = base.filter(function(w){ return w.n === '留存毛利'; })[0];
  const FIX = 298;                              // 游客实付，五口径合计恒等
  if(pool){
    pool.v = Math.round(z.perReal * 100) / 100;   // 实绩权益单均（两位小数，小额申诉也可见）
    pool.p = Math.round(pool.v / FIX * 1000) / 10;
    pool.real = true;
  }
  if(keep){
    const other = base.filter(function(w){ return w.g === 'out' || w.n === '平台服务费'; })
      .reduce(function(a,w){ return a + w.v; }, 0);
    keep.v = Math.round((FIX - other - pool.v) * 100) / 100;   // 差额由留存毛利吸收
    keep.p = Math.round(keep.v / FIX * 1000) / 10;
    keep.gap = Math.round((pool.v - z.perPlan) * 100) / 100;
    keep.real = true;
  }
  /* 分组汇总（按收款对象） */
  const grp = { out:{ sum:0, plan:0 }, keep:{ sum:0, plan:0 }, pool:{ sum:0, plan:0 } };
  base.forEach(function(w){
    grp[w.g].sum = Math.round((grp[w.g].sum + w.v) * 100) / 100;
    grp[w.g].plan = Math.round((grp[w.g].plan + w.plan) * 100) / 100;
  });
  Object.keys(grp).forEach(function(k){
    grp[k].pct = Math.round(grp[k].sum / FIX * 1000) / 10;
    grp[k].planPct = Math.round(grp[k].plan / FIX * 1000) / 10;
  });
  return { rows: base, z: z, gap: keep ? keep.gap : 0, sum: Math.round(base.reduce(function(a,w){ return a + w.v; }, 0) * 10) / 10, grp: grp };
}
/** 回流说明：为什么实绩权益单均比预算高，差额从哪来 */
function splitRealNote(){
  const z = rightsRealized();
  const gap = Math.round((z.perReal - z.perPlan) * 100) / 100;
  const total = Math.round(gap * z.orders);
  return { z: z, gap: gap, total: total,
    text: gap > 0
      ? '本期实绩权益单均 ¥' + z.perReal.toFixed(2) + '，高于预算预留 ¥' + z.perPlan.toFixed(2) + '，缺口 ¥' + gap.toFixed(2) + '/单；全期合计 ¥' + total.toLocaleString() + ' 先由平台留存毛利吸收'
      : (gap < 0 ? '本期实绩权益单均 ¥' + z.perReal.toFixed(2) + '，低于预算预留 ¥' + z.perPlan.toFixed(2) + '，节余 ¥' + Math.abs(gap).toFixed(2) + '/单 回补留存毛利'
      : '本期实绩权益单均 ¥' + z.perReal.toFixed(2) + '，与预算预留一致，无差额') };
}

/* ============================================================
   权益预留池 · 超支审批动作流（v1.8）
   —— 把「池子不够」从一句建议变成有授权、有额度、有熔断的审批链
   ============================================================ */

/** 分级授权：按金额判定该谁批（限额 null = 终审，无上限） */
function overrunNeed(amt){
  const G = DB.rights.overrun.grades;
  for(let i = 0; i < G.length; i++){
    if(G[i].lim === null || amt <= G[i].lim) return { g:G[i], i:i };
  }
  return { g:G[G.length - 1], i:G.length - 1 };
}
/** 当前审批层级名称 */
function overrunLevel(amt){ return overrunNeed(amt).g.lv; }
/** 上一级审批人（部分批准后余量升级用） */
function overrunUp(amt){
  const G = DB.rights.overrun.grades, i = overrunNeed(amt).i;
  return G[i + 1] || null;
}
/** 超支全局状态：缺口 / 已批 / 待批 / 未覆盖 / 熔断 / 资金来源 */
function overrunState(){
  const R = DB.rights, O = R.overrun, z = rightsRealized();
  const gap = Math.max(0, Math.round((z.net - R.budget.pool) * 100) / 100);
  const rate = R.budget.pool ? Math.round(gap / R.budget.pool * 1000) / 1000 : 0;
  const okAmt = O.asks.filter(function(a){ return a.st === '已批准' || a.st === '部分批准'; })
    .reduce(function(a,x){ return a + (x.got || x.amt); }, 0);
  const open = O.asks.filter(function(a){ return a.st === '待审批'; });
  const openAmt = open.reduce(function(a,x){ return a + x.amt; }, 0);
  /* 已被审批覆盖的缺口走「营销预算调剂」，未覆盖部分直接从留存毛利扣 —— 总额不变 */
  const fromMkt = Math.min(okAmt, gap);
  const fromKeep = Math.max(0, gap - fromMkt);
  /* 熔断：超支率破线，且缺口尚未拿到「已批准的处置」（批了调剂或签了协议变更）
     —— 破线说明成本失控，无处置说明钱没着落，两者同时成立才冻结新增投放 */
  const fuse = rate > O.limit && okAmt < gap;
  return {
    gap: gap, rate: rate, okAmt: okAmt, openAmt: openAmt, open: open.length,
    fromMkt: fromMkt, fromKeep: fromKeep, uncovered: Math.max(0, gap - okAmt),
    fuse: fuse, limit: O.limit, net: z.net, pool: R.budget.pool,
    perReal: z.perReal, perPlan: z.perPlan,
  };
}
/** 下期建议预留单价：按实绩上浮并留 3% 缓冲 */
function overrunNextPer(){
  const z = rightsRealized();
  return Math.round(z.perReal * 1.03 * 100) / 100;
}

/* ============================================================
   下期预算预测 · 事前预警（v1.9）
   —— 不等结算完才发现超支：按周节奏外推，破线前干预
   ============================================================ */

/** 滚动周节奏：本期逐周成本、日均与环比（不完整周按天折算，避免短周被低估） */
function fcWeeks(){
  const W = DB.rights.overrun.fc.weeks;
  return W.map(function(w, i){
    const perDay = w.days > 0 ? w.amt / w.days : 0;
    const prev = i > 0 ? W[i-1] : null;
    const prevPer = prev && prev.days > 0 ? prev.amt / prev.days : 0;
    return {
      w: w.w, amt: w.amt, days: w.days,
      perDay: Math.round(perDay * 100) / 100,
      wow: prevPer > 0 ? perDay / prevPer - 1 : null,   // 日均环比，非金额环比
    };
  });
}
/** 下期预算预测：全期均速是后视镜，近周节奏才是前挡风
    周节奏是历史事实（不随协议变更回溯漂移），账实是当前账面 —— 两者分开，预测 = 账面 × 节奏倍数
    协议变更一旦生效（m.amt 被重算），net 自动下降 → 预测同步下降，无需二次适配 */
function fcState(){
  const R = DB.rights, F = R.overrun.fc, O = R.overrun, z = rightsRealized();
  const net = z.net;                                        // 本期实绩成本
  const daysAll = F.weeks.reduce(function(a,w){ return a + w.days; }, 0);
  const amtAll  = F.weeks.reduce(function(a,w){ return a + w.amt; }, 0);
  const perDayAll = daysAll > 0 ? amtAll / daysAll : 0;    // 全期日均（由周节奏汇总，历史事实恒定）
  const last = F.weeks[F.weeks.length - 1] || { amt:0, days:1 };
  const perDayLast = last.days > 0 ? last.amt / last.days : 0;   // 近周日均
  const trend = perDayAll > 0 ? perDayLast / perDayAll - 1 : 0;  // 趋势增速（恒定，不随账面变更漂移）
  const fcNext = Math.round(net * (1 + trend));             // 下期预测成本
  const pool = R.budget.pool;                               // 下期预留池（沿用本期口径）
  const fcGap = Math.max(0, Math.round((fcNext - pool) * 100) / 100);
  const fcRate = pool ? fcGap / pool : 0;
  const bottom = perDayLast > 0 ? pool / perDayLast : Infinity;  // 池子见底天数
  const fcPer = R.budget.orders ? fcNext / R.budget.orders : 0;  // 预测单均成本
  const fcPerBuf = Math.round(fcPer * 1.03 * 100) / 100;         // 建议预留单价（+3% 缓冲）
  /* 待审批协议变更的潜在影响（已生效的已体现在 net 里，不重复计）
     what-if 与真实模型同式：先降账面、再乘节奏倍数，保证「预览值 = 批准后的实际值」 */
  const agrSave = R.contracts.filter(function(c){ return c.st === '待审批' && c.to < c.from; })
    .reduce(function(a,c){ const m = R.merchants.filter(function(x){ return x.n === c.m; })[0];
      return a + (m ? m.cnt * (c.from - c.to) : 0); }, 0);
  const fcNextAgr = Math.max(0, Math.round((net - agrSave) * (1 + trend)));
  const fcRateAgr = pool ? Math.max(0, fcNextAgr - pool) / pool : 0;
  /* 收缩新增投放 10% 的影响（验证「单靠压投放救不回来」） */
  const fcNextCut = Math.round(fcNext * 0.9);
  const fcRateCut = pool ? Math.max(0, fcNextCut - pool) / pool : 0;
  /* 预警分级：绿 ≤ 熔断线 < 黄 ≤ 50% < 红 */
  const lv = fcRate > F.amber ? 'red' : fcRate > O.limit ? 'amber' : 'green';
  return {
    net:net, days:F.days, perDayAll:perDayAll, perDayLast:perDayLast, trend:trend,
    fcNext:fcNext, pool:pool, fcGap:fcGap, rate:fcRate,
    bottom:bottom, fcPer:fcPer, fcPerBuf:fcPerBuf,
    agrSave:agrSave, fcNextAgr:fcNextAgr, fcRateAgr:fcRateAgr,
    fcNextCut:fcNextCut, fcRateCut:fcRateCut,
    lv:lv, limit:O.limit, amber:F.amber, weeks:fcWeeks(),
  };
}

</script>
