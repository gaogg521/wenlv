<script>
/* ===== 视图注册表 ===== */
const VIEWS = {};
const PAGES = {};

/* ===== 状态栏明暗：自动探测当前首屏底色 ===== */
function _lum(r,g,b){ return (0.299*r + 0.587*g + 0.114*b) / 255; }
/* 返回当前最上层滚动容器 */
function topScrollEl(){
  if(S.stack.length) return S.stack[S.stack.length-1].el.querySelector('.page-body');
  return $('#baseScroll');
}
/** 沿祖先链向上找出首屏顶部实际生效的底色 */
function probeTopBg(el){
  if(!el) return { dark:false, bleed:false };
  /* 首元素自身：图片/插画容器（.gal / .imgwrap / .scene / svg）→ 视为深底，白字 */
  const selfImg = /(^|\s)(gal|imgwrap|scene|gslides)(\s|$)/.test(el.className || '') || el.tagName === 'SVG' || (el.querySelector && el.querySelector('svg.scene'));
  let dark = selfImg ? true : null, node = selfImg ? null : el;
  while(node && node.id !== 'screen'){
    const cs = getComputedStyle(node);
    if(cs.backgroundImage && cs.backgroundImage !== 'none'){ dark = true; break; }
    const m = cs.backgroundColor && cs.backgroundColor.match(/[\d.]+/g);
    if(m && (m.length < 4 || +m[3] > 0.5)){ dark = _lum(+m[0], +m[1], +m[2]) < 0.55; break; }
    node = node.parentElement;
  }
  if(dark === null) dark = false;
  /* 只有「通栏 + 深底」才沉浸顶格；带左右外边距的浮层卡片上方仍是浅色 --bg，状态栏必须用深色字 */
  const cs0 = getComputedStyle(el);
  const fullBleed = parseFloat(cs0.marginLeft) < 1 && parseFloat(cs0.marginRight) < 1;
  if(!fullBleed) return { dark:false, bleed:false };
  return { dark:true, bleed:true };
}
function autoSB(){
  /* 登录层覆盖状态栏 */
  if($('#loginLayer').classList.contains('on')){
    const hero = $('#loginLayer .login-hero');
    const cs = hero ? getComputedStyle(hero) : null;
    applySB((cs && cs.backgroundImage !== 'none') ? 'dark' : 'light');
    return;
  }
  const box = topScrollEl();
  /* 跳转返回栏在场时，页面顶部是白底，状态栏不能再跟着内容走 */
  if(document.getElementById('appRoot') && document.getElementById('appRoot').classList.contains('has-ret')){ applySB('light'); return; }
  /* 首屏内容头：跳过 .ptr 下拉刷新占位元素 */
  let first = box ? box.firstElementChild : null;
  if(first && first.classList.contains('ptr')) first = first.nextElementSibling;
  /* push 出来的子页面顶部是半透明白 navbar（rgba(255,255,255,.92)），状态栏一律用深色字 */
  if(S.stack.length){
    if(window.__sbBleedEl){                      /* 从 tab 首屏切进来时先还原沉浸头部 */
      const prev = window.__sbBleedEl;
      prev.style.paddingTop = prev.dataset.sbPadOrig || ''; prev.style.marginTop = ''; delete prev.dataset.sbPadOrig;
      window.__sbBleedEl = null;
      $('#baseLayer').classList.remove('top-bleed');
    }
    applySB('light');
    return;
  }
  const r = probeTopBg(first);
  /* 沉浸式：头部负外边距顶回 0，并补足 44px 内边距，保持内容视觉位置不变 */
  const host = box ? (S.stack.length ? S.stack[S.stack.length-1].el : $('#baseLayer')) : null;
  const prev = window.__sbBleedEl;
  if(prev && prev !== first){                      /* 上一个沉浸头部不再沉浸 → 还原 */
    prev.style.paddingTop = prev.dataset.sbPadOrig || '';
    prev.style.marginTop = '';
    delete prev.dataset.sbPadOrig;
    window.__sbBleedEl = null;
    if(host){ host.classList.remove('top-bleed'); }
  }
  if(host && r.bleed && first){
    if(!first.dataset.sbPadOrig) first.dataset.sbPadOrig = getComputedStyle(first).paddingTop;
    first.style.paddingTop = (parseFloat(first.dataset.sbPadOrig) + 44) + 'px';
    first.style.marginTop = '-44px';
    host.classList.add('top-bleed');
    window.__sbBleedEl = first;
  }
  applySB(r.dark ? 'dark' : 'light');
}
function applySB(mode){
  $('#screen').classList.toggle('sb-dark', mode !== 'light');
  S.sbMode = mode;
}
/* 兼容旧调用：显式指定则覆盖自动探测 */
function setSB(mode){
  if(!mode || mode === 'auto'){ autoSB(); return; }
  applySB(mode);
}

/* ===== 页面栈 ===== */
function push(title, html, opts={}){
  const pg = document.createElement('div');
  pg.className = 'page';
  pg.innerHTML =
    '<div class="navbar"><button class="nav-btn" onclick="pop()">'+ic('i-back')+'</button>' +
    '<div class="nav-title">'+title+'</div><div class="nav-right"></div></div>' +
    '<div class="scroll page-body">'+html+'</div>' +
    (opts.bottom ? '<div class="bottom-bar">'+opts.bottom+'</div>' : '');
  $('#pageStack').appendChild(pg);
  requestAnimationFrame(()=>requestAnimationFrame(()=>pg.classList.add('in')));
  $('#baseLayer').classList.add('pushed');
  S.stack.push({ title, el:pg, sb:opts.sb || 'auto' });
  if(opts.sb && opts.sb !== 'auto') applySB(opts.sb); else autoSB();
  if(typeof renderRet === 'function') renderRet();   /* 进了子页就把 tab 层的返回浮标收起，避免压在二级页上 */
  pg.querySelector('.page-body').addEventListener('scroll', onSbScroll, { passive:true });
  runCounters(pg.querySelector('.page-body'));
  return pg;
}
let sbRaf = 0;
function onSbScroll(){ if(sbRaf) return; sbRaf = requestAnimationFrame(()=>{ sbRaf = 0; autoSB(); }); }
function pop(){
  const top = S.stack.pop(); if(!top) return;
  top.el.classList.add('out'); top.el.classList.remove('in');
  setTimeout(()=>top.el.remove(), 380);
  const prev = S.stack[S.stack.length-1];
  if(prev){ if(prev.sb && prev.sb !== 'auto') applySB(prev.sb); else autoSB(); }
  else { $('#baseLayer').classList.remove('pushed'); autoSB(); }
  /* 退回 tab 层时，把「跳转返回」浮标恢复出来（push 期间它是隐藏的） */
  if(!S.stack.length) setTimeout(renderRet, 20);
}
function clearStack(){ S.stack.forEach(p=>p.el.remove()); S.stack = []; $('#baseLayer').classList.remove('pushed'); }

/* ===== 端与 Tab ===== */
function setEnd(end){
  clearStack();
  S.ret = null;                 /* 换端了，「返回上一个 tab」就没有意义了 */
  S.end = end;
  $('#screen').dataset.end = end;
  renderBase(); renderPanel(); renderRet();
  const l = $('#baseLayer');
  l.style.opacity = '0';
  requestAnimationFrame(()=>{ l.style.transition = 'opacity .2s'; l.style.opacity = '1'; });
}
function setTab(k){
  /* 底部 tab 栏 / 代码里的普通切换：不保留「远处跳过来」的返回痕迹 */
  S.ret = null;
  /* 防御：非法 tab key 自动回落到首屏，避免出现「建设中」空页 */
  const endDef = ENDS[S.end];
  if(endDef && !endDef.tabs.some(function(t){ return t.k === k; })) k = endDef.tabs[0].k;
  if(S.tab[S.end] === k && !S.stack.length){ renderBase(); renderRet(); return; }
  clearStack();
  S.tab[S.end] = k;
  renderBase();
  renderRet();
}
/* 「我的」里的入口跳到别的 tab —— 记下来路，给用户一个回去的键 */
function jumpTab(k){
  const from = S.tab[S.end];
  setTab(k);
  if(from === k) return;
  const def = ENDS[S.end].tabs.find(function(t){ return t.k === from; });
  S.ret = { tab: from, label: (def && def.l) || '上一页' };
  renderRet();
}
function retBack(){
  const t = S.ret && S.ret.tab;
  S.ret = null;
  if(t) setTab(t); else renderRet();
}
function renderRet(){
  const el = document.getElementById('retChip');
  if(!el) return;
  const root = document.getElementById('appRoot');
  const hide = !S.ret || S.stack.length;
  if(hide){ el.classList.remove('on'); el.innerHTML = ''; if(root) root.classList.remove('has-ret'); return; }
  el.innerHTML = '<button onclick="retBack()" aria-label="返回">' + ic('i-back') + '<span>返回 ' + S.ret.label + '</span></button>';
  el.classList.add('on');
  if(root) root.classList.add('has-ret');
  /* 清掉「沉浸头」的负边距 —— 否则头部会往上钻 44px，压住返回栏 */
  if(window.__sbBleedEl){
    const p = window.__sbBleedEl;
    p.style.paddingTop = p.dataset.sbPadOrig || ''; p.style.marginTop = ''; delete p.dataset.sbPadOrig;
    window.__sbBleedEl = null;
    const bl = document.getElementById('baseLayer'); if(bl) bl.classList.remove('top-bleed');
  }
  /* 返回栏把内容顶下去 36px，页面顶部变成白底 —— 状态栏必须跟着改深色字，否则白字压白看不见 */
  applySB('light');
}
/* 二级页内的分类/筛选切换：只重画最上层子页，不能调 renderBase（那会重画 tab 首屏、把子页盖住） */
function rerenderTop(){
  const top = S.stack[S.stack.length-1];
  if(top && typeof top.el.__rerender === 'function'){ top.el.__rerender(); return; }
  renderBase();
}
function renderBase(){
  const end = ENDS[S.end];
  $('#tabBar').innerHTML = end.tabs.map(t =>
    '<div class="tab '+(S.tab[S.end]===t.k?'on':'')+'" onclick="setTab(\''+t.k+'\')">'+ic(t.i)+'<span>'+t.l+'</span></div>').join('');
  const scroll = $('#baseScroll');

  scroll.innerHTML = '<div class="ptr"></div>' + (fn ? fn() : '<div class="empty">建设中</div>');
  scroll.scrollTop = 0;

  scroll.addEventListener('scroll', onSbScroll, { passive:true });

}

  {k:'merch',   n:'我是商家',     d:'接单核销 · 库存对账 · 货源铺货 · 旅豆兑换', ic:'i-store',   c:'#7b5aa6', c2:'#a97fd1'},
  {k:'admin',   n:'平台运营',     d:'经营驾驶舱 · 积分风控 · 准入审核 · 单城测算', ic:'i-chart',  c:'#0f766e', c2:'#14b8a6'},

/* ===== 演示模式：大窗口自适应铺满一屏（免上下滚动，方便投屏演示） =====
   触发条件：视口 ≥ 1200×700 且用户未手动退出。
   验收工具的视口是 430×920，永不触发 → 对自动化零影响。 */
var FIT_KEY = 'wf-demo-fit-off';
function fitRead(){ try{ return localStorage.getItem(FIT_KEY) === '1'; }catch(e){ return false; } }
function fitWrite(v){ try{ localStorage.setItem(FIT_KEY, v ? '1' : '0'); }catch(e){} }
function fitStage(){
  var stage = document.getElementById('stage');
  if(!stage) return;
  var off = fitRead();
  var big = window.innerWidth >= 1200 && window.innerHeight >= 700;
  var on = !off && big;
  if(on){
    var W = stage.offsetWidth, H = stage.offsetHeight;
    if(W > 0 && H > 0){
      var s = Math.min((window.innerWidth - 40) / W, (window.innerHeight - 40) / H);
      s = Math.max(0.35, Math.min(2, s));
      stage.style.transformOrigin = 'top center';
      stage.style.transform = 'scale(' + s.toFixed(4) + ')';
      /* 补偿缩放后的视觉高度：布局盒仍是 H，视觉是 H×s，用负外距收掉差值，避免出现页面滚动条 */
      stage.style.marginBottom = Math.round(H * s - H) + 'px';
    }
    document.body.classList.add('fit-on');
  } else {
    stage.style.transform = '';
    stage.style.marginBottom = '';
    document.body.classList.remove('fit-on');
  }
  var btn = document.getElementById('fitBtn'), txt = document.getElementById('fitBtnTxt');
  if(btn) btn.style.display = (big || off) ? 'inline-flex' : 'none';
  if(txt) txt.textContent = on ? '退出演示模式' : '演示模式';
}
function toggleFit(){
  var off = fitRead();
  fitWrite(!off);
  fitStage();
  toast(off ? '已开启演示模式 · 页面自适应铺满一屏' : '已退出演示模式 · 恢复原始尺寸（可上下滚动）');
}

  }catch(e){}
}

function beanDeduct(t){
  if(!buyState.useBeans) return 0;
  const maxBeans = Math.floor(t.price * buyState.n * 0.3) * 10;
  return Math.min(DB.wallet, maxBeans);
}
function pickDate(el, i){
  el.parentElement.querySelectorAll('.date-chip').forEach(c=>c.classList.remove('on'));

  buyState.n = Math.max(1, Math.min(5, buyState.n + d));

  updateCalc(t);
}

function updateCalc(t){

let LINK_LOG = [];
function applyOrder(t, n, beans){
  const earn = t.earn * n, fee = Math.round(t.price * n * 0.08);
  DB.wallet += earn;
  DB.txLog.unshift({d:t.title+' · 消费奖励', t:'刚刚', a:'+'+earn, p:'plus', chain:'0x'+Math.random().toString(16).slice(2,6)+'…'+Math.random().toString(16).slice(2,6)});
  const code = rnd6();
  DB.visitorOrders.unshift({n:t.title, d:'刚刚 · 待出行', price:t.price*n, bean:earn, status:'待核销', code, merch:t.merch, sc:t.sc || 'bamboo', ppl:n});
  DB.merch.today++; DB.merch.gmv += t.price*n; DB.merch.pending++;
  DB.merch.orders.unshift({n:t.title, visitor:'我（游客端演示）', tm:'刚刚', status:'待核销', paid:'¥'+t.price*n, code, bean: beans>0 ? '-'+beans : 0});
  DB.partner.monthEarn += fee; DB.partner.withdrawable += fee; DB.partner.totalEarn += fee;
  DB.partner.referrals[0].gmv += t.price*n; DB.partner.referrals[0].orders += n; DB.partner.referrals[0].v += fee;
  DB.admin.todayGmv += t.price*n; DB.admin.todayOrders++; DB.admin.monthGmv += t.price*n; DB.admin.monthOrders++;
  DB.admin.budget.issued += earn;
  DB.admin.stream.unshift({t:'刚刚', d:'新订单 · '+t.title+' ¥'+t.price*n+' · 四端已同步', c:'#4ade80'});
  if(beans>0) DB.merch.beans += beans;
  LINK_LOG = [
    ['ok','游客端','订单创建 · 旅豆 +'+earn+' · 待核销'],
    ['ok','合伙人端','黄金合伙人 8% 返佣 +¥'+fee+'（'+DB.partner.referrals[0].n+'）'],
    ['ok','商户端','新增待核销订单 · 流水 +¥'+t.price*n],
    ['ok','平台运营端','GMV / 订单 / 积分发行数据已更新'],
  ];
}

function playJudge(){
  const sd = DB.scriptData;
  const right = S.play.accused === sd.truth;
  if(right && S.play.mailed && S.play.clues.length >= 3) return sd.endings[0];
  if(right) return sd.endings[1];
  return sd.endings[2];
}
function playSettle(){
  const e = playJudge();
  /* 演示发放：旅豆入账 + 交易流水上链 + 徽章点亮（非真实经营数据） */
  DB.wallet += e.bean;
  const h = '0x' + Math.random().toString(16).slice(2,6) + '…' + Math.random().toString(16).slice(2,6);
  DB.txLog.unshift({ d:'剧本闯关 · ' + e.n, t:'今天', a:'+'+e.bean, p:'plus', chain:h });
  const b = DB.badges.find(x=>x.n === e.badge);
  if(b && !b.got){ b.got = true; b.date = '2026-10-19'; b.hash = h; }
  DB.scriptData.tasks.forEach(k=>{ k.done = true; });
  S.play.stage = 'ending';
  S.play.result = e;
  playRender();
  confetti.fire();
}

function searchFromWord(w){
  const top = S.stack[S.stack.length-1];

function beanRingSVG(L){
  const cx = 170, cy = 170, R = 92, LR = 118, n = L.nodes.length;
  let s = '<svg viewBox="0 0 340 340" class="bean-ring">';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="none" stroke="' + L.c + '2e" stroke-width="1.3" stroke-dasharray="3.5 5"/>';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="54" fill="' + L.c + '0f"/>';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="54" fill="none" stroke="' + L.c + '26" stroke-width="1"/>';
  s += '<text x="' + cx + '" y="164" text-anchor="middle" font-size="11" font-weight="800" fill="' + L.c + '">' + L.ct + '</text>';
  s += '<text x="' + cx + '" y="181" text-anchor="middle" font-size="8" fill="#93a1b0">' + L.cs + '</text>';
  for(let i = 0; i < n; i++){
    const am = ((i + 0.5) * 360 / n - 90) * Math.PI / 180;
    const ax = (cx + Math.cos(am) * R).toFixed(1), ay = (cy + Math.sin(am) * R).toFixed(1);
    s += '<path d="M-4.4,-3.2 L4.4,0 L-4.4,3.2 Z" fill="' + L.c + '66" transform="translate(' + ax + ',' + ay + ') rotate(' + ((i + 0.5) * 360 / n).toFixed(0) + ')"/>';
  }
  for(let i = 0; i < n; i++){
    const a = (i * 360 / n - 90) * Math.PI / 180;
    const nx = (cx + Math.cos(a) * R).toFixed(1), ny = (cy + Math.sin(a) * R).toFixed(1);
    const lx = cx + Math.cos(a) * LR, ly = cy + Math.sin(a) * LR;
    const ca = Math.cos(a), sa = Math.sin(a);
    const anchor = ca > 0.3 ? 'start' : ca < -0.3 ? 'end' : 'middle';
    const ox = ca > 0.3 ? 7 : ca < -0.3 ? -7 : 0;
    const oy = sa > 0.5 ? 12 : sa < -0.5 ? -3 : 4;
    s += '<circle cx="' + nx + '" cy="' + ny + '" r="15.5" fill="#fff" stroke="' + L.c + '" stroke-width="1.5"/>';
    s += '<text x="' + nx + '" y="' + (Number(ny) + 4) + '" text-anchor="middle" font-size="10.5" font-weight="900" fill="' + L.c + '">' + (i + 1) + '</text>';
    s += '<text x="' + (lx + ox).toFixed(1) + '" y="' + (ly + oy).toFixed(1) + '" text-anchor="' + anchor + '" font-size="9.5" font-weight="800" fill="#2b3440">' + L.nodes[i].t + '</text>';

  s += '</svg>';
  return s;
}

function redeemBeanUse(k, i){
  const u = BEAN_USE[k];
  const it = u.items && u.items[i];
  if(!it){ toast('权益不存在'); return; }
  const label = String(it[1]).replace(/'/g,'');
  const cost = /\d+\s*豆/.test(label) ? (parseInt(label.replace(/[^0-9]/g,''), 10) || 0) : 0;
  if(cost <= 0){ applyMaterial(u.t, it[0]); return; }
  if(DB.wallet < cost){ toast('旅豆余额不足 · 还差 ' + (cost - DB.wallet) + ' 豆'); return; }
  DB.wallet -= cost;
  DB.txLog.unshift({ d:'权益兑换 · ' + it[0], t:'刚刚', a:'-' + cost, p:'minus', chain:'0x' + Math.random().toString(16).slice(2,6) + '…' + Math.random().toString(16).slice(2,6) });
  renderBase();
  toast('兑换成功 · ' + it[0] + '\n已扣 ' + cost + ' 豆，权益已发放');
  setTimeout(function(){ pop(); pushBeanUsePage(k); }, 900);
}

const MISSION_ST = {

    todo:   '<button class="btn sm" onclick="claimMission('+m.id+')">领取任务</button>',

    done:   '<button class="btn sm ghost" onclick="viewMissionReward('+m.id+')">查看奖励</button>',
  }[m.st];
  return `<div class="mission-card st-${m.st}" id="mission-${m.id}">

function refreshMissions(){
  const box = $('#missionList');
  if(box){ box.innerHTML = DB.missions.map(missionCard).join(''); return; }

/* ===== 二维码（演示图形） ===== */
function qrSvg(seed){
  let s = 0; for(const ch of seed) s += ch.charCodeAt(0);
  const rnd = ()=>{ s = (s*9301+49297)%233280; return s/233280; };
  let cells = '';
  for(let y=0;y<11;y++) for(let x=0;x<11;x++){
    const inEye = (x<3&&y<3)||(x>7&&y<3)||(x<3&&y>7);
    if(inEye) continue;
    if(rnd()>0.52) cells += '<rect x="'+(x*10)+'" y="'+(y*10)+'" width="10" height="10"/>';
  }
  const eye = (x,y)=>'<rect x="'+x+'" y="'+y+'" width="30" height="30" fill="none" stroke="#1a2233" stroke-width="6"/><rect x="'+(x+10)+'" y="'+(y+10)+'" width="10" height="10"/>';
  return '<svg viewBox="0 0 110 110" style="width:100%;height:100%"><g fill="#1a2233">'+cells+'</g>'+eye(0,0)+eye(80,0)+eye(0,80)+'</svg>';
}

function onVerifyInput(v){
  v = v.replace(/\D/g,'').slice(0,6);
  $('#verifyInput').value = v;
  for(let k=0;k<6;k++){ const b=$('#vb'+k); if(b){ b.textContent=v[k]||''; b.classList.toggle('filled',!!v[k]); b.classList.toggle('focus',k===v.length); } }
  if(v.length===6) setTimeout(()=>confirmVerify(currentVerifyIdx), 300);
}
let currentVerifyIdx = 0;
function simulateScan(i){
  currentVerifyIdx = i;
  const o = DB.merch.orders[i];
  const sheet = $('#sheet');
  sheet.insertAdjacentHTML('beforeend','<div id="scanning" style="position:absolute;inset:0;background:rgba(255,255,255,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px"><div class="spinner" style="margin:0"></div><div style="font-size:13px;font-weight:700">扫码识别中</div><div style="font-size:10.5px;color:var(--sub)">动态码防截图 · 每 60 秒刷新</div></div>');
  setTimeout(()=>{ $('#scanning') && $('#scanning').remove(); onVerifyInput(o.code); }, 900);
}
function confirmVerify(i){
  const v = ($('#verifyInput')||{}).value || '';
  if(v.length < 6){ toast('请输入 6 位核销码'); return; }
  const o = DB.merch.orders[i];
  if(v !== o.code){ toast('核销码不正确，请与游客确认'); return; }
  applyVerify(o);
  confetti.fire();
  closeSheet();
  toast('核销成功 · 已为游客发放 '+Math.round(parseInt(o.paid.replace(/\D/g,''))/10)+' 旅豆');
  setTimeout(()=>{ renderBase(); }, 350);
}
function applyVerify(o){
  o.status = '已核销';
  DB.merch.pending = Math.max(0, DB.merch.pending-1);
  if(o.bean && String(o.bean).startsWith('-')) DB.merch.beans += parseInt(String(o.bean).slice(1));
  const vo = DB.visitorOrders.find(x=>x.code===o.code);
  if(vo){ vo.status='已完成'; }
  DB.admin.stream.unshift({t:'刚刚', d:'核销成功 · '+o.n+' · 旅豆已发放', c:'#f5a623'});
  /* 同步回写底账当日核销数 —— 否则商户端核销了，驾驶舱核销率却一动不动 */
  const L = DB.x.ledger[DB.x.ledger.length - 1];
  if(L && L.vf < L.ord){ L.vf += 1; }
  DB.admin.verifyRate = L ? Math.round(L.vf / L.ord * 1000) / 10 : DB.admin.verifyRate;
}

/** 导出对账单 CSV（真实下载） */
function sbcExportBill(){
  const m = sbcMyLine();
  const rows = [['核销码','时间','游客','藏品','单次金额(元)'],
    ['核销次数合计','','','',m.cnt],
    ['协议单价(元/次)','','','',m.price],
    ['本期应结(元)','','','',rightsLineNet(m)],
    ['账单状态','','','',m.st]];
  sbcMyRedeems(m).forEach(function(r){ rows.push([r.code, r.t, r.g, r.nft, r.amt]); });
  const csv = '\ufeff' + rows.map(function(r){ return r.join(','); }).join('\n');
  const fname = '向往的自由-商户权益对账单-' + m.n + '.csv';
  try{
    const blob = new Blob([csv], { type:'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    toast('对账单已导出 · ' + rows.length + ' 行明细');
  }catch(e){ toast('导出失败：' + e.message); return; }
  /* 页面级回执：导出后在页面上留痕，方便核对与复核 */
  const tip = document.querySelector('#sbcExportTip');
  if(tip){
    tip.innerHTML = ic('i-check') + ' 已导出 <b>' + fname + '</b> · ' + rows.length + ' 行 · ' + stampNow() + ' 生成（含核销码与藏品编号，可直接回传给平台核验）';
    tip.style.display = 'block';
  }
}

function agrSubmit(){
  const m = sbcMyLine();
  const cur = agrPrice(m);
  const to = parseFloat(((($('#agrTo')||{}).value)||'').replace(/[^0-9.]/g,'')) || 0;
  const why = ((($('#agrWhy')||{}).value)||'').trim();
  if(!to || to <= 0){ toast('请填写申请单价'); return; }
  if(to === cur){ toast('申请单价与现行一致，无需变更'); return; }
  if(!why){ toast('请填写变更理由'); return; }
  if(agrMyContracts(m).some(function(c){ return c.st === '待审批'; })){
    toast('你已有一条变更申请在审批中，请等待平台答复'); return; }
  const id = 'AG-1019-' + String(DB.rights.contracts.length + 1).padStart(2,'0');
  DB.rights.contracts.unshift({ id:id, m:m.n, op:m.op, r:m.r, mid:(DB.merch && DB.merch.id) || m.mid || '',
    from:cur, to:to, st:'待审批', by:'商户端线上', at:stampNow(), unit:'元 / 次', why:why, save:m.cnt * (to - cur), lg:[] });
  closeSheet();
  toast('变更申请已提交 · ' + id + '\n' + m.r + ' ¥' + cur + ' → ¥' + to + '，待平台审批');
  repaintContractChange();
}

  try{

    const a = document.createElement('a');

function sensTableHtml(){
  const c = DB.admin.calc;
  const rowStep = Math.max(100, Math.round(c.price*0.25/10)*10);
  const colStep = Math.max(100, Math.round(c.orders*0.25/100)*100);
  const prices = [c.price - rowStep, c.price, c.price + rowStep];
  const orders = [c.orders - colStep, c.orders, c.orders + colStep];
  const cell = function(p, o){
    const gmv = p*o;
    const profit = gmv*c.rate/100 - gmv*c.varCost/100 - gmv*c.equity/100 - c.fixed;
    let bg = '#fdeced', fg = '#c92a2a';
    if(profit >= 0 && profit < c.fixed*0.3){ bg = '#fff6e8'; fg = '#b26a00'; }
    else if(profit >= c.fixed*0.3 && profit < c.fixed){ bg = '#e7f6ee'; fg = '#0f7a46'; }
    else if(profit >= c.fixed){ bg = '#c9ecda'; fg = '#09603a'; }
    return { v: Math.round(profit), bg: bg, fg: fg };
  };
  let html = '<thead><tr><th></th>' + orders.map(function(o){ return '<th>' + o.toLocaleString() + ' 单</th>'; }).join('') + '</tr></thead><tbody>';
  prices.forEach(function(p){
    html += '<tr><th>¥' + p + '</th>' + orders.map(function(o){ const r = cell(p,o); return '<td style="background:'+r.bg+';color:'+r.fg+'">'+(r.v>=0?'':'-') + Math.abs(r.v).toLocaleString() + '</td>'; }).join('') + '</tr>';
  });
  html += '</tbody>';
  return html;
}

function calcResultHtml(){
  const c = DB.admin.calc;
  const gmv = c.orders * c.price;
  const revenue = gmv * c.rate / 100;
  const varC = gmv * c.varCost / 100;
  const eqC = gmv * c.equity / 100;
  const profit = revenue - varC - eqC - c.fixed;
  const be = c.price * (c.rate - c.varCost - c.equity) / 100 > 0 ? Math.round(c.fixed / (c.price * (c.rate - c.varCost - c.equity) / 100)) : Infinity;
  return `
    <div class="cr"><span>月 GMV</span><b>${money(gmv)}</b></div>
    <div class="cr"><span>平台月收入</span><b>${money(Math.round(revenue))}</b></div>
    <div class="cr"><span>月变动成本</span><b>${money(Math.round(varC))}</b></div>
    <div class="cr"><span>月权益成本</span><b>${money(Math.round(eqC))}</b></div>
    <div class="cr"><span>月固定成本</span><b>${money(c.fixed)}</b></div>
    <div class="cr big ${profit<0?'neg':''}"><span>月经营贡献结余</span><b>${money(Math.round(profit))}</b></div>
    <div class="cr big"><span>盈亏平衡月订单量</span><b>${be===Infinity?'无法平衡':be.toLocaleString()+' 单'}</b></div>
    <div class="cr-note">当前参数${(c.orders===3000&&c.price===399&&c.rate===20&&c.varCost===9&&c.equity===2&&c.fixed===180000)?'与总体方案 §8.2 示例假设一致':''} · 单位贡献利润 ${money(Math.round(c.price*(c.rate-c.varCost-c.equity)/100))}/单 · 固定成本需 ${be===Infinity?'—':be.toLocaleString()} 单覆盖</div>`;
}
/* 方案 §8.1：从亏损走到盈亏平衡的四条路径 */
function pathsHtml(){
  const c = DB.admin.calc;
  const gmv = c.orders * c.price;
  const margin = (c.rate - c.varCost - c.equity) / 100;
  const profit = gmv * margin - c.fixed;
  if(profit >= 0) return '<div class="path-ok">' + '<b>已实现盈亏平衡</b><span>月经营贡献结余 ' + money(Math.round(profit)) + '，每单贡献 ' + money(Math.round(c.price*margin)) + '</span></div>';
  const gap = -profit;
  if(margin <= 0) return '<div class="path-warn">综合变现率不高于变动成本率与权益成本率之和，单位贡献利润为负，单量越大亏损越大。需先修复定价结构。</div>';
  const needPrice = Math.ceil(c.fixed / (c.orders * margin));
  const needRate  = Math.round((c.fixed / gmv * 100 + c.varCost + c.equity) * 10) / 10;
  const needFixed = Math.round(gmv * margin);
  const needOrders= Math.ceil(c.fixed / (c.price * margin));
  const items = [
    { n:'提客单价', cur:'¥'+c.price, need:'¥'+needPrice, d:'+'+(Math.round((needPrice/c.price-1)*1000)/10)+'%', v:'靠主题游深度与二销组合拉高，非普涨' },
    { n:'提综合变现率', cur:c.rate+'%', need:needRate+'%', d:'+'+(Math.round((needRate-c.rate)*10)/10)+'pp', v:'增加内容授权、SaaS、跨境服务收入' },
    { n:'降月固定成本', cur:(c.fixed/10000)+'万', need:(Math.round(needFixed/1000)/10)+'万', d:(Math.round((needFixed/c.fixed-1)*1000)/10)+'%', v:'单城小队 + 共享中台，不做重资产前置' },
    { n:'提月订单量', cur:c.orders+'单', need:needOrders.toLocaleString()+'单', d:'+'+(Math.round((needOrders/c.orders-1)*1000)/10)+'%', v:'方案 §8.2 基准解法：约 5,000 单/月' },
  ];
  return '<div class="path-gap">距盈亏平衡缺口 <b>' + money(Math.round(gap)) + '</b>/月 · 以下任一单变量路径可达</div>' +
    items.map(function(it){
      return '<div class="path-row"><div class="pr-n">' + it.n + '</div>' +
        '<div class="pr-v"><span>' + it.cur + '</span><i>→</i><b>' + it.need + '</b><em>' + it.d + '</em></div>' +
        '<div class="pr-d">' + it.v + '</div></div>';
    }).join('');
}

function handleAudit(id, act){

  const i = DB.admin.audits.findIndex(function(a){ return a.id === id; });
  if(i < 0) return;
  const x = DB.admin.audits[i];
  /* 处置即入账：本月已审 +1，通过率随之重算（统计不能停在静态快照） */
  const ST = DB.x.auditStat;
  const passBefore = Math.round(ST.done * ST.passPct / 100);
  ST.done += 1;
  ST.passPct = Math.round((passBefore + (act === 'pass' ? 1 : 0)) / ST.done * 1000) / 10;
  if(act === 'pass'){
    if(x.t === 'UGC 内容'){
      DB.wallet += 50;
      DB.txLog.unshift({d:'游记被平台推荐奖励', t:'刚刚', a:'+50', p:'plus', chain:''});
    }
    toast('已通过：'+x.n + ' · 本月通过率 ' + ST.passPct + '%');
  } else {
    toast('已驳回：'+x.n + ' · 本月通过率 ' + ST.passPct + '%');
  }
  DB.admin.audits.splice(i,1);
  renderBase();
}

/* ============================================================

   可玩链路：预算池校验 → 批次启用 → 发放/冻结/回收 → 四本账核对
   全部真实改 DB.engine / DB.wallet / DB.txLog
   ============================================================ */
const ENG_STEPS = {
  reward:[
    { k:'cap',   t:'第 1 步 · 预算上限校验', d:'按方案 min(已批准营销预算, 可承受贡献利润) 计算可发额度' },

    { k:'cs',     t:'第 2 步 · 计算 CS',    d:'CS = 0.5Q + 0.3S + 0.2R，三维加权得贡献分' },
    { k:'anti',   t:'第 3 步 · 作弊检测',   d:'同一 IP 批量注册、异常点击比等命中即拦截' },
    { k:'split',  t:'第 4 步 · 分润分配',   d:'按 CS 占比分配当月分润池，实时给出每人金额' },
  ],
  settle:[
    { k:'split',  t:'第 1 步 · 订单分账',   d:'按履约/服务费/合伙人/预算池/留存五口径拆分，数字自洽' },
    { k:'refund', t:'第 2 步 · 退款冲正',   d:'退款生成负向分账，回收已发权益与预算池注入' },
    { k:'recon',  t:'第 3 步 · 商家对账',   d:'订单流水与商家应结逐笔比对，生成对账单' },

  ],
  gateway:[
    { k:'key',    t:'第 1 步 · 密钥与权限', d:'境内走旅豆通道，境外走 Voyage Token，账本物理隔离' },
    { k:'catalog',t:'第 2 步 · 接口目录',   d:'五个开放接口，含配额与调用量' },
    { k:'debug',  t:'第 3 步 · 在线调试',   d:'填参数真实发起调用，返回结构化 JSON' },
    { k:'quota',  t:'第 4 步 · 配额与限流', d:'接近阈值自动告警，可扩容' },
  ],
};
function engSteps(k){
  return (ENG_STEPS[k]||[]).map((s,i)=>{
    const done = (S.engStep && S.engStep[k] || []).indexOf(s.k) >= 0;
    const btn = done
      ? `<button class="egm-btn ghost" disabled>${ic('i-check')} 已完成</button>`
      : `<button class="egm-btn" onclick="engDo('${k}','${s.k}')">${i===0?'开始':s.t.slice(0,4).trim()}</button>`;
    return `<div class="egm-step ${done?'done':''}">
      <div class="n">${done?'✓':i+1}</div>
      <div class="t"><b>${s.t}</b><span>${s.d}</span></div>
      ${btn}
    </div>`;
  }).join('');
}
function engMark(k, step){
  S.engStep = S.engStep || {};
  S.engStep[k] = S.engStep[k] || [];
  if(S.engStep[k].indexOf(step) < 0) S.engStep[k].push(step);
}
function engLog(k, d, lv){
  lv = lv || 'ok';
  const c = lv==='ok' ? '#0f9d58' : lv==='warn' ? '#e8a020' : '#e5484d';
  const bg = lv==='ok' ? '#e8f6ee' : lv==='warn' ? '#fdf3e0' : '#fdecec';
  /* 三本日志表按引擎分别初始化，避免首次写入时目标数组不存在 */
  if(k === 'gateway')      DB.gateway.logs   = DB.gateway.logs   || [];
  else if(k === 'contrib') DB.contrib.logs   = DB.contrib.logs   || [];
  else                      DB.engine.log     = DB.engine.log     || [];
  const target = k==='gateway' ? DB.gateway.logs : k==='contrib' ? DB.contrib.logs : DB.engine.log;
  target.unshift({ t:'刚刚', d:d, lv:lv, c:c, bg:bg });
}
function engDo(k, step){
  const fn = ({ 'reward:cap':'rwCap','reward:batch':'rwBatch','reward:issue':'rwIssue','reward:life':'rwLife','reward:book':'rwBook',
                'contrib:submit':'ctSubmit','contrib:cs':'ctCalc','contrib:anti':'ctAnti','contrib:split':'ctSplit',
                'settle:split':'stSplit','settle:refund':'stRefund','settle:recon':'stRecon','settle:comm':'stComm',
                'gateway:key':'gwKey','gateway:catalog':'gwCatalog','gateway:debug':'gwDebug','gateway:quota':'gwQuota' })[k+':'+step];
  if(fn && typeof window[fn] === 'function') window[fn]();
}

/* ---------- 激励引擎 ---------- */
function rwCap(){
  const b = DB.admin.budget;
  /* 口径统一（与运营端风控页 / 支付流 applyOrder 一致）：
     total=已批准营销预算 · issued=已发行额度 · used=已核销 · 剩余可发=total-issued */
  const room = b.total - b.issued;
  engMark('reward','cap');
  engLog('reward','预算池校验通过：已批准营销预算 '+fmtNum(b.total)+' − 已发行 '+fmtNum(b.issued)+' = 剩余可发 '+fmtNum(room)+' 旅豆');
  engLog('reward','已核销 '+fmtNum(b.used)+'，剩余可发额度 '+fmtNum(room)+' 旅豆', room>0?'ok':'warn');
  toast('预算上限校验通过 · 可发 '+fmtNum(Math.max(0,room))+' 豆');
  repaintEngine('reward');
}
function rwBatch(){
  const nb = DB.engine.batches.find(x=>x.st==='待启用');
  if(!nb){ toast('所有批次已启用 · 无待启用批次'); repaintEngine('reward'); return; }
  nb.st = '进行中';
  engMark('reward','batch');
  engLog('reward','批次 '+nb.id+'「'+nb.n+'」已启用，额度 '+fmtNum(nb.amt)+' 挂入预算池，周期 '+nb.d);
  toast('批次已启用 · '+nb.n);
  repaintEngine('reward');
}
function rwIssue(){
  const t = DB.engine.tasks.find(x=>x.st==='pending');
  if(!t){ toast('没有待发放任务 · 全部已处理'); repaintEngine('reward'); return; }
  const b = DB.admin.budget;
  if(b.total - b.issued < t.amt){ toast('预算池额度不足 · 已拦截'); engLog('reward','拦截：'+t.n+' 需 '+t.amt+' 豆，剩余可发 '+fmtNum(Math.max(0,b.total-b.issued))+' 不足','warn'); repaintEngine('reward'); return; }
  t.st = 'done';
  b.issued += t.amt;
  DB.wallet += t.amt;
  const bat = DB.engine.batches[0]; bat.used += t.amt;
  DB.txLog.unshift({ d:t.n, t:todayStr(), a:'+'+t.amt, p:'plus', chain:'0x'+Math.random().toString(16).slice(2,10)+'…'+Math.random().toString(16).slice(2,6) });
  engMark('reward','issue');
  engLog('reward','发放 '+t.amt+' 豆 → '+t.to+'（'+t.n+'）；已发行 '+fmtNum(b.issued)+'，剩余可发 '+fmtNum(b.total-b.issued)+'，钱包余额 '+DB.wallet);
  toast('已发放 +'+t.amt+' 旅豆 · '+t.to);
  repaintEngine('reward');
}
function rwLife(){
  const fz = DB.engine.tasks.find(x=>x.st==='frozen');
  if(fz){
    fz.st = 'pending';
    engLog('reward','解冻 '+fz.n+'（'+fz.amt+' 豆）：T+7 售后期满，未发生退款，恢复可发放');
    toast('已解冻 · '+fz.n);
  } else {
    const rc = DB.engine.tasks.find(x=>x.st==='recycle');
    if(rc){
      rc.st = 'done';
      DB.engine.recycled = (DB.engine.recycled||0) + rc.amt;
      engLog('reward','回收 '+rc.n+'（'+rc.amt+' 豆）：有效期届满，回收后不重新发行，避免超发；回收账累计 '+fmtNum(DB.engine.recycled),'warn');
      toast('已回收 · 不再发行');
    } else {
      DB.engine.tasks.push({ id:'R-'+(90+DB.engine.tasks.length), n:'新增待发放 · 履约完成', amt:60, to:'U-'+(2000+Math.floor(Math.random()*900)), st:'pending', d:'履约确认后发放', why:'演示数据' });
      engLog('reward','新增一笔待发放任务，用于继续演示发放流程','warn');
      toast('已新增一笔待发放任务');
    }
  }
  engMark('reward','life');
  repaintEngine('reward');
}
function rwBook(){
  const b = DB.admin.budget;
  const books = DB.engine.books;
  /* 四本账与预算池字段同口径：发行账=已发行 · 流通账=持有量 · 核销账=已核销 · 回收账=累计回收 */
  books[0].v = fmtNum(b.issued);
  books[1].v = fmtNum(DB.wallet * 100);
  books[2].v = fmtNum(b.used);
  books[3].v = fmtNum(DB.engine.recycled || 0);
  engMark('reward','book');
  engLog('reward','四本账已分别核对：发行账 '+books[0].v+' / 流通账 '+books[1].v+' / 核销账 '+books[2].v+' / 回收账 '+books[3].v);
  toast('四本账已核对 · 口径独立不混同');
  repaintEngine('reward');
}

/* ---------- 贡献引擎 ---------- */
function csOf(it){ return Math.round(it.q * 0.5 + it.s * 0.3 + it.r * 0.2); }
function ctSubmit(){
  const w = DB.contrib.items.find(x=>x.st==='待确认');
  if(w){ toast(w.n+' 已在流程中 · 等下一步确认'); repaintEngine('contrib'); return; }
  DB.contrib.items.push({ id:'C-0'+(DB.contrib.items.length+1), n:'湖州亲子露营实拍笔记', a:'牧云', q:79, s:74, r:66, st:'待确认', bad:false, earn:0, d:'刚提交 · 待确认质量分与采纳情况' });
  engMark('contrib','submit');
  engLog('contrib','收到新内容《湖州亲子露营实拍笔记》，进入待确认队列');
  toast('内容已提交 · 进入待确认');
  repaintEngine('contrib');
}
function ctCalc(){
  let any = false;
  DB.contrib.items.forEach(function(it){
    if(it.st==='待确认'){ it.st = '已确认'; it.cs = csOf(it); any = true; }
  });
  if(!any){ toast('没有待确认内容 · 已完成全部计算'); repaintEngine('contrib'); return; }
  const bad = DB.contrib.items.filter(x=>x.bad);
  engMark('contrib','cs');
  engLog('contrib','CS = 0.5Q + 0.3S + 0.2R 已计算：' + DB.contrib.items.filter(x=>!x.bad).map(x=>x.n.slice(0,10)+'='+x.cs).join('、'));
  if(bad.length) engLog('contrib','注意：'+bad.map(x=>x.n).join('、')+' 命中反作弊规则，CS 不参与分润', 'warn');
  toast('CS 已计算 · 参与分润 ' + DB.contrib.items.filter(x=>!x.bad).length + ' 条');
  repaintEngine('contrib');
}
function ctAnti(){
  const bad = DB.contrib.items.filter(x=>x.bad && x.st!=='已拦截');
  if(!bad.length){
    engLog('contrib','本轮未发现新增作弊特征，风控规则持续生效');
    toast('未发现新增作弊特征');
  } else {
    bad.forEach(function(x){ x.st = '已拦截'; x.cs = 0; });
    const names = bad.map(x=>x.n).join('、');
    engLog('contrib','反作弊拦截：'+names+'（同一 IP 批量注册 46 账号，互动结构异常）', 'err');
    /* 幂等写入：已存在同源告警则不重复追加，避免运营端告警列表被刷屏 */
    if(!DB.admin.warnings.some(w=>String(w.d).indexOf('安吉瑜伽谷避坑指南') >= 0)){
      DB.admin.warnings.unshift({ t:'刷单特征已确认', lv:'高', c:'#e5484d', d:'内容《安吉瑜伽谷避坑指南》同一 IP 批量注册 46 账号，已拦截并冻结该账号 CS 结算，建议人工复核。' });
    }
    toast('已拦截 ' + bad.length + ' 条作弊内容');
  }
  engMark('contrib','anti');
  repaintEngine('contrib');
}
function ctSplit(){
  const valid = DB.contrib.items.filter(x=>x.cs && !x.bad);
  const total = valid.reduce(function(s,x){ return s + x.cs; }, 0);
  if(!total){ toast('请先完成 CS 计算'); repaintEngine('contrib'); return; }
  const dist = valid.map(function(x){
    const share = x.cs / total;
    return { n:x.n, a:x.a, cs:x.cs, pct:Math.round(share*1000)/10, amt:Math.round(DB.contrib.pool * share) };
  });
  DB.contrib.dist = dist;
  engMark('contrib','split');
  engLog('contrib','当月分润池 ¥'+fmtNum(DB.contrib.pool)+' 按 CS 占比分配：' + dist.map(x=>x.a+' ¥'+fmtNum(x.amt)).join('、'));
  toast('分润已分配 · 合计 ¥' + dist.reduce(function(s,x){return s+x.amt;},0));
  repaintEngine('contrib');
}

/* ---------- 结算引擎 ---------- */
function stSplit(){
  const o = DB.settle.orders.find(x=>x.st==='待对账');
  if(!o){ toast('没有待分账订单 · 全部已处理'); repaintEngine('settle'); return; }
  const sum = DB.settle.ratio.reduce(function(s,r){ return s + r.pct; }, 0);
  o.split = DB.settle.ratio.map(function(r){ return { k:r.k, pct:r.pct, amt:Math.round(o.amt * r.pct / 100), c:r.c, to:r.to }; });
  o.st = '已分账';
  /* 预算池注入 5% 分账即确认，占用已发行额度；退款时原路回收（见 stRefund） */
  const poolIn = o.split.find(x=>x.k==='预算池注入');
  if(poolIn){
    DB.admin.budget.issued += poolIn.amt;
    engLog('settle','预算池注入 '+poolIn.amt+' 豆已占用发行额度，剩余可发 '+fmtNum(DB.admin.budget.total - DB.admin.budget.issued));
  }
  engMark('settle','split');
  engLog('settle','订单 '+o.id+'（'+o.merch+' ¥'+fmtNum(o.amt)+'）分账完成，占比合计 '+sum+'%：' + o.split.map(x=>x.k+' ¥'+x.amt).join('、'));
  if(Math.abs(o.split.reduce(function(s,x){return s+x.amt;},0) - o.amt) > 1) engLog('settle','注意：分账明细与订单金额存在四舍五入差额，已计入留存毛利','warn');
  toast('分账完成 · ' + o.id);
  repaintEngine('settle');
}
function stRefund(){
  const o = DB.settle.orders.filter(function(x){ return x.split && x.refund===0; })[0];
  if(!o){ toast('没有可冲正的已分账订单'); repaintEngine('settle'); return; }
  o.refund = o.amt;
  o.st = '已冲正';
  o.splitRev = o.split.map(function(x){ return { k:x.k, amt:-x.amt, c:x.c }; });
  const poolBack = o.split.find(x=>x.k==='预算池注入');
  if(poolBack){
    DB.admin.budget.issued = Math.max(0, DB.admin.budget.issued - poolBack.amt);
    engLog('settle','退款冲正：预算池注入 '+poolBack.amt+' 豆原路回收，剩余可发 '+fmtNum(DB.admin.budget.total - DB.admin.budget.issued), 'warn');
  }
  const beanBack = DB.txLog.filter(function(x){ return x.d.indexOf(o.merch) >= 0 || x.d.indexOf(o.amt) >= 0; })[0];
  if(beanBack){ engLog('settle','已发旅豆权益按规则扣回，冲正流水 '+beanBack.a+' 豆','warn'); }
  engMark('settle','refund');
  engLog('settle','订单 '+o.id+' 全额退款 ¥'+fmtNum(o.amt)+'，生成负向分账：' + o.splitRev.map(x=>x.k+' ¥'+x.amt).join('、'), 'warn');
  toast('已冲正 · ' + o.id);
  repaintEngine('settle');
}
function stRecon(){
  const done = DB.settle.orders.filter(x=>x.split);
  if(!done.length){ toast('请先完成订单分账'); repaintEngine('settle'); return; }
  const rows = done.map(function(o){
    const gross = o.split ? o.split.filter(x=>x.to==='商户/供应商').reduce(function(s,x){return s+x.amt;},0) : 0;
    /* 全额退款的订单应结为 0，不允许出现负数应结 */

function nftIssue(i){
  const p = DB.nftOps.plans[i];
  if(!p) return;
  if(p.st !== '进行中'){ toast('该计划未在进行中，不能铸造'); repaintNftOps(); return; }
  const left = p.supply - p.minted;
  if(left <= 0){ p.st = '已结束'; toast('该计划已铸造完毕'); repaintNftOps(); return; }
  const n = Math.min(120, left);
  p.minted += n;
  if(p.minted >= p.supply) p.st = '已结束';
  DB.nftOps.seq += 1;
  const bh = ++DB.web3.chainInfo.height;
  DB.nftOps.batches.unshift({ id:'BT-' + DB.nftOps.seq, plan:p.id, n:n, t:nftNow(),
    by:'运营 · 当前账号', hash:nftHash(), st:'已确认' });
  toast('已铸造 ' + n + ' 张 · ' + p.n + '\n批次 BT-' + DB.nftOps.seq + ' 已确认 · 区块 #' + bh.toLocaleString());
  repaintNftOps();
}

function rsnSum(){
  const R = DB.rights;

  const settled = R.merchants.filter(function(m){ return m.st === '已确认'; })
    .reduce(function(a,m){ return a + rightsLineNet(m); }, 0);
  const openAppeals = R.appeals.filter(function(a){ return a.st === '待受理'; });
  return {
    total: total, settled: settled, pending: total - settled,
    wait: R.merchants.filter(function(m){ return m.st === '待确认'; }).length,
    open: R.diffs.filter(function(d){ return d.st === '待处置'; }).length,
    ap: openAppeals.length,
    apAmt: openAppeals.reduce(function(a,x){ return a + x.amt; }, 0),
    cnt: R.merchants.reduce(function(a,m){ return a + m.cnt; }, 0),

}

}
function agrApprove(i){
  const C = DB.rights.contracts, c = C[i];
  if(!c || c.st !== '待审批'){ toast('该变更单已处理'); repaintRights(); return; }
  const m = DB.rights.merchants.filter(function(x){ return x.n === c.m; })[0];
  const before = rightsRealized().net;
  const oldAmt = m ? m.amt : 0;
  c.st = '已生效';
  c.lg = (c.lg || []).concat([{ t:stampNow(), by:'运营 · 王璐', d:'同意，自下一账期起按 ¥' + c.to + ' / 次结算' }]);
  /* 协议生效即重算账实：应收额 = 核销次数 × 新协议单价 */
  if(m){ m.amt = m.cnt * c.to; }
  const after = rightsRealized().net;
  const o = overrunState();
  toast(c.m + ' 协议价 ¥' + c.from + ' → ¥' + c.to + ' 已生效\n该条线应收 ¥' + oldAmt.toLocaleString() + ' → ¥' + (m ? m.amt : 0).toLocaleString() +
    '\n本期权益成本 ¥' + before.toLocaleString() + ' → ¥' + after.toLocaleString() +

  repaintRights();
}

}

    <div class="bill-no">${B.no}</div>
    <div class="bill-d">${B.st === '待生成' ? '尚未生成。生成后按商户逐笔核算核销次数与协议单价，推送对方确认。'
      : '生成于 ' + B.at + ' · 已推送 ' + R.merchants.length + ' 家商户。商户可在商户端「我的权益对账单」自行核对、确认或申诉，平台也可线下代录。'}</div>
    <div class="bill-3">
      <div><b>¥${s.total.toLocaleString()}</b><span>本期应结</span></div>
      <div><b>${confirmCnt} / ${R.merchants.length}</b><span>商户已确认</span></div>
      <div><b style="color:${s.pending?'#ffd8a8':'#8ce99a'}">¥${s.pending.toLocaleString()}</b><span>待结</span></div>
    </div>
    <button class="bill-btn${cls}" onclick="${B.st==='待生成'?'rsnMakeBill()':(s.wait||s.open||s.ap?'rsnRemind()':'rsnPushSplit()')}">${label}</button>
    ${B.st !== '待生成' && (s.wait || s.open || s.ap) ? `<div style="font-size:9px;opacity:.82;margin-top:8px;line-height:1.6">未清项：${s.wait} 家未确认 · ${s.open} 条差异 · ${s.ap} 条申诉待受理${B.remind ? '（已催办 ' + B.remind + ' 次）' : ''}</div>` : ''}
  </div>`;
}
/** 催办：记录催办次数，通知未确认商户 */
function rsnRemind(){
  const R = DB.rights, s = rsnSum();
  R.bill.remind = (R.bill.remind || 0) + 1;
  const names = R.merchants.filter(function(m){ return m.st !== '已确认'; })
    .map(function(m){ return m.n; }).join('、');
  toast('已催办 ' + s.wait + ' 家未确认商户 · 累计 ' + R.bill.remind + ' 次\n通知：' + names +
    (s.ap ? '\n另有 ' + s.ap + ' 条申诉待受理' : ''));
  repaintRights();
}

      <div><b class="num">${s.cnt.toLocaleString()}</b><span>本期核销次数</span></div>

      <div><b class="num">¥${s.pending.toLocaleString()}</b><span>待结算</span></div>
    </div>

    </div>
  </div>

  <div class="nfo-kpi">
    <div class="nk"><b class="num">89.9%</b><span>领取率</span></div>

    <div class="nk"><b class="num" style="color:${s.ap?'#e03131':'#0f9d58'}">${s.ap}</b><span>待受理申诉</span></div>
    <div class="nk"><b class="num" style="color:${R.merchants.length-rsnConfirmN()?'#b26a00':'#0f9d58'}">${R.merchants.length-rsnConfirmN()}</b><span>未清商家</span></div>
  </div>

  <div class="sec-title">核销漏斗 <span class="more">发行 → 领取 → 激活 → 核销 → 复购</span></div>
  <div class="rsn-card">
    <div class="rsn-h"><b>从发行到复购，每一层都在掉人</b><span>复购率 19.9%</span></div>
    ${R.funnel.map(function(f){ return `
      <div class="fs-row">
        <span class="fs-n">${f.n}</span>
        <div class="fs-bar"><i style="width:${f.p}%;background:${f.c}"></i></div>
        <span class="fs-v">${f.v.toLocaleString()}</span>
        <span class="fs-p">${f.p}%</span>
      </div>`; }).join('')}
    <div style="font-size:9px;color:var(--faint);line-height:1.6;margin-top:8px">核销率 63.1% 是行业偏上水平（文旅类数字权益通常在 35–55%）；真正的问题是<b style="color:#e87722">复购只有 19.9%</b>——权益兑完了没有第二件事可做。</div>
  </div>

  <div class="sec-title">本期对账单 <span class="more">生成 → 商家确认 → 入分账</span></div>
  ${rsnBillBox()}

  <div class="sec-title">按商家逐笔对账 <span class="more">${R.merchants.length} 家 · ${s.cnt.toLocaleString()} 次核销</span></div>
  ${R.merchants.map(function(m,i){ return rsnMerchantCard(m,i); }).join('')}

  <div class="sec-title">商家申诉 <span class="more">${R.appeals.filter(function(a){ return a.st === '待受理'; }).length} 条待受理 · 商户端发起</span></div>
  ${R.appeals.length ? R.appeals.map(function(a,i){ return rsnAppealCard(a,i); }).join('')
    : '<div class="rsn-card" style="text-align:center;color:var(--sub);font-size:10.5px;padding:20px">本期暂无商家申诉</div>'}
  ${(R.appealLog||[]).length ? R.appealLog.map(function(a){ return rsnAppealCard(a, -1); }).join('') : ''}

  <div class="sec-title">差异单 <span class="more">${s.open} 条待处置 · 商家与平台口径不一致</span></div>
  ${R.diffs.map(function(d,i){ return rsnDiffCard(d,i); }).join('')}

  <div class="sec-title">下期预算预测 · 事前预警 <span class="more">按周节奏外推 · 破线前干预</span></div>

  <div class="sec-title">协议变更审批 <span class="more">${agrOpenN()} 条待审批 · 商户端发起</span></div>

function rsnMakeBill(){
  const R = DB.rights;
  if(R.bill.st !== '待生成'){ toast('对账单已生成 · 单号 ' + R.bill.no); repaintRights(); return; }
  R.bill.st = '已生成';
  R.bill.no = 'ST-20261019-01';
  R.bill.at = nftNow();
  toast('对账单已生成并推送 ' + R.merchants.length + ' 家商户\n单号 ST-20261019-01 · 线下盖章后回传确认');
  repaintRights();
}
function rsnConfirm(i){
  const m = DB.rights.merchants[i];
  if(!m) return;
  if(m.st === '已确认'){
    toast(m.n + ' 本期已确认' + (m.by ? '（' + m.by + '）' : '') + ' · ¥' + rightsLineNet(m).toLocaleString());
    repaintRights(); return; }
  if(m.st === '差异' || m.st === '申诉中'){
    const openD = DB.rights.diffs.filter(function(d){ return d.m === m.n && d.st === '待处置'; }).length;
    const openA = DB.rights.appeals.filter(function(a){ return a.m === m.n && a.st === '待受理'; }).length;
    toast(m.n + ' 有 ' + openD + ' 条差异 / ' + openA + ' 条申诉待处理，不能直接确认');
    repaintRights(); return; }
  m.st = '已确认';
  m.by = m.by || '平台代录';
  toast(m.n + ' 对账已确认 · ¥' + rightsLineNet(m).toLocaleString() + ' 转入可结算');
  repaintRights();
}
function rsnResolve(i){
  const d = DB.rights.diffs[i];
  if(!d) return;
  if(d.st === '已处置'){ toast('该差异已处置'); repaintRights(); return; }
  d.st = '已处置';
  d.done = '核减 ¥' + d.amt + ' · ' + nftNow();
  const left = DB.rights.diffs.filter(function(x){ return x.m === d.m && x.st === '待处置'; }).length;
  if(!left){
    DB.rights.merchants.forEach(function(m){ if(m.n === d.m && m.st === '差异') m.st = '待确认'; });
  }
  toast('已按平台口径核减 ¥' + d.amt + ' · 账单同步' +
    (left ? '\n' + d.m + ' 还有 ' + left + ' 条差异待处置' : '\n' + d.m + ' 差异清零，可登记确认'));
  repaintRights();
}
function rsnPushSplit(){
  const R = DB.rights, s = rsnSum();
  if(R.bill.st === '待生成'){ toast('请先生成本期对账单'); repaintRights(); return; }
  if(R.bill.st === '已入分账'){ toast('本期已并入分账 · 凭证 ' + R.bill.voucher); repaintRights(); return; }
  if(s.wait || s.open || s.ap){
    toast('还不能入分账：' + s.wait + ' 家未确认 · ' + s.open + ' 条差异待处置' + (s.ap ? ' · ' + s.ap + ' 条申诉待受理' : ''));
    repaintRights(); return;
  }
  R.bill.st = '已入分账';
  R.bill.voucher = 'SV-20261019-03';
  toast('已并入本期分账 · 凭证 SV-20261019-03\n权益成本 ¥' + s.total.toLocaleString() + ' 计入结算引擎');
  repaintRights();
}
''
/* ===== 商家申诉受理（v1.7） ===== */
/** 受理：按商家主张调整应付 → 该条线金额上浮，权益成本与分账视图同步变化 */
function rsnAcceptAppeal(i){
  const a = DB.rights.appeals[i];
  if(!a) return;
  if(a.st !== '待受理'){ toast('该申诉已处理'); repaintRights(); return; }
  const m = DB.rights.merchants.filter(function(x){ return x.n === a.m; })[0];
  if(!m){ toast('未找到对应结算条线'); repaintRights(); return; }
  const before = m.amt;
  m.amt = m.amt + a.amt;
  a.st = '已受理';
  a.done = '按主张调整 +¥' + a.amt + ' · ' + nftNow();
  if(m.st === '申诉中') m.st = '待确认';
  toast(a.m + ' 申诉已受理 · 应付 ¥' + before.toLocaleString() + ' → ¥' + m.amt.toLocaleString() +
    '\n权益成本 +¥' + a.amt.toLocaleString() + '，分账视图实绩已同步');
  repaintRights();
}
/** 驳回：维持原额，商家可继续核对 */
function rsnRejectAppeal(i){
  const a = DB.rights.appeals[i];
  if(!a) return;
  if(a.st !== '待受理'){ toast('该申诉已处理'); repaintRights(); return; }
  a.st = '已驳回';
  a.done = '维持协议价 · ' + nftNow();
  const m = DB.rights.merchants.filter(function(x){ return x.n === a.m; })[0];
  if(m && m.st === '申诉中') m.st = '待确认';
  toast('申诉已驳回 · 维持协议价 ¥' + (m ? m.price : '—') + ' / 次\n商家可继续核对或线下补充材料');
  repaintRights();
}

setTimeout(()=>{ if(S.loggedIn) toast('演示原型 · 右侧面板可播放四端数据联动'); }, 900);
