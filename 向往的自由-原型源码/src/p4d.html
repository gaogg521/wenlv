/* ==========================================================================
   v1.10 · 经营口径引擎（平台运营端多时间维度）
   —— 一份逐日底账聚合出「今日 / 近 7 日 / 近 30 日 / 近 90 日 / 本月」全部口径
   —— 铁律：视图层不得硬写数字，KPI 值、环比、目标达成、分城占比全部派生
   ========================================================================== */

/* 确定性伪随机（固定种子）—— 保证每次加载得到同一份底账，多口径可复现 */
function _lcg(seed){
  let s = seed % 2147483647;
  if(s <= 0) s += 2147483646;
  return function(){ s = s * 16807 % 2147483647; return (s - 1) / 2147483646; };
}

/* 在途核销参数：最近 N 天订单仍在核销期内，核销率按系数折损。
   生成底账与「诊断是否属在途」共用这一组常量，避免两处各写一套。 */
const LAG = { days:4, factor:0.92 };

/* 近 180 日逐日经营底账
   ord=成交单 / gmv=成交额 / vf=已核销单 / ugc=内容提交
   aov=当日客单价（中枢 ¥298，与「一单 ¥298 分账」口径严格一致）
   节奏 = 月度爬坡 × 周末上扬 × 噪声；核销率含「最近 4 日在途折损」 */
DB.x.ledger = (function(){
  const LAST = new Date(2026, 9, 19);            /* 演示数据截止日 2026-10-19 */
  const N = 180, rnd = _lcg(20261019), out = [];
  for(let i = 0; i < N; i++){
    const back = N - 1 - i;                      /* 距截止日天数，0=当日 */
    const dt = new Date(LAST.getTime() - back * 86400000);
    const t = i / (N - 1);                       /* 0=最早 → 1=当日 */
    const ramp = 0.70 + 0.58 * t;                /* 爬坡 0.70 → 1.28 */
    const wd = dt.getDay();                      /* 0=周日 */
    const wk = (wd === 6 || wd === 0) ? 1.22 : (wd === 5 ? 1.10 : (wd === 1 ? 0.96 : 1));
    const noise = 0.94 + rnd() * 0.12;
    const ord = Math.max(8, Math.round(37 * ramp * wk * noise));
    const aov = 258 + Math.round(rnd() * 8) * 10;  /* 258–338，中枢 298 */
    const vr  = 0.70 + rnd() * 0.06;               /* 理论核销率 70%–76% */
    const lag = back < LAG.days ? LAG.factor : 1;  /* 最近数日在途未核销 */
    out.push({
      d: String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'),
      m: dt.getMonth() + 1, g: dt.getDate(), wd: wd,
      ord: ord, gmv: ord * aov, aov: aov,
      vf: Math.round(ord * vr * lag),
      ugc: Math.max(1, Math.round(ord * 0.40 * noise)),
      rep: 0.355 + rnd() * 0.10,                   /* 复购单占比 */
      nat: 0.300 + rnd() * 0.085,                  /* 自然获客单占比 */
      cac: 30 + rnd() * 18,                        /* 单客获取成本（元） */
    });
  }
  return out;
})();

/* 目标基线（驾驶舱与目标对比的唯一来源） */
DB.x.goal = { gmvPerDay:15000, verify:72, rep:40, nat:33, aov:298 };

/* 分城结构
   w   = 占大盘权重（合计 1.000）
   dev = 相对大盘环比的偏离（pp）—— 核心城各自独立增长，不用固定值硬套各口径
   vf  = 核销率相对大盘的系数
   core= 战略城市（参与结构诊断）；false 为长尾「其他城市」，作上期差口的平衡项 */

];

/* 四条业务线在长周期里的占比漂移（SaaS 与跨境随合作深入自然上升） */
const BIZ_W = {
  '7d':  [62, 21, 12, 5],
  '30d': [60, 22, 13, 5],
  '90d': [56, 23, 15, 6],
  'mtd': [61, 21, 13, 5],
};

/* 口径定义
   刻意不含「今日」单日口径：单日样本下城市环比纯属噪音，会产出错误结论。
   实时性由 hero 的「实时」徽标与「实时业务流」承担，与区间分析分开。 */
const RANGE_OPTS = [
  { k:'7d',  l:'近 7 日',  days:7 },
  { k:'30d', l:'近 30 日', days:30 },
  { k:'90d', l:'近 90 日', days:90 },
  { k:'mtd', l:'本月',     days:0 },   /* 动态：自然月 1 日至今 */
];
DB.x.range = { cur:'7d' };

function _sumBy(arr, f){ return arr.reduce(function(a, x){ return a + f(x); }, 0); }

/* 取某口径的 [本期窗口, 上期等长窗口] */
function _window(k){
  const L = DB.x.ledger, n = L.length, last = L[n-1];
  if(k === 'mtd'){
    const arr = L.filter(function(x){ return x.m === last.m; });
    const days = arr.length;
    const prev = L.slice(Math.max(0, n - arr.length - days), Math.max(0, n - arr.length))
                  .filter(function(x){ return x.m === last.m - 1; })
                  .slice(-days);
    return { cur:arr, prev:prev, days:days,
             label: last.m + ' 月 1 日 – ' + last.m + ' 月 ' + last.g + ' 日',
             prevLabel: (last.m - 1) + ' 月同期' };
  }
  const d = Number(String(k).replace('d', '')) || 7;
  const cur = L.slice(Math.max(0, n - d));
  const prev = L.slice(Math.max(0, n - 2*d), Math.max(0, n - d));
  return { cur:cur, prev:prev, days:cur.length,
           label: cur[0].d + ' – ' + cur[cur.length-1].d,
           prevLabel: '前 ' + d + ' 日' };
}

/* 窗口聚合 */
function _agg(rows){
  const a = { ord:0, gmv:0, vf:0, ugc:0, rep:0, nat:0, cac:0 };
  rows.forEach(function(x){
    a.ord += x.ord; a.gmv += x.gmv; a.vf += x.vf; a.ugc += x.ugc;
    a.rep += x.rep * x.ord; a.nat += x.nat * x.ord; a.cac += x.cac * x.ord;
  });
  const o = a.ord || 1;
  const aov = a.ord ? a.gmv / a.ord : 0;
  const ltv = aov * 0.72;                        /* LTV = 客单价 × 预期复购次数 */
  const cac = a.cac / o;
  return {
    ord: a.ord, gmv: a.gmv, aov: aov, vf: a.vf, ugc: a.ugc,
    verify: a.ord ? a.vf / a.ord * 100 : 0,
    rep: a.rep / o * 100, nat: a.nat / o * 100,
    cac: cac, ltv: ltv, ltvCac: cac > 0 ? ltv / cac : 0,
  };
}

/* 趋势柱子：自动换粒度（≤10 列，长周期按段聚合），不用 90 根细柱糊成一片。
   一律取「日均」而非「段合计」——尾段常不足一格天数，合计口径会让它假性暴跌；
   日均口径下每列含义一致，目标线也成为一条水平线，可与任意口径直接对照。 */
function _buckets(rows, maxCols){
  const n = rows.length, per = Math.max(1, Math.ceil(n / (maxCols || 10))), out = [];
  for(let i = 0; i < n; i += per){
    const seg = rows.slice(i, i + per);
    const sum = _sumBy(seg, function(x){ return x.gmv; });
    out.push({
      v: sum / seg.length / 1000,                       /* 日均（千元） */
      sum: sum,
      days: seg.length,
      l: per === 1 ? '日一二三四五六'[seg[0].wd] : (seg[0].m + '/' + seg[0].g),
      full: seg[0].d + (seg.length > 1 ? ' ~ ' + seg[seg.length-1].d : '') +
            '（' + seg.length + ' 天）· 日均 ¥' + Math.round(sum / seg.length).toLocaleString() +
            ' · 合计 ¥' + Math.round(sum).toLocaleString(),
      cur: i + per >= n,
    });
  }
  return { per: per, items: out };
}

/* 主派生：dashRange(k) —— 驾驶舱唯一的数字来源 */
function dashRange(k){
  k = k || DB.x.range.cur;
  if(!RANGE_OPTS.some(function(o){ return o.k === k; })) k = '7d';
  const W = _window(k), G = DB.x.goal;
  const cur = _agg(W.cur), prev = _agg(W.prev);
  const pick = RANGE_OPTS.filter(function(o){ return o.k === k; })[0];

  /* 环比：比率型用 pp（百分点），金额型用 % */
  const pc = function(a, b){ return b > 0 ? (a / b - 1) * 100 : 0; };
  const delta = {
    gmv: pc(cur.gmv, prev.gmv),
    ord: pc(cur.ord, prev.ord),
    aov: pc(cur.aov, prev.aov),
    verify: cur.verify - prev.verify,
    rep: cur.rep - prev.rep,
    nat: cur.nat - prev.nat,
    ltvCac: pc(cur.ltvCac, prev.ltvCac),
  };

  /* 趋势：目标值一并纳入刻度上限，保证目标虚线不会贴边被裁 */
  const trend = _buckets(W.cur, 10);
  const tv = G.gmvPerDay / 1000;                                    /* 日均目标（千元），各列相同 */
  const peak = Math.max.apply(null, trend.items.map(function(x){ return x.v; }).concat([1]));
  const maxV = Math.max(peak, tv) * 1.04;

  /* 漏斗：以「下单」为锚反推上游，整体转化率自动算出 */
  const fOrd = cur.ord, fVf = cur.vf;
  const funnel = {
    e: Math.round(fOrd * 9.20), v: Math.round(fOrd * 3.74), o: fOrd, f: fVf,
    rate: fOrd > 0 ? fVf / (fOrd * 9.20) * 100 : 0,
    c2: fOrd > 0 ? fVf / fOrd * 100 : 0,
  };

  /* 分城：本期 = 大盘 × 权重；核心城上期由「相对大盘偏离」反算，
     长尾「其他城市」吸收上期差口 —— 于是「分城上期合计 = 大盘上期」恒成立，
     且各核心城环比不必被归一化扭曲（跨口径时能真实体现短期波动 vs 长期趋势） */
  const rows = DB.x.cities.map(function(c){
    const g = cur.gmv * c.w;
    return { c: c, g: g, p: c.core ? g / (1 + (delta.gmv + c.dev) / 100) : null };
  });
  const pCore = _sumBy(rows, function(r){ return r.p || 0; });
  const iOther = rows.map(function(r){ return r.c.core; }).indexOf(false);
  if(iOther >= 0){
    const rest = prev.gmv - pCore;
    /* 差口异常（长尾上期为负）时按本期占比兜底，防止出现负 GMV */
    rows[iOther].p = rest > 1000 ? rest : prev.gmv * rows[iOther].c.w / 100;
  }
  const cities = rows.map(function(r){
    const c = r.c;
    return {
      n: c.n, c: c.c, core: c.core,
      gmv: r.g, prev: r.p,
      share: c.w * 100,
      ord: Math.round(cur.ord * c.w),
      up: pc(r.g, r.p),
      verify: cur.verify * c.vf,
    };
  });

  /* 业务线占比：按口径权重归一 */
  const bw = BIZ_W[k] || BIZ_W['7d'];
  const bsum = _sumBy(bw, function(x){ return x; });
  const biz = DB.x.bizLines.map(function(b, i){
    return { n:b.n, c:b.c, d:b.d, v: Math.round(bw[i] / bsum * 1000) / 10 };
  });

  /* KPI 六卡 */
  const goalGmv = G.gmvPerDay * W.days;
  const kpi = [
    { k:'gmv',    l:'成交额',      v: cur.gmv, fmt:'money', pct: cur.gmv / goalGmv * 100,
      d: delta.gmv, unit:'%', note:'目标 ' + (goalGmv >= 10000 ? '¥' + (goalGmv / 10000).toFixed(1) + ' 万' : '¥' + Math.round(goalGmv).toLocaleString('zh-CN')) },
    { k:'ord',    l:'成交订单',    v: cur.ord, fmt:'int',   pct: cur.ord / (goalGmv / G.aov) * 100,
      d: delta.ord, unit:'%', note:'目标 ' + Math.round(goalGmv / G.aov) + ' 单' },
    { k:'aov',    l:'客单价',      v: cur.aov, fmt:'yuan',  pct: cur.aov / G.aov * 100,
      d: delta.aov, unit:'%', note:'基准 ¥' + G.aov },
    { k:'verify', l:'权益核销率',  v: cur.verify, fmt:'pct1', pct: cur.verify / G.verify * 100,
      d: delta.verify, unit:'pp', note:'目标 ' + G.verify + '%' },
    { k:'rep',    l:'90 天复购率', v: cur.rep, fmt:'pct1',  pct: cur.rep / G.rep * 100,
      d: delta.rep, unit:'pp', note:'目标 ' + G.rep + '%' },
    { k:'ltvcac', l:'LTV / CAC',   v: cur.ltvCac, fmt:'x1', pct: cur.ltvCac / 3 * 100 >= 100 ? 100 : cur.ltvCac / 3 * 100,
      d: delta.ltvCac, unit:'%', note:'¥' + Math.round(cur.ltv) + ' / ¥' + Math.round(cur.cac) },
  ];

  const r = {
    k:k, l:pick.l, days:W.days, label:W.label, prevLabel:W.prevLabel,
    cur:cur, prev:prev, d:delta, trend:trend, maxV:maxV, tv:tv,
    funnel:funnel, cities:cities, biz:biz, kpi:kpi,
    goal:{ gmv:goalGmv, verify:G.verify, rep:G.rep, nat:G.nat, aov:G.aov },
  };
  r.insight = dashInsight(r);
  return r;
}

/* 驾驶舱诊断：把数字翻译成结论（好/坏/要看什么/去哪里处置） */
function dashInsight(r){
  const out = [], c = r.cur, d = r.d, G = r.goal;

  /* 1 · 规模达成 */
  const ach = c.gmv / G.gmv * 100;
  out.push(ach >= 100
    ? { lv:'ok',  t:'规模达标', d:'成交额达成目标 <b>' + ach.toFixed(1) + '%</b>，日均 ¥' + Math.round(c.gmv / r.days).toLocaleString() + '，' + r.prevLabel + '环比 <b>' + (d.gmv>=0?'+':'') + d.gmv.toFixed(1) + '%</b>。', act:'' }
    : { lv:'bad', t:'规模欠口', d:'成交额达成目标 <b>' + ach.toFixed(1) + '%</b>，缺口 ¥' + Math.round(G.gmv - c.gmv).toLocaleString() + '，环比 <b>' + (d.gmv >= 0 ? '+' : '') + d.gmv.toFixed(1) + '%</b>' + (d.gmv > 0 ? '（仍在增长，只是尚未追平目标线）' : '（且在下滑，需先止血）') + '，按当前日均需再提 <b>' + Math.round((G.gmv / c.gmv - 1) * 100) + '%</b>。', act:'setTab(\'calc\')' });

  /* 2 · 核销率：先扣掉「在途未核销」的可解释折损，剩下才是真问题
     在途折损 ≈ (1 − 折损系数) × 在途天数 ÷ 区间天数 —— 区间越短，虚低越明显 */
  const vGap = c.verify - G.verify;
  const drag = (1 - LAG.factor) * Math.min(LAG.days, r.days) / r.days * 100;
  if(vGap >= 0){
    out.push({ lv:'ok', t:'核销健康', d:'核销率 <b>' + c.verify.toFixed(1) + '%</b>，高于目标 ' + vGap.toFixed(1) + 'pp，权益成本按核销回填，无超发风险。', act:'pushRightsPage()' });
  } else if(Math.abs(vGap) <= drag + 0.3){
    out.push({ lv:'warn', t:'核销率在途折损',
      d:'核销率 <b>' + c.verify.toFixed(1) + '%</b>，低于目标 ' + Math.abs(vGap).toFixed(1) + 'pp；最近 ' + LAG.days + ' 天订单仍在核销期，本口径可解释折损 <b>' + drag.toFixed(1) + 'pp</b> —— 属<b>在途未核销</b>，非实质下滑。' + (r.k === '7d' ? '切「近 30 日」可看真实水平。' : ''),
      act: r.k === '7d' ? 'setDashRange(\'30d\')' : 'pushRightsPage()' });
  } else {
    out.push({ lv:'bad', t:'核销率实质下滑', d:'核销率 <b>' + c.verify.toFixed(1) + '%</b>，低于目标 ' + Math.abs(vGap).toFixed(1) + 'pp，已超在途折损可解释上限（' + drag.toFixed(1) + 'pp），需核查商户履约。', act:'pushRightsPage()' });
  }

  /* 3 · 结构拖累：找环比最弱的城市 */
  const core = r.cities.filter(function(x){ return x.core; });
  const worst = core.slice().sort(function(a, b){ return a.up - b.up; })[0];
  if(worst && worst.up < d.gmv){
    out.push({ lv:'warn', t:'结构拖累',
      d:'<b>' + worst.n + '</b> 环比 ' + (worst.up>=0?'+':'') + worst.up.toFixed(1) + '%，低于大盘 ' + (d.gmv>=0?'+':'') + d.gmv.toFixed(1) + '% ' + (worst.up < d.gmv ? '<b>' + (d.gmv - worst.up).toFixed(1) + 'pp</b>' : '') + '，占大盘 ' + worst.share.toFixed(1) + '%。下沉到该城看核销与货盘。',
      act:'scrollCity()' });
  } else {
    out.push({ lv:'ok', t:'结构均衡', d:'各城环比均为正，最低 ' + (worst?worst.n:'—') + ' ' + (worst?(worst.up>=0?'+':'')+worst.up.toFixed(1):'—') + '%，无单城依赖。', act:'' });
  }

  /* 4 · 获客效率 */
  const natGap = c.nat - G.nat;
  out.push(natGap >= 0
    ? { lv:'ok', t:'获客健康', d:'自然获客占比 <b>' + c.nat.toFixed(1) + '%</b>（目标 ' + G.nat + '%），LTV/CAC <b>' + c.ltvCac.toFixed(1) + ' 倍</b>，不靠买量也能长。', act:'' }
    : { lv:'bad', t:'获客偏贵', d:'自然获客占比 <b>' + c.nat.toFixed(1) + '%</b>，低于目标 ' + Math.abs(natGap).toFixed(1) + 'pp，CAC ¥' + Math.round(c.cac) + '，LTV/CAC ' + c.ltvCac.toFixed(1) + ' 倍，获客结构在向买量倾斜。', act:'setTab(\'calc\')' });

  return out.slice(0, 4);
}

/* ============================================================
   权益结算实绩 → 一单 ¥298 分账回流（v1.7）
   —— 把「核销对账」的真实成本回写进分账视图，两边账实一致
   ============================================================ */

/** 协议变更单当前适用的协议单价：有「已生效」变更单以新价为准，否则沿用协议原价
    —— 变更一旦审批通过，结算成本立即按新价重算，无需人工改价 */
function agrPrice(m){
  const c = DB.rights.contracts.filter(function(x){ return x.m === m.n && x.st === '已生效'; })[0];
  return c ? c.to : m.price;
}
/** 待审批变更单若通过可省下的成本（仅为预估，不计入实绩） */
function agrPendingSave(m){
  const c = DB.rights.contracts.filter(function(x){ return x.m === m.n && x.st === '待审批'; })[0];
  return c ? m.cnt * (c.to - c.from) : 0;
}
/** 单条商户结算条线的实付金额 = 协议应收（m.amt，含申诉上浮）− 已处置差异核减
    m.amt 是账实权威：协议变更生效时按新单价重算、申诉受理时按主张上浮，
    net 只负责扣核减，避免同一笔钱在两处各算一遍 */
function rightsLineNet(m){
  const R = DB.rights;
  const cut = R.diffs.filter(function(d){ return d.m === m.n && d.st === '已处置'; })
    .reduce(function(a,d){ return a + d.amt; }, 0);
  return m.amt - cut;
}
/** 结算实绩汇总：已确认 / 待确认 / 差异 / 实付合计 */
function rightsRealized(){
  const R = DB.rights;
  const ok = R.merchants.filter(function(m){ return m.st === '已确认'; });
  const wait = R.merchants.filter(function(m){ return m.st === '待确认'; });
  const diff = R.merchants.filter(function(m){ return m.st === '差异' || m.st === '申诉中'; });
  const net = R.merchants.reduce(function(a,m){ return a + rightsLineNet(m); }, 0);
  const okNet = ok.reduce(function(a,m){ return a + rightsLineNet(m); }, 0);
  const cut = R.diffs.filter(function(d){ return d.st === '已处置'; })
    .reduce(function(a,d){ return a + d.amt; }, 0);
  return {
    ok: ok, wait: wait, diff: diff,
    net: net, okNet: okNet, cut: cut,
    cnt: R.merchants.reduce(function(a,m){ return a + m.cnt; }, 0),
    orders: R.budget.orders,
    perPlan: R.budget.per,
    perReal: net / R.budget.orders,
    perOk: okNet / R.budget.orders,
  };
}
/** 分账五口径实绩行：标准口径 → 实绩口径（权益超支吃掉留存毛利，总额恒为 ¥298） */
function splitRowsReal(){
  const base = DB.x.waterfall.map(function(w){ return { n:w.n, c:w.c, g:w.g, to:w.to, d:w.d, v:w.v, p:w.p, plan:w.v }; });
  const z = rightsRealized();
  const pool = base.filter(function(w){ return w.g === 'pool'; })[0];
  const keep = base.filter(function(w){ return w.n === '留存毛利'; })[0];
  const FIX = 298;                              // 游客实付，五口径合计恒等
  if(pool){
    pool.v = Math.round(z.perReal * 100) / 100;   // 实绩权益单均（两位小数，小额申诉也可见）
    pool.p = Math.round(pool.v / FIX * 1000) / 10;
    pool.real = true;
  }
  if(keep){
    const other = base.filter(function(w){ return w.g === 'out' || w.n === '平台服务费'; })
      .reduce(function(a,w){ return a + w.v; }, 0);
    keep.v = Math.round((FIX - other - pool.v) * 100) / 100;   // 差额由留存毛利吸收
    keep.p = Math.round(keep.v / FIX * 1000) / 10;
    keep.gap = Math.round((pool.v - z.perPlan) * 100) / 100;
    keep.real = true;
  }
  /* 分组汇总（按收款对象） */
  const grp = { out:{ sum:0, plan:0 }, keep:{ sum:0, plan:0 }, pool:{ sum:0, plan:0 } };
  base.forEach(function(w){
    grp[w.g].sum = Math.round((grp[w.g].sum + w.v) * 100) / 100;
    grp[w.g].plan = Math.round((grp[w.g].plan + w.plan) * 100) / 100;
  });
  Object.keys(grp).forEach(function(k){
    grp[k].pct = Math.round(grp[k].sum / FIX * 1000) / 10;
    grp[k].planPct = Math.round(grp[k].plan / FIX * 1000) / 10;
  });
  return { rows: base, z: z, gap: keep ? keep.gap : 0, sum: Math.round(base.reduce(function(a,w){ return a + w.v; }, 0) * 10) / 10, grp: grp };
}
/** 回流说明：为什么实绩权益单均比预算高，差额从哪来 */
function splitRealNote(){
  const z = rightsRealized();
  const gap = Math.round((z.perReal - z.perPlan) * 100) / 100;
  const total = Math.round(gap * z.orders);
  return { z: z, gap: gap, total: total,
    text: gap > 0
      ? '本期实绩权益单均 ¥' + z.perReal.toFixed(2) + '，高于预算预留 ¥' + z.perPlan.toFixed(2) + '，缺口 ¥' + gap.toFixed(2) + '/单；全期合计 ¥' + total.toLocaleString() + ' 先由平台留存毛利吸收'
      : (gap < 0 ? '本期实绩权益单均 ¥' + z.perReal.toFixed(2) + '，低于预算预留 ¥' + z.perPlan.toFixed(2) + '，节余 ¥' + Math.abs(gap).toFixed(2) + '/单 回补留存毛利'
      : '本期实绩权益单均 ¥' + z.perReal.toFixed(2) + '，与预算预留一致，无差额') };
}

/* ============================================================
   权益预留池 · 超支审批动作流（v1.8）
   —— 把「池子不够」从一句建议变成有授权、有额度、有熔断的审批链
   ============================================================ */

/** 分级授权：按金额判定该谁批（限额 null = 终审，无上限） */
function overrunNeed(amt){
  const G = DB.rights.overrun.grades;
  for(let i = 0; i < G.length; i++){
    if(G[i].lim === null || amt <= G[i].lim) return { g:G[i], i:i };
  }
  return { g:G[G.length - 1], i:G.length - 1 };
}
/** 当前审批层级名称 */
function overrunLevel(amt){ return overrunNeed(amt).g.lv; }
/** 上一级审批人（部分批准后余量升级用） */
function overrunUp(amt){
  const G = DB.rights.overrun.grades, i = overrunNeed(amt).i;
  return G[i + 1] || null;
}
/** 超支全局状态：缺口 / 已批 / 待批 / 未覆盖 / 熔断 / 资金来源 */
function overrunState(){
  const R = DB.rights, O = R.overrun, z = rightsRealized();
  const gap = Math.max(0, Math.round((z.net - R.budget.pool) * 100) / 100);
  const rate = R.budget.pool ? Math.round(gap / R.budget.pool * 1000) / 1000 : 0;
  const okAmt = O.asks.filter(function(a){ return a.st === '已批准' || a.st === '部分批准'; })
    .reduce(function(a,x){ return a + (x.got || x.amt); }, 0);
  const open = O.asks.filter(function(a){ return a.st === '待审批'; });
  const openAmt = open.reduce(function(a,x){ return a + x.amt; }, 0);
  /* 已被审批覆盖的缺口走「营销预算调剂」，未覆盖部分直接从留存毛利扣 —— 总额不变 */
  const fromMkt = Math.min(okAmt, gap);
  const fromKeep = Math.max(0, gap - fromMkt);
  /* 熔断：超支率破线，且缺口尚未拿到「已批准的处置」（批了调剂或签了协议变更）
     —— 破线说明成本失控，无处置说明钱没着落，两者同时成立才冻结新增投放 */
  const fuse = rate > O.limit && okAmt < gap;
  return {
    gap: gap, rate: rate, okAmt: okAmt, openAmt: openAmt, open: open.length,
    fromMkt: fromMkt, fromKeep: fromKeep, uncovered: Math.max(0, gap - okAmt),
    fuse: fuse, limit: O.limit, net: z.net, pool: R.budget.pool,
    perReal: z.perReal, perPlan: z.perPlan,
  };
}
/** 下期建议预留单价：按实绩上浮并留 3% 缓冲 */
function overrunNextPer(){
  const z = rightsRealized();
  return Math.round(z.perReal * 1.03 * 100) / 100;
}

/* ============================================================
   下期预算预测 · 事前预警（v1.9）
   —— 不等结算完才发现超支：按周节奏外推，破线前干预
   ============================================================ */

/** 滚动周节奏：本期逐周成本、日均与环比（不完整周按天折算，避免短周被低估） */
function fcWeeks(){
  const W = DB.rights.overrun.fc.weeks;
  return W.map(function(w, i){
    const perDay = w.days > 0 ? w.amt / w.days : 0;
    const prev = i > 0 ? W[i-1] : null;
    const prevPer = prev && prev.days > 0 ? prev.amt / prev.days : 0;
    return {
      w: w.w, amt: w.amt, days: w.days,
      perDay: Math.round(perDay * 100) / 100,
      wow: prevPer > 0 ? perDay / prevPer - 1 : null,   // 日均环比，非金额环比
    };
  });
}
/** 下期预算预测：全期均速是后视镜，近周节奏才是前挡风
    周节奏是历史事实（不随协议变更回溯漂移），账实是当前账面 —— 两者分开，预测 = 账面 × 节奏倍数
    协议变更一旦生效（m.amt 被重算），net 自动下降 → 预测同步下降，无需二次适配 */
function fcState(){
  const R = DB.rights, F = R.overrun.fc, O = R.overrun, z = rightsRealized();
  const net = z.net;                                        // 本期实绩成本
  const daysAll = F.weeks.reduce(function(a,w){ return a + w.days; }, 0);
  const amtAll  = F.weeks.reduce(function(a,w){ return a + w.amt; }, 0);
  const perDayAll = daysAll > 0 ? amtAll / daysAll : 0;    // 全期日均（由周节奏汇总，历史事实恒定）
  const last = F.weeks[F.weeks.length - 1] || { amt:0, days:1 };
  const perDayLast = last.days > 0 ? last.amt / last.days : 0;   // 近周日均
  const trend = perDayAll > 0 ? perDayLast / perDayAll - 1 : 0;  // 趋势增速（恒定，不随账面变更漂移）
  const fcNext = Math.round(net * (1 + trend));             // 下期预测成本
  const pool = R.budget.pool;                               // 下期预留池（沿用本期口径）
  const fcGap = Math.max(0, Math.round((fcNext - pool) * 100) / 100);
  const fcRate = pool ? fcGap / pool : 0;
  const bottom = perDayLast > 0 ? pool / perDayLast : Infinity;  // 池子见底天数
  const fcPer = R.budget.orders ? fcNext / R.budget.orders : 0;  // 预测单均成本
  const fcPerBuf = Math.round(fcPer * 1.03 * 100) / 100;         // 建议预留单价（+3% 缓冲）
  /* 待审批协议变更的潜在影响（已生效的已体现在 net 里，不重复计）
     what-if 与真实模型同式：先降账面、再乘节奏倍数，保证「预览值 = 批准后的实际值」 */
  const agrSave = R.contracts.filter(function(c){ return c.st === '待审批' && c.to < c.from; })
    .reduce(function(a,c){ const m = R.merchants.filter(function(x){ return x.n === c.m; })[0];
      return a + (m ? m.cnt * (c.from - c.to) : 0); }, 0);
  const fcNextAgr = Math.max(0, Math.round((net - agrSave) * (1 + trend)));
  const fcRateAgr = pool ? Math.max(0, fcNextAgr - pool) / pool : 0;
  /* 收缩新增投放 10% 的影响（验证「单靠压投放救不回来」） */
  const fcNextCut = Math.round(fcNext * 0.9);
  const fcRateCut = pool ? Math.max(0, fcNextCut - pool) / pool : 0;
  /* 预警分级：绿 ≤ 熔断线 < 黄 ≤ 50% < 红 */
  const lv = fcRate > F.amber ? 'red' : fcRate > O.limit ? 'amber' : 'green';
  return {
    net:net, days:F.days, perDayAll:perDayAll, perDayLast:perDayLast, trend:trend,
    fcNext:fcNext, pool:pool, fcGap:fcGap, rate:fcRate,
    bottom:bottom, fcPer:fcPer, fcPerBuf:fcPerBuf,
    agrSave:agrSave, fcNextAgr:fcNextAgr, fcRateAgr:fcRateAgr,
    fcNextCut:fcNextCut, fcRateCut:fcRateCut,
    lv:lv, limit:O.limit, amber:F.amber, weeks:fcWeeks(),
  };
}
