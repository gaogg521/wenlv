/* ===== 数字滚动 ===== */
function countUp(el, to, dur=800, prefix=''){
  const from = 0, start = performance.now();
  function step(t){
    const p = Math.min(1, (t-start)/dur), e = 1-Math.pow(1-p,3);
    el.textContent = prefix + Math.round(from + (to-from)*e).toLocaleString('zh-CN');
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function runCounters(root){
  root.querySelectorAll('[data-count]').forEach(el=>{
    if(el.dataset.done) return; el.dataset.done = '1';
    countUp(el, parseFloat(el.dataset.count), 900, el.dataset.prefix||'');
  });
}

/* ===== 礼花 ===== */
const confetti = (()=>{
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  let ps = [], raf = null;
  function resize(){ cv.width = cv.offsetWidth; cv.height = cv.offsetHeight; }
  window.addEventListener('resize', resize);
  function fire(){
    resize();
    const colors = ['#e87722','#f5a623','#4ade80','#60a5fa','#c084fc','#f472b6'];
    for(let i=0;i<90;i++){
      ps.push({ x:cv.width/2 + (Math.random()-.5)*120, y:cv.height*0.42,
        vx:(Math.random()-.5)*9, vy:-(Math.random()*11+5),
        s:Math.random()*5+3, c:colors[i%colors.length], r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, life:1 });
    }
    if(!raf) tick();
  }
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{ p.vy += 0.32; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= 0.012; });
    ps = ps.filter(p=>p.life>0 && p.y < cv.height+30);
    ps.forEach(p=>{ ctx.save(); ctx.globalAlpha = Math.max(0,p.life); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62); ctx.restore(); });
    if(ps.length){ raf = requestAnimationFrame(tick); } else { raf = null; ctx.clearRect(0,0,cv.width,cv.height); }
  }
  return { fire };
})();

/* ===== 下拉刷新 ===== */
function bindPullRefresh(scrollEl, onRefresh){
  if(scrollEl._ptrBound) return;
  scrollEl._ptrBound = true;
  let sy = 0, pulling = false, dist = 0;
  const ptr = scrollEl.querySelector('.ptr');
  scrollEl.addEventListener('touchstart', e=>{ if(scrollEl.scrollTop<=0){ sy = e.touches[0].clientY; pulling = true; dist=0; } }, {passive:true});
  scrollEl.addEventListener('touchmove', e=>{
    if(!pulling) return;
    dist = e.touches[0].clientY - sy;
    if(dist>0 && ptr){ ptr.style.height = Math.min(60, dist*0.5)+'px'; ptr.innerHTML = dist>70 ? '松开刷新' : '下拉刷新'; }
  }, {passive:true});
  scrollEl.addEventListener('touchend', ()=>{
    if(!pulling) return; pulling = false;
    if(dist>70 && ptr){
      ptr.classList.add('show'); ptr.innerHTML = '<span class="spin"></span>正在刷新';
      setTimeout(()=>{ ptr.style.height='0'; ptr.classList.remove('show'); onRefresh && onRefresh(); }, 800);
    } else if(ptr){ ptr.style.height='0'; }
  });
}
