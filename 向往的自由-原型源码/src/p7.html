   切换功能视图，不换身份、不换数据。原「合伙人端」的四个 tab
   改为推广中心内的三个分段 + 一个「我的推广」页。
===================================================== */
function promoCenterHtml(){
  const p = DB.partner;
  const seg = PROMO_TABS.map(t=>'<button class="chip '+(S.promoTab===t.k?'on':'')+'" onclick="promoTabSwitch(\''+t.k+'\')">'+t.l+'</button>').join('');
  const body = S.promoTab==='earn' ? promoEarnHtml() : (S.promoTab==='invite' ? promoInviteHtml() : promoTeamHtml());
  return `
  <div class="promo-idcard">
    <div class="avatar" style="background:linear-gradient(135deg,#2f6f9f,#5ba8c9)">合</div>
    <div class="pi"><b>${p.level} · 陈姐</b>
      <span class="plv">${ic('i-crown')} 分润比例 ${p.rate}% · 推广服务商</span>
      <div class="did">${ic('i-code')} 推广服务商ID：P20261018-007</div>
    </div>
    <div class="promo-idcard-go" onclick="pushPromoMePage()">我的推广 ${ic('i-arrow')}</div>
  </div>
  <div class="chips" style="padding-top:12px">${seg}</div>
  ${body}`;
}
function pushPromoCenter(){
  const pg = push('推广中心', promoCenterHtml());
  pg.__promo = true;
  pg.__rerender = function(){ pg.querySelector('.page-body').innerHTML = promoCenterHtml(); };
  return pg;
}
/* 从别处点「推荐客户 / 邀请收客」：已在推广中心内就地切换，否则先打开推广中心 */
function openPromoTab(k){
  S.promoTab = k;
  const top = S.stack[S.stack.length-1];
  if(top && top.el.__promo){ top.el.__rerender(); return; }
  pushPromoCenter();
}
function promoTabSwitch(k){ S.promoTab = k; rerenderTop(); }

/* ===== 二维码（演示图形） ===== */
function qrSvg(seed){
  let s = 0; for(const ch of seed) s += ch.charCodeAt(0);
  const rnd = ()=>{ s = (s*9301+49297)%233280; return s/233280; };
  let cells = '';
  for(let y=0;y<11;y++) for(let x=0;x<11;x++){
    const inEye = (x<3&&y<3)||(x>7&&y<3)||(x<3&&y>7);
    if(inEye) continue;
    if(rnd()>0.52) cells += '<rect x="'+(x*10)+'" y="'+(y*10)+'" width="10" height="10"/>';
  }
  const eye = (x,y)=>'<rect x="'+x+'" y="'+y+'" width="30" height="30" fill="none" stroke="#1a2233" stroke-width="6"/><rect x="'+(x+10)+'" y="'+(y+10)+'" width="10" height="10"/>';
  return '<svg viewBox="0 0 110 110" style="width:100%;height:100%"><g fill="#1a2233">'+cells+'</g>'+eye(0,0)+eye(80,0)+eye(0,80)+'</svg>';
}

function onVerifyInput(v){
  v = v.replace(/\D/g,'').slice(0,6);
  $('#verifyInput').value = v;
  for(let k=0;k<6;k++){ const b=$('#vb'+k); if(b){ b.textContent=v[k]||''; b.classList.toggle('filled',!!v[k]); b.classList.toggle('focus',k===v.length); } }
  if(v.length===6) setTimeout(()=>confirmVerify(currentVerifyIdx), 300);
}
let currentVerifyIdx = 0;
function simulateScan(i){
  currentVerifyIdx = i;
  const o = DB.merch.orders[i];
  const sheet = $('#sheet');
  sheet.insertAdjacentHTML('beforeend','<div id="scanning" style="position:absolute;inset:0;background:rgba(255,255,255,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px"><div class="spinner" style="margin:0"></div><div style="font-size:13px;font-weight:700">扫码识别中</div><div style="font-size:10.5px;color:var(--sub)">动态码防截图 · 每 60 秒刷新</div></div>');
  setTimeout(()=>{ $('#scanning') && $('#scanning').remove(); onVerifyInput(o.code); }, 900);
}
function confirmVerify(i){
  const v = ($('#verifyInput')||{}).value || '';
  if(v.length < 6){ toast('请输入 6 位核销码'); return; }
  const o = DB.merch.orders[i];
  if(v !== o.code){ toast('核销码不正确，请与游客确认'); return; }
  applyVerify(o);
  confetti.fire();
  closeSheet();
  toast('核销成功 · 已为游客发放 '+Math.round(parseInt(o.paid.replace(/\D/g,''))/10)+' 旅豆');
  setTimeout(()=>{ renderBase(); }, 350);
}
function applyVerify(o){
  o.status = '已核销';
  DB.merch.pending = Math.max(0, DB.merch.pending-1);
  if(o.bean && String(o.bean).startsWith('-')) DB.merch.beans += parseInt(String(o.bean).slice(1));
  const vo = DB.visitorOrders.find(x=>x.code===o.code);
  if(vo){ vo.status='已完成'; }
  DB.admin.stream.unshift({t:'刚刚', d:'核销成功 · '+o.n+' · 旅豆已发放', c:'#f5a623'});
  /* 同步回写底账当日核销数 —— 否则商户端核销了，驾驶舱核销率却一动不动 */
  const L = DB.x.ledger[DB.x.ledger.length - 1];
  if(L && L.vf < L.ord){ L.vf += 1; }
  DB.admin.verifyRate = L ? Math.round(L.vf / L.ord * 1000) / 10 : DB.admin.verifyRate;
}

/** 导出对账单 CSV（真实下载） */
function sbcExportBill(){
  const m = sbcMyLine();
  const rows = [['核销码','时间','游客','藏品','单次金额(元)'],
    ['核销次数合计','','','',m.cnt],
    ['协议单价(元/次)','','','',m.price],
    ['本期应结(元)','','','',rightsLineNet(m)],
    ['账单状态','','','',m.st]];
  sbcMyRedeems(m).forEach(function(r){ rows.push([r.code, r.t, r.g, r.nft, r.amt]); });
  const csv = '\ufeff' + rows.map(function(r){ return r.join(','); }).join('\n');
  const fname = '向往的自由-商户权益对账单-' + m.n + '.csv';
  try{
    const blob = new Blob([csv], { type:'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    toast('对账单已导出 · ' + rows.length + ' 行明细');
  }catch(e){ toast('导出失败：' + e.message); return; }
  /* 页面级回执：导出后在页面上留痕，方便核对与复核 */
  const tip = document.querySelector('#sbcExportTip');
  if(tip){
    tip.innerHTML = ic('i-check') + ' 已导出 <b>' + fname + '</b> · ' + rows.length + ' 行 · ' + stampNow() + ' 生成（含核销码与藏品编号，可直接回传给平台核验）';
    tip.style.display = 'block';
  }
}

    <textarea class="form-input" id="agrWhy" rows="3" placeholder="请写明客流、成本或经营变化，以及期望的对价"></textarea>
    <div class="note" style="padding:12px 2px 4px">提交后平台运营将在 1 个工作日内审批。<b>同意即从下一账期生效</b>，本期已发生核销仍按原协议价结算。</div>
    <button class="btn" onclick="agrSubmit()">提交变更申请</button>
    <button class="btn ghost" style="margin-top:9px" onclick="closeSheet()">取消</button>
  `);
}
function agrSubmit(){
  const m = sbcMyLine();
  const cur = agrPrice(m);
  const to = parseFloat(((($('#agrTo')||{}).value)||'').replace(/[^0-9.]/g,'')) || 0;
  const why = ((($('#agrWhy')||{}).value)||'').trim();
  if(!to || to <= 0){ toast('请填写申请单价'); return; }
  if(to === cur){ toast('申请单价与现行一致，无需变更'); return; }
  if(!why){ toast('请填写变更理由'); return; }
  if(agrMyContracts(m).some(function(c){ return c.st === '待审批'; })){
    toast('你已有一条变更申请在审批中，请等待平台答复'); return; }
  const id = 'AG-1019-' + String(DB.rights.contracts.length + 1).padStart(2,'0');
  DB.rights.contracts.unshift({ id:id, m:m.n, op:m.op, r:m.r, mid:(DB.merch && DB.merch.id) || m.mid || '',
    from:cur, to:to, st:'待审批', by:'商户端线上', at:stampNow(), unit:'元 / 次', why:why, save:m.cnt * (to - cur), lg:[] });
  closeSheet();
  toast('变更申请已提交 · ' + id + '\n' + m.r + ' ¥' + cur + ' → ¥' + to + '，待平台审批');
  repaintContractChange();
}
/* ===== 商户端：商品与排期的真实操作（状态真实变化） ===== */
/** 补货：真实增加库存并记录时间 */
function restockGoods(name){
  const g = (DB.merch.supply||[]).find(function(x){ return x.n===name; });
  if(!g){ toast('商品不存在'); return; }
  g.stock = (g.stock == null ? 30 : g.stock) + 50;
  g.restockAt = '刚刚';
  renderBase();
  toast('补货申请已提交 · '+name+' +50 件\n村级仓 24h 内发运');
}
/** 下架商品：真实从在售移出（游客端同步不可见） */
function delistGoods(name){
  const g = (DB.merch.supply||[]).find(function(x){ return x.n===name; });
  if(!g){ toast('商品不存在'); return; }
  g.listed = false;
  renderBase();
  toast('已下架 · '+name+'\n游客端商城同步不可见');
}
/** 申请铺货：真实进入已铺货列表 */
function applyGoods(name){
  const g = (DB.merch.supply||[]).find(function(x){ return x.n===name; });
  if(!g){ toast('商品不存在'); return; }
  g.listed = true; g.stock = g.stock == null ? 30 : g.stock;
  renderBase();
  toast('铺货申请已提交 · '+name+'\n平台 24h 内审核，通过后计入你的毛利');
}
/** 爆品池：完整可选商品列表（不是死链） */
function pushGoodsPoolPage(){
  const all = DB.merch.supply || [];
  const unlisted = all.filter(function(s){ return !s.listed; });
  const html = `
    <div class="sec-title" style="padding-top:16px">可铺货爆品池 <span class="more">${all.length} 款</span></div>
    ${unlisted.length ? '<div class="goods-grid">'+unlisted.map(function(s,i){
      return `<div class="goods-card">
        <div class="goods-cover imgwrap flat">${sceneSVG(s.sc||'autumn', i*83+41)}<span class="goods-st gray">未铺货</span></div>
        <div class="goods-body">
          <b class="goods-n">${s.n}</b>
          <div class="goods-meta">建议售价 ¥${s.price}</div>
          <div class="goods-earn" style="color:var(--sub)">毛利约 ¥${Math.round(s.price*0.28)}/件</div>
          <div class="goods-acts"><button class="btn sm" style="flex:1" onclick="applyGoods('${s.n}')">申请铺货</button></div>
        </div>
      </div>`; }).join('')+'</div>'
      : '<div class="empty">'+ic('i-check')+'爆品已全部铺货<br>新商品上架后会在这里推荐</div>'}
    <div class="insight gr" style="margin:12px 14px">${ic('i-spark')}<div><b>选品建议</b>平台按你的客群画像（亲子 / 瑜伽 / 剧本）推荐适配商品，铺货后可在商城与线路页同步曝光。</div></div>
    <div class="note">平台不压货、不囤货：铺货商品由源头厂家直供，村级仓储前置发货，售出后按周结算。</div>`;
  return push('爆品池', html, {});
}
/** 加场：真实增加席位 */
function addSession(idx){
  const s = (DB.merch.stock||[])[idx];
  if(!s){ toast('排期不存在'); return; }
  s.total = s.total + 10; s.addedAt = '刚刚';
  const pg = S.stack[S.stack.length-1];
  if(pg){ pg.el.querySelector('.page-body').innerHTML = stockDetailBody(idx); autoSB(); }
  toast('已开放加场 · 新增 10 个席位\n平台已同步协助导流');
}
/** 调价：真实改价并重算预计流水 */
function changePrice(idx){
  const s = (DB.merch.stock||[])[idx];
  if(!s){ toast('排期不存在'); return; }
  openSheet(`
    <div class="sheet-title">${ic('i-doc')} 调整价格</div>
    <div class="sheet-sub">${s.n} · ${s.date} · 剩余 ${s.left}/${s.total}</div>
    <div class="form-label">${ic('i-money')} 新单价（元 / 人）</div>
    <input class="form-input num" id="npPrice" value="${s.price}" inputmode="decimal" />
    <div class="note" style="padding:14px 2px 4px">当前 ¥${s.price}，剩余 ${s.left} 席位，预计流水 ${money(s.left*s.price)}。调价将同步至游客端；已支付订单不受影响，差价按退改政策处理。</div>
    <button class="btn" onclick="confirmPrice(${idx})">确认调价</button>
    <button class="btn ghost" style="margin-top:9px" onclick="closeSheet()">取消</button>
  `);
}
function confirmPrice(idx){
  const s = (DB.merch.stock||[])[idx];
  const v = parseFloat((($('#npPrice')||{}).value||''));
  if(!v || v <= 0){ toast('请输入正确的价格'); return; }
  const old = s.price; s.price = v;
  closeSheet();
  const pg = S.stack[S.stack.length-1];
  if(pg){ pg.el.querySelector('.page-body').innerHTML = stockDetailBody(idx); autoSB(); }
  toast('价格已调整 ¥'+old+' → ¥'+v+'\n游客端已同步');
}
/** 下架排期：真实关闭该排期（有已售席位时拦截） */
function closeSession(idx){
  const s = (DB.merch.stock||[])[idx];
  if(!s){ toast('排期不存在'); return; }
  if(s.left < s.total){ toast('尚有已售席位，请先处理退款再下架'); return; }
  s.closed = true;
  renderBase();
  toast('排期已下架 · 游客端同步不可见');
}
/** 导出对账单：真实生成可下载 CSV */
function exportStatement(){
  const rows = [['项目','单量','金额(元)','说明'],
    ['核销流水','38','11286','本周已完成核销'],
    ['待核销流水','6','1554','已支付待核销'],
    ['旅豆结算','-','162','抵扣部分由平台权益预算承担'],
    ['商城分账','3','168','爆品售出分账'],
    ['应结金额','44','11454','T+1 结算至商户账户']];
  const csv = '\ufeff' + rows.map(r=>r.join(',')).join('\n');
  try{
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '向往的自由-商户对账单-20261019.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    toast('对账单已导出 · 6 行明细\n已保存为 CSV 文件');
  }catch(e){ toast('导出失败：'+e.message); return; }
  const tip = document.querySelector('#stExportTip');
  if(tip){
    tip.innerHTML = ic('i-check') + ' 已导出 <b>向往的自由-商户对账单-20261019.csv</b> · 6 行 · ' + stampNow() + ' 生成';
    tip.style.display = 'block';
  }
}
