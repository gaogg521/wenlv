<style>
/* ===== 开屏视频广告 ===== */


/* ===== 垂类频道 ===== */
.channel-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:4px 0 8px; }
.channel-item{ display:flex; align-items:center; gap:11px; background:#f7f8fa; border-radius:13px; padding:12px; border:1.5px solid transparent; text-align:left; transition:all .15s; }
.channel-item.on{ background:var(--brand-soft); border-color:var(--brand); }
.channel-item .ci2{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.channel-item .ci2 svg{ width:19px; height:19px; }
.channel-item b{ font-size:13px; display:block; }
.channel-item span{ font-size:9px; color:var(--sub); display:block; margin-top:2px; }

/* ===== 商城 ===== */
.shop-hero{ background:linear-gradient(135deg,#e87722,#f5a623); margin:12px 14px; border-radius:18px; padding:18px; color:#fff; position:relative; overflow:hidden; }
.shop-hero::before{ content:''; position:absolute; right:-30px; bottom:-50px; width:150px; height:150px; border-radius:50%; background:rgba(255,255,255,.09); }
.shop-hero h3{ font-size:17px; font-weight:900; }
.shop-hero p{ font-size:10.5px; opacity:.88; margin-top:6px; line-height:1.6; }
.shop-hero .sh-tags{ display:flex; gap:6px; margin-top:11px; position:relative; z-index:2; }
.shop-hero .sh-tag{ font-size:9px; background:rgba(255,255,255,.2); padding:3.5px 9px; border-radius:8px; }
.prod{ margin:0 14px 12px; background:#fff; border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow); display:flex; transition:transform .12s; }
.prod:active{ transform:scale(.985); }
.prod .pp{ width:118px; height:118px; position:relative; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.prod .pp .pwm{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.prod .pp .pwm svg{ width:52px; height:52px; color:#fff; opacity:.85; }
.prod .pi2{ flex:1; padding:12px 12px 12px 0; min-width:0; display:flex; flex-direction:column; }
.prod .pi2 h3{ font-size:13px; font-weight:800; line-height:1.4; }
.prod .pi2 .pd{ font-size:10px; color:var(--sub); margin-top:4px; line-height:1.5; }
.prod .pi2 .ptags{ display:flex; gap:5px; margin-top:6px; }
.prod .pi2 .pf{ margin-top:auto; display:flex; align-items:baseline; gap:6px; }
.prod .pi2 .pf b{ color:var(--brand); font-size:16px; font-weight:900; }
.prod .pi2 .pf del{ font-size:9.5px; color:var(--faint); }
.prod .pi2 .pf .bean{ margin-left:auto; font-size:9px; color:var(--gold); background:#faf3e2; padding:2.5px 7px; border-radius:6px; font-weight:700; }
.prod .pi2 .sold{ font-size:9px; color:var(--faint); }
.buyer-show{ display:flex; gap:8px; padding:10px 0 2px; overflow-x:auto; scrollbar-width:none; }
.buyer-show::-webkit-scrollbar{ display:none; }
.buyer-show .bs{ flex-shrink:0; width:74px; }
.buyer-show .bs .bsi{ width:74px; height:74px; border-radius:10px; display:flex; align-items:center; justify-content:center; }
.buyer-show .bs .bsi svg{ width:30px; height:30px; color:#fff; opacity:.9; }
.buyer-show .bs span{ display:block; font-size:9px; color:var(--sub); margin-top:5px; text-align:center; }

/* ===== 剧本闯关 ===== */
.script-hero{ background:linear-gradient(160deg,#243b55,#4a3b6b); padding:20px 18px 26px; color:#fff; position:relative; overflow:hidden; }
.script-hero::before{ content:''; position:absolute; right:-40px; top:-40px; width:150px; height:150px; border-radius:50%; border:30px solid rgba(255,255,255,.05); }
.script-hero .sh-tag{ font-size:9.5px; background:rgba(255,255,255,.16); display:inline-flex; padding:3.5px 10px; border-radius:8px; letter-spacing:1px; }
.script-hero h2{ font-size:21px; font-weight:900; margin-top:11px; }
.script-hero p{ font-size:11px; opacity:.82; margin-top:7px; line-height:1.7; }
.role-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px 14px 4px; }
.role-pick{ background:#fff; border-radius:14px; padding:14px 12px; border:2px solid transparent; box-shadow:var(--shadow); text-align:left; transition:all .15s; }
.role-pick.on{ border-color:var(--brand); background:var(--brand-soft); }
.role-pick .rp{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; margin-bottom:9px; }
.role-pick .rp svg{ width:19px; height:19px; }
.role-pick b{ font-size:13px; display:block; }
.role-pick span{ font-size:9.5px; color:var(--sub); display:block; margin-top:3px; line-height:1.5; }
.task-card{ background:#fff; border-radius:14px; margin:0 14px 10px; padding:14px; box-shadow:var(--shadow); display:flex; gap:12px; align-items:center; }
.task-card .tn{ width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900; flex-shrink:0; }
.task-card .tt2{ flex:1; min-width:0; }
.task-card .tt2 b{ font-size:13px; display:block; }
.task-card .tt2 span{ font-size:10px; color:var(--sub); margin-top:3px; display:block; }
.scan-mock{ margin:0 14px 12px; background:#101623; border-radius:18px; height:250px; position:relative; overflow:hidden; }
.scan-mock .sm-frame{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:170px; height:170px; }
.scan-mock .sm-frame i{ position:absolute; width:26px; height:26px; border:3px solid #4ade80; }
.scan-mock .sm-frame i:nth-child(1){ left:0; top:0; border-right:none; border-bottom:none; border-radius:8px 0 0 0; }
.scan-mock .sm-frame i:nth-child(2){ right:0; top:0; border-left:none; border-bottom:none; border-radius:0 8px 0 0; }
.scan-mock .sm-frame i:nth-child(3){ left:0; bottom:0; border-right:none; border-top:none; border-radius:0 0 0 8px; }
.scan-mock .sm-frame i:nth-child(4){ right:0; bottom:0; border-left:none; border-top:none; border-radius:0 0 8px 0; }
.scan-mock .sm-line{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:150px; height:2px; background:linear-gradient(90deg,transparent,#4ade80,transparent); animation:scanline 2s ease-in-out infinite; }
@keyframes scanline{ 0%,100%{ margin-top:-70px; } 50%{ margin-top:70px; } }
.scan-mock .sm-tip{ position:absolute; left:0; right:0; bottom:16px; text-align:center; color:rgba(255,255,255,.75); font-size:10.5px; }
.scan-mock .sm-place{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:56px; height:56px; border-radius:14px; background:rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.5); }
.script-reward{ background:linear-gradient(135deg,#8e6bbf,#b088d9); margin:12px 14px; border-radius:16px; padding:16px; color:#fff; }
.script-reward h4{ font-size:14px; font-weight:800; display:flex; align-items:center; gap:7px; }
.script-reward p{ font-size:11px; opacity:.9; margin-top:7px; line-height:1.7; }

/* ===== 创作中心 ===== */
.create-hero{ background:linear-gradient(135deg,#e87722,#f5a623); margin:12px 14px; border-radius:18px; padding:20px; color:#fff; position:relative; overflow:hidden; }
.create-hero .ch-bal{ font-size:31px; font-weight:900; margin:6px 0 4px; }
.create-hero .ch-sub{ font-size:10.5px; opacity:.85; }
.create-hero .ch-row{ display:flex; gap:10px; margin-top:14px; }
.create-hero .ch-cell{ flex:1; background:rgba(255,255,255,.14); border-radius:11px; padding:9px 6px; text-align:center; }
.create-hero .ch-cell b{ font-size:14px; font-weight:800; display:block; }
.create-hero .ch-cell span{ font-size:9px; opacity:.82; display:block; margin-top:2px; }
.work-item{ display:flex; gap:12px; padding:13px 16px; align-items:center; }
.work-item + .work-item{ border-top:1px solid #f4f5f7; }
.work-item .wi{ width:52px; height:52px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.work-item .wi svg{ width:22px; height:22px; color:#fff; }
.work-item .wt{ flex:1; min-width:0; }
.work-item .wt b{ font-size:13px; display:block; }
.work-item .wt span{ font-size:10px; color:var(--sub); margin-top:3px; display:block; }
.work-item .wa2{ text-align:right; }
.work-item .wa2 b{ font-size:13.5px; font-weight:900; color:var(--green); display:block; }
.work-item .wa2 span{ font-size:9px; color:var(--sub); display:block; margin-top:2px; }
.mission-card{ background:#fff; border-radius:14px; margin:0 14px 12px; padding:15px; box-shadow:var(--shadow); border-left:3.5px solid var(--brand); }
.mission-card .mh{ display:flex; justify-content:space-between; align-items:center; }
.mission-card .mh b{ font-size:13.5px; }
.mission-card p{ font-size:11px; color:var(--ink2); line-height:1.7; margin-top:7px; }
.mission-card .mf{ display:flex; align-items:center; margin-top:11px; }
.mission-card .mf .rw{ font-size:11px; font-weight:800; color:var(--brand-deep); }
.mission-card .mf .btn{ margin-left:auto; }
.mission-card .mission-meta{ display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:9px; font-size:10px; color:var(--sub); }
.mission-card .mission-meta span{ display:inline-flex; align-items:center; gap:4px; }
.mission-card .mission-meta svg{ width:12px; height:12px; }
.mission-card .mission-tip{ display:flex; gap:6px; align-items:flex-start; margin-top:10px; padding:8px 10px; border-radius:9px; background:#fdf6ec; color:#8a5a12; font-size:10.5px; line-height:1.6; }
.mission-card .mission-tip svg{ width:13px; height:13px; flex-shrink:0; margin-top:1px; }
.mission-card .mission-tip.done{ background:#e7f6ee; color:#0b7a44; }
.mission-card.st-review{ border-left-color:#243b55; }
.mission-card.st-done{ border-left-color:#0f9d58; }
.mission-card.st-done .mh b{ color:var(--sub); }

/* ===== 运营端 ===== */
.admin-hero{ background:linear-gradient(160deg,#0d3b3a,#0f766e); padding:18px 18px 30px; color:#fff; position:relative; overflow:hidden; }
.admin-hero::before{ content:''; position:absolute; right:-40px; top:-40px; width:150px; height:150px; border-radius:50%; background:rgba(255,255,255,.06); }
.admin-hero .ah-row{ display:flex; align-items:center; gap:12px; position:relative; z-index:2; }
.admin-hero .ah-ic{ width:42px; height:42px; border-radius:12px; background:rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center; }
.admin-hero .ah-row b{ font-size:15.5px; font-weight:800; display:block; }
.admin-hero .ah-row span{ font-size:10px; opacity:.8; display:block; margin-top:2px; }
.admin-hero .ah-live{ margin-left:auto; font-size:9px; background:rgba(74,222,128,.18); color:#4ade80; padding:3.5px 9px; border-radius:8px; display:flex; align-items:center; gap:5px; font-weight:700; }
.admin-hero .ah-live i{ width:6px; height:6px; border-radius:50%; background:#4ade80; animation:blink 1.4s infinite; }
@keyframes blink{ 50%{ opacity:.3; } }
.admin-kpi{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:0 14px 12px; }
.admin-kpi .ak{ background:#fff; border-radius:13px; padding:12px 10px; box-shadow:var(--shadow); }
.admin-kpi .ak b{ font-size:16px; font-weight:900; display:block; }
.admin-kpi .ak span{ font-size:9px; color:var(--sub); display:block; margin-top:3px; }
.admin-kpi .ak .tr{ font-size:8.5px; margin-top:4px; font-weight:700; }
.tr.up{ color:var(--green); } .tr.down{ color:var(--red); }
.chart-card{ background:#fff; border-radius:var(--r); margin:0 14px 12px; padding:16px; box-shadow:var(--shadow); }
.chart-card h4{ font-size:13.5px; font-weight:800; display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
.chart-card h4 span{ font-size:9.5px; color:var(--sub); font-weight:400; }
.bars{ display:flex; align-items:flex-end; gap:7px; height:110px; padding-top:14px; }
.bars .bcol{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; height:100%; justify-content:flex-end; }
.bars .bcol .bfill{ width:100%; border-radius:5px 5px 2px 2px; background:linear-gradient(180deg,#14b8a6,#0f766e); transition:height .8s cubic-bezier(.25,.9,.3,1); min-height:3px; }
.bars .bcol.today .bfill{ background:linear-gradient(180deg,#f5a623,#e87722); }
.bars .bcol span{ font-size:8.5px; color:var(--sub); }
.bars .bcol b{ font-size:8.5px; color:var(--ink2); }
.stream-row{ display:flex; align-items:center; gap:10px; padding:10px 16px; font-size:11.5px; }
.stream-row + .stream-row{ border-top:1px solid #f4f5f7; }
.stream-row .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.stream-row .st2{ flex:1; color:var(--ink2); }
.stream-row .sv2{ color:var(--sub); font-size:10px; }
.warn-card{ background:#fff; border-radius:14px; margin:0 14px 12px; padding:14px; box-shadow:var(--shadow); border-left:3.5px solid #e65100; }
.warn-card .wh{ display:flex; align-items:center; gap:8px; }
.warn-card .wh b{ font-size:13px; }
.warn-card .wh .lv{ margin-left:auto; font-size:9px; font-weight:800; padding:2.5px 8px; border-radius:6px; }
.warn-card p{ font-size:10.5px; color:var(--ink2); line-height:1.7; margin-top:7px; }
.warn-card .wf{ display:flex; gap:8px; margin-top:11px; }
.budget-ring{ display:flex; align-items:center; gap:16px; padding:6px 0 2px; }
.budget-ring .br{ width:88px; height:88px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; position:relative; }
.budget-ring .br::before{ content:''; position:absolute; inset:9px; background:#fff; border-radius:50%; }
.budget-ring .br b{ position:relative; font-size:17px; font-weight:900; }
.budget-ring .br-info{ flex:1; }
.budget-ring .br-info .bri{ display:flex; justify-content:space-between; font-size:11px; padding:5px 0; }
.budget-ring .br-info .bri span{ color:var(--sub); }
.budget-ring .br-info .bri b{ font-weight:800; }
.audit-card{ background:#fff; border-radius:14px; margin:0 14px 12px; padding:14px; box-shadow:var(--shadow); }
.audit-card .ah{ display:flex; align-items:center; gap:9px; }
.audit-card .ah .ai{ width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.audit-card .ah b{ font-size:13px; display:block; }
.audit-card .ah span{ font-size:9.5px; color:var(--sub); display:block; margin-top:2px; }
.audit-card .ah .st3{ margin-left:auto; font-size:9px; font-weight:800; padding:2.5px 8px; border-radius:6px; }
.audit-card p{ font-size:10.5px; color:var(--ink2); line-height:1.7; margin-top:8px; }
.audit-card .af{ display:flex; gap:8px; margin-top:11px; }
.audit-card .af .btn{ height:32px; font-size:12px; }
.calc-card{ background:#fff; border-radius:var(--r); margin:0 14px 12px; padding:16px; box-shadow:var(--shadow); }
.calc-row2{ display:flex; align-items:center; gap:10px; padding:9px 0; }
.calc-row2 + .calc-row2{ border-top:1px solid #f4f5f7; }
.calc-row2 label{ font-size:12px; color:var(--ink2); width:96px; flex-shrink:0; }
.calc-row2 input[type=range]{ flex:1; accent-color:var(--brand); height:22px; }
.calc-row2 .cv{ width:64px; text-align:right; font-size:12.5px; font-weight:800; flex-shrink:0; }
.calc-result{ background:linear-gradient(160deg,#0d3b3a,#0f766e); border-radius:16px; margin:0 14px 12px; padding:18px; color:#fff; }
.calc-result .cr{ display:flex; justify-content:space-between; padding:6px 0; font-size:12px; }
.calc-result .cr span{ opacity:.82; }
.calc-result .cr b{ font-weight:800; }
.calc-result .cr.big{ border-top:1px solid rgba(255,255,255,.18); margin-top:8px; padding-top:11px; }
.calc-result .cr.big b{ font-size:19px; }
.calc-result .cr.big.neg b{ color:#fca5a5; }
.calc-note{ font-size:9.5px; color:var(--faint); padding:0 18px 14px; line-height:1.7; }

/* 联动日志 */
.link-log{ background:#101623; border-radius:14px; margin:0 14px 12px; padding:14px 16px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
.link-log .ll-row{ display:flex; gap:9px; font-size:10px; line-height:1.9; color:#9aa5b8; animation:llIn .4s; }
@keyframes llIn{ from{ opacity:0; transform:translateX(-8px); } to{ opacity:1; transform:none; } }
.link-log .ll-row .ok{ color:#4ade80; }
.link-log .ll-row .tag2{ color:#f5a623; }
</style>
</head>
