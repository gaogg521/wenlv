# api.1work.vip —— 文旅小程序后端接入
# 部署路径：/etc/nginx/conf.d/api.1work.vip.conf
# 说明：独立 server 块，按 server_name 分流，不影响 onework 站点（1work.vip / *.r.1work.vip）

server {
    listen 80;
    server_name api.1work.vip;

    # 必须保留：certbot 续期时从这里取验证文件（优先于下面的 301）
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.1work.vip;

    # Let's Encrypt 证书（certbot 自动续期）
    ssl_certificate     /etc/letsencrypt/live/api.1work.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.1work.vip/privkey.pem;

    # 微信小程序要求 TLS 1.2 及以上
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 小程序上传图片/证件照，别用默认的 1m
    client_max_body_size 20m;

    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;

        # 这四个头必须带，否则后端拿不到真实客户端信息、重定向会出错
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 蚂蚁链存证、报表导出这类接口耗时较长，留足超时
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
