# frp 客户端配置 —— 部署在跑 Node API 的那台 Windows（172.29.128.120）
# 放置路径：C:\frp\frpc.toml
# 作用：把本机 127.0.0.1:8080 反向映射到腾讯云的 18080

serverAddr = "62.234.93.202"
serverPort = 7000

# 必须与 frps.toml 里的 auth.token 一字不差
auth.method = "token"
auth.token = "REPLACE_WITH_LONG_RANDOM_TOKEN"

[[proxies]]
name = "wanderlust-api"
type = "tcp"
localIP = "127.0.0.1"
localPort = 8080
remotePort = 18080

log.to = "frpc.log"
log.level = "info"
log.maxDays = 7
