<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>向往的自由 · 运营后台</title>
<link rel="stylesheet" href="/admin-ui/app.css">
</head>
<body>

<!-- ===== 登录：左品牌深蓝背景（镶嵌图案+渐变流动+粒子飘动+光晕）+ 右表单 ===== -->
<div id="login" class="login-stage">
  <div class="login-brand">
    <!-- 背景层：渐变流动 + 镶嵌菱形 -->
    <div class="lb-bg"></div>
    <!-- 光晕层 -->
    <div class="lb-glow g1"></div>
    <div class="lb-glow g2"></div>
    <div class="lb-glow g3"></div>
    <!-- 几何装饰线 -->
    <svg class="lb-lines" viewBox="0 0 100 100" preserveAspectRatio="none">
      <path d="M0 20 L100 15" stroke="rgba(255,255,255,.06)" stroke-width=".3" fill="none"/>
      <path d="M0 50 L100 45" stroke="rgba(255,255,255,.04)" stroke-width=".2" fill="none"/>
      <path d="M0 80 L100 75" stroke="rgba(255,255,255,.05)" stroke-width=".3" fill="none"/>
      <circle cx="80" cy="15" r="8" stroke="rgba(125,211,252,.1)" stroke-width=".2" fill="none"/>
      <circle cx="15" cy="85" r="12" stroke="rgba(125,211,252,.08)" stroke-width=".2" fill="none"/>
    </svg>
    <!-- 粒子层（JS 动态生成） -->
    <div class="lb-particles" id="lbParticles"></div>

    <!-- 内容层 -->
    <div class="lb-content">
      <div class="lb-logo"><span class="dot"></span>向往的自由</div>
      <div class="lb-sub">文旅生态操作系统 · Tourism Web3 OS</div>
      <ul class="lb-feats">
        <li>四种角色 × 三个客户端 · 同一份数据</li>
        <li>真实交易闭环 · 下单 → 核销 → 返豆 → 结算</li>
        <li>五口径恒等 · 双分录账本 · 全链路存证</li>
        <li>参数中心双人复核 · 风控事件全留痕</li>
        <li>推广服务商一级 CPS · 共创投资分润</li>
        <li>Web3 存证 · 链上权益凭证 · 术语双层口径</li>
      </ul>
    </div>

    <div class="lb-foot">上海璟宬文化发展有限公司</div>
  </div>

  <div class="login-right">
    <div class="glass-wrap">
      <form class="glass-card" id="step1" onsubmit="return false">
        <h2>欢迎回来</h2>
        <p class="muted" id="stepTip">运营管理舱 · 分角色授权登录</p>
        <label>账号</label>
        <input id="luser" placeholder="admin" autocomplete="username">
        <label>密码</label>
        <input id="lpass" type="password" placeholder="••••••••" autocomplete="current-password">
        <div id="lerr" class="lerr"></div>
        <div class="quick-accounts">
          <span class="muted" style="font-size:12px">演示一键填充</span>
          <button type="button" class="qa" onclick="fill('admin','admin123')">admin 超管</button>
          <button type="button" class="qa" onclick="fill('finance','admin123')">finance 财务</button>
          <button type="button" class="qa" onclick="fill('city310118','city123')">city 城市合伙人</button>
        </div>
        <button class="btn primary block" onclick="login()">登 录</button>
      </form>

      <form class="glass-card" id="step2" style="display:none" onsubmit="return false">
        <h2>两步验证</h2>
        <p class="muted" id="mfaTip">请输入验证器 App 中的 6 位动态码</p>
        <input id="mfacode" class="code-input" inputmode="numeric" maxlength="6" placeholder="— — — — — —" autocomplete="one-time-code">
        <div id="lerr2" class="lerr"></div>
        <button class="btn primary block" onclick="mfaSubmit()">验 证</button>
        <button type="button" class="btn ghost block" style="margin-top:10px" onclick="mfaResend()">重新发送验证码</button>
        <button type="button" class="linklike" onclick="backToStep1()">← 返回重新登录</button>
      </form>
    </div>
  </div>
</div>

<!-- ===== 主框架 ===== -->
<div id="frame" style="display:none">
  <aside class="side">
    <div class="side-logo"><span class="dot"></span>向往的自由<b>运营舱</b></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div id="paymode" class="pill-mini">支付通道检测中…</div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div id="crumb">驾驶舱</div>
      <div class="top-right">
        <span class="who" id="who"></span>
        <button class="btn ghost sm" onclick="logout()">退出登录</button>
      </div>
    </header>
    <main id="app" class="content"></main>
  </div>
</div>

<div id="toastWrap"></div>
<div id="modalRoot"></div>

<script src="/admin-ui/app.js"></script>
<script>
// 登录页粒子生成
(function () {
  const container = document.getElementById('lbParticles')
  if (!container) return
  const SIZES = [3, 4, 5, 6, 8]
  const COLORS = ['rgba(253,230,138,.5)', 'rgba(251,191,36,.4)', 'rgba(252,211,77,.3)', 'rgba(255,255,255,.35)']
  for (let i = 0; i < 24; i++) {
    const p = document.createElement('div')
    p.className = 'lb-p'
    const size = SIZES[Math.floor(Math.random() * SIZES.length)]
    p.style.width = size + 'px'
    p.style.height = size + 'px'
    p.style.left = (Math.random() * 100) + '%'
    p.style.background = COLORS[Math.floor(Math.random() * COLORS.length)]
    p.style.animationDuration = (12 + Math.random() * 18) + 's'
    p.style.animationDelay = (-Math.random() * 20) + 's'
    p.style.animationTimingFunction = 'ease-in-out'
    container.appendChild(p)
  }
})()
</script>
</body>
</html>
