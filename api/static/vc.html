<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>向往的自由 · 数字身份验签台</title>
<style>
  :root{--brand:#0f766e;--brand-soft:#e6f4f1;--ink:#10151c;--sub:#5b6572;--faint:#98a1b0;
    --line:#e3e7ee;--ok:#0f9d58;--warn:#b45309;--bg:#f4f6f8;--card:#fff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.6;min-height:100vh}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px 48px}
  header{background:linear-gradient(135deg,#123a3a,#0f766e);color:#fff;padding:26px 0 30px;margin-bottom:-18px}
  header .wrap{padding-bottom:0}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.5px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:#7ee0cf;box-shadow:0 0 0 4px rgba(126,224,207,.22)}
  .sub{font-size:12px;opacity:.72;letter-spacing:2px;margin-top:2px}
  h1{font-size:22px;margin:16px 0 4px;font-weight:700}
  .lead{font-size:13px;opacity:.82;margin:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px;box-shadow:0 1px 2px rgba(16,21,28,.04)}
  .card h2{font-size:14px;margin:0 0 12px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:8px}
  .card h2::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--brand)}
  textarea{width:100%;min-height:110px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:12.5px;
    font-family:ui-monospace,Menlo,Consolas,monospace;outline:none;resize:vertical;word-break:break-all}
  textarea:focus{border-color:var(--brand)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:600;
    text-decoration:none;border:1px solid transparent;cursor:pointer}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .row{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .row:last-child{border-bottom:0}
  .row .k{width:110px;color:var(--sub);flex:none}
  .row .v{flex:1;word-break:break-all}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600}
  .badge.ok{background:#e7f6ee;color:var(--ok)}
  .badge.warn{background:#fdf3e0;color:var(--warn)}
  .badge.idle{background:#eef1f5;color:var(--sub)}
  .big{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;background:var(--brand-soft);border:1px solid #cfe8e2}
  .big.bad{background:#fdecea;border-color:#f6cfc9}
  .big .icon{width:38px;height:38px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;
    justify-content:center;font-size:19px;flex:none}
  .big.bad .icon{background:#b42318}
  .big b{display:block;font-size:15px}
  .big span{font-size:12.5px;color:var(--sub)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{background:#f2f5f8;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px}
  .chip b{color:var(--brand)}
  .note{font-size:12px;color:var(--faint);margin-top:12px;line-height:1.8}
  .hide{display:none}
  code{background:#f2f4f7;padding:1px 5px;border-radius:4px;font-size:12.5px}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><span class="dot"></span>向往的自由 <span style="opacity:.6;font-weight:400;font-size:13px">WANDERLUST</span></div>
  <div class="sub">旅行数字身份 · 验签台</div>
  <h1>验一张身份凭证，只看它该让你看的</h1>
  <p class="lead">粘贴用户出示的凭证即可验签：签名是否由本平台签发、是否过期/吊销、以及<strong>它只披露了哪些事实</strong>。</p>
</div></header>

<div class="wrap">
  <div class="card">
    <h2>验签</h2>
    <textarea id="jwt" placeholder="粘贴凭证（VC-JWT，三段式，形如 eyJhbGciOiJFZERTQSIs…）"></textarea>
    <div class="bar">
      <button class="btn primary" onclick="doVerify()">验签</button>
      <a class="btn ghost" href="/open/vc/issuer" target="_blank" rel="noopener">查看公钥（JWKS）</a>
    </div>
    <div class="note">验签在服务端用 <code>Ed25519</code> 公钥完成；也可用下方公钥<strong>完全离线</strong>自行验签，不需要信任本页面。</div>
  </div>

  <div id="out"></div>

  <div class="card">
    <h2>签发者公钥（可离线验签）</h2>
    <div id="issuerBox" class="note">读取中…</div>
  </div>

  <div class="note">
    最小披露原则：凭证只包含会员等级、成长区间、入会年月、行程数、城市数、徽章名。<br>
    姓名、手机号、身份证号、订单号与任何金额<strong>从不下发</strong>——即便凭证全文泄露，也无法反推到具体某笔消费。
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const cut = (h, n = 20) => (h && h.length > n * 2 ? h.slice(0, n) + '…' + h.slice(-8) : String(h ?? '—'))

async function doVerify() {
  const jwt = ($('#jwt').value || '').trim()
  if (!jwt) return
  $('#out').innerHTML = '<div class="card"><div class="note">验签中…</div></div>'
  try {
    const r = await fetch('/open/vc/verify', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ jwt }),
    }).then((x) => x.json())
    const d = r.data
    if (!d) throw new Error(r.msg || '验签失败')
    render(d)
  } catch (e) {
    $('#out').innerHTML = `<div class="card"><div class="big bad"><div class="icon">!</div><div><b>无法验签</b><span>${esc(e.message)}</span></div></div></div>`
  }
}

function render(d) {
  const c = d.claims || {}
  const chips = Object.entries(c).filter(([k]) => k !== 'scope').map(([k, v]) => {
    const label = { role: '身份', level: '等级', levelNo: '等级序号', growthBand: '成长区间', memberSince: '入会年月', trips: '行程数', cities: '城市数', badges: '徽章', merchantName: '门店', position: '在店职务', works: '已发布内容', tasks: '已完成约稿' }[k] || k
    const shown = k === 'role' ? ({ creator: '创作者', promoter: '推广服务商', merchant: '商户' }[v] || v) : v
    return `<span class="chip">${esc(label)} <b>${esc(Array.isArray(shown) ? (shown.join('、') || '无') : shown)}</b></span>`
  }).join('')

  $('#out').innerHTML = `
  <div class="card">
    <div class="big ${d.valid ? '' : 'bad'}">
      <div class="icon">${d.valid ? '✓' : '!'}</div>
      <div style="flex:1">
        <b>${d.valid ? '签名有效 · 凭证可信' : '验签未通过'}</b>
        <span>${esc(d.reason)}</span>
      </div>
    </div>
    <div class="row" style="margin-top:12px"><div class="k">签发者</div><div class="v mono">${esc(d.issuer)}</div></div>
    <div class="row"><div class="k">持有人 DID</div><div class="v mono">${esc(cut(d.subject, 22))}</div></div>
    <div class="row"><div class="k">凭证编号</div><div class="v mono">${esc(d.jti)}</div></div>
    <div class="row"><div class="k">签发时间</div><div class="v">${esc(String(d.issuedAt || '').slice(0, 19))}</div></div>
    <div class="row"><div class="k">有效期至</div><div class="v">${esc(String(d.expiresAt || '').slice(0, 19))}</div></div>
  </div>

  <div class="card">
    <h2>${c.role ? '披露的身份事实' : '披露的旅行事实'}</h2>
    <div class="chips">${chips || '<span class="chip">无</span>'}</div>
    <h2 style="margin-top:18px">未披露（从不下发）</h2>
    <div class="chips">${(d.notDisclosed || []).map((x) => `<span class="chip" style="color:var(--faint)">${esc(x)}</span>`).join('')}</div>
  </div>

  <div class="card">
    <h2>凭证原文</h2>
    <textarea readonly style="min-height:80px">${esc(($('#jwt').value || '').trim())}</textarea>
    <div class="note">可直接把这段原文交给第三方，用下方公钥离线验签，结果应与本页一致。</div>
  </div>`
}

async function loadIssuer() {
  try {
    const r = await fetch('/open/vc/issuer').then((x) => x.json())
    const d = r.data
    $('#issuerBox').innerHTML = `
      <div class="row" style="margin-top:0"><div class="k">issuer</div><div class="v mono">${esc(d.issuer)}</div></div>
      <div class="row"><div class="k">kid</div><div class="v mono">${esc(d.kid)}</div></div>
      <div class="row"><div class="k">算法</div><div class="v">EdDSA（Ed25519）</div></div>
      <div class="row"><div class="k">公钥 x</div><div class="v mono">${esc(d.keys[0].x)}</div></div>
      <div class="row"><div class="k">JWKS 地址</div><div class="v mono">/open/vc/issuer</div></div>
      <div class="note" style="margin-top:10px">${esc(d.usage)}<br>${esc(d.privacy)}</div>`
  } catch (e) {
    $('#issuerBox').textContent = '读取公钥失败：' + e.message
  }
}

loadIssuer()
const q = new URLSearchParams(location.search).get('jwt')
if (q) { $('#jwt').value = q; doVerify() }
</script>
</body>
</html>
