function beanDeduct(t){
  if(!buyState.useBeans) return 0;
  const maxBeans = Math.floor(t.price * buyState.n * 0.3) * 10;
  return Math.min(DB.wallet, maxBeans);
}

  updateCalc(t);
}
function toggleBeans(){
  buyState.useBeans = !buyState.useBeans;
  $('#beanSwitch').classList.toggle('on', buyState.useBeans);
  updateCalc(DB.tours.find(x=>x.id===buyState.id));
}
function updateCalc(t){
  const sub = t.price * buyState.n;
  const beanYuan = beanDeduct(t) / 10;
  $('#calcN').textContent = buyState.n;
  $('#calcSub').textContent = '¥' + sub;
  $('#calcBean').textContent = '-¥' + beanYuan.toFixed(0);
  $('#calcTotal').textContent = '¥' + (sub - beanYuan);
  $('#calcEarn').textContent = (t.earn * buyState.n) + ' 旅豆';
}

let LINK_LOG = [];
function applyOrder(t, n, beans){
  const earn = t.earn * n, fee = Math.round(t.price * n * 0.08);
  DB.wallet += earn;
  DB.txLog.unshift({d:t.title+' · 消费奖励', t:'刚刚', a:'+'+earn, p:'plus', chain:'0x'+Math.random().toString(16).slice(2,6)+'…'+Math.random().toString(16).slice(2,6)});
  const code = rnd6();
  DB.visitorOrders.unshift({n:t.title, d:'刚刚 · 待出行', price:t.price*n, bean:earn, status:'待核销', code, merch:t.merch, sc:t.sc || 'bamboo', ppl:n});
  DB.merch.today++; DB.merch.gmv += t.price*n; DB.merch.pending++;
  DB.merch.orders.unshift({n:t.title, visitor:'我（游客端演示）', tm:'刚刚', status:'待核销', paid:'¥'+t.price*n, code, bean: beans>0 ? '-'+beans : 0});
  DB.partner.monthEarn += fee; DB.partner.withdrawable += fee; DB.partner.totalEarn += fee;
  DB.partner.referrals[0].gmv += t.price*n; DB.partner.referrals[0].orders += n; DB.partner.referrals[0].v += fee;
  DB.admin.todayGmv += t.price*n; DB.admin.todayOrders++; DB.admin.monthGmv += t.price*n; DB.admin.monthOrders++;
  DB.admin.budget.issued += earn;
  DB.admin.stream.unshift({t:'刚刚', d:'新订单 · '+t.title+' ¥'+t.price*n+' · 四端已同步', c:'#4ade80'});
  if(beans>0) DB.merch.beans += beans;
  LINK_LOG = [
    ['ok','游客端','订单创建 · 旅豆 +'+earn+' · 待核销'],
    ['ok','合伙人端','黄金合伙人 8% 返佣 +¥'+fee+'（'+DB.partner.referrals[0].n+'）'],
    ['ok','商户端','新增待核销订单 · 流水 +¥'+t.price*n],
    ['ok','平台运营端','GMV / 订单 / 积分发行数据已更新'],
  ];
}

function redeemBeanUse(k, i){
  const u = BEAN_USE[k];
  const it = u.items && u.items[i];
  if(!it){ toast('权益不存在'); return; }
  const label = String(it[1]).replace(/'/g,'');
  const cost = /\d+\s*豆/.test(label) ? (parseInt(label.replace(/[^0-9]/g,''), 10) || 0) : 0;
  if(cost <= 0){ applyMaterial(u.t, it[0]); return; }
  if(DB.wallet < cost){ toast('旅豆余额不足 · 还差 ' + (cost - DB.wallet) + ' 豆'); return; }
  DB.wallet -= cost;
  DB.txLog.unshift({ d:'权益兑换 · ' + it[0], t:'刚刚', a:'-' + cost, p:'minus', chain:'0x' + Math.random().toString(16).slice(2,6) + '…' + Math.random().toString(16).slice(2,6) });
  renderBase();
  toast('兑换成功 · ' + it[0] + '\n已扣 ' + cost + ' 豆，权益已发放');
  setTimeout(function(){ pop(); pushBeanUsePage(k); }, 900);
}

/* ===== 约稿任务状态机：待领取 → 进行中 → 审核中 → 已完成 ===== */
const MISSION_ST = {
  todo:   { t:'待领取', c:'gray' },
  doing:  { t:'进行中', c:'gold' },
  review: { t:'审核中', c:'deep' },
  done:   { t:'已完成', c:'green' },
};
function missionCard(m){
  const st = MISSION_ST[m.st] || MISSION_ST.todo;
  const acts = {
    todo:   '<button class="btn sm" onclick="claimMission('+m.id+')">领取任务</button>',
    doing:  '<button class="btn sm" onclick="submitMission('+m.id+')">提交作品</button>',
    review: '<button class="btn sm ghost" disabled>平台审核中</button>',
    done:   '<button class="btn sm ghost" onclick="viewMissionReward('+m.id+')">查看奖励</button>',
  }[m.st];
  return `<div class="mission-card st-${m.st}" id="mission-${m.id}">
    <div class="mh"><b>${m.n}</b><span class="tag ${st.c}">${st.t}</span></div>
    <p>${m.d}</p>
    <div class="mission-meta">
      <span>${ic('i-user')} ${m.by}</span>
      <span>${ic('i-clock')} 截止 ${m.deadline}</span>
      <span>${ic('i-doc')} ${m.need}</span>
    </div>
    ${m.st==='doing'?'<div class="mission-tip">'+ic('i-spark')+'已领取，请在 '+m.deadline+' 前提交作品；通过审核后奖励自动发放。</div>':''}
    ${m.st==='review'?'<div class="mission-tip">'+ic('i-clock')+'作品已提交（'+(m.work?m.work.title:'—')+'），等待平台审核。审核通过后 '+m.rw+' 自动发放。</div>':''}
    ${m.st==='done'?'<div class="mission-tip done">'+ic('i-check')+'已完成 · 奖励已发放至钱包与旅豆流水</div>':''}
    <div class="mf"><span class="rw">${ic('i-gift')} 奖励：${m.rw}</span>${acts}</div>
  </div>`;
}
function refreshMissions(){
  const box = $('#missionList');
  if(box){ box.innerHTML = DB.missions.map(missionCard).join(''); return; }
  /* 创作中心内嵌的任务卡：逐个原地替换 */
  DB.missions.forEach(function(m){
    const el = document.getElementById('mission-' + m.id);
    if(!el) return;
    const tmp = document.createElement('div');
    tmp.innerHTML = missionCard(m);

}

/** 设置项真实持久化：写入 DB.settings 并原地重绘，开关态可见 */
function toggleSetting(k){
  const s = DB.settings;
  s[k] = !s[k];
  const labels = { order:'订单与核销提醒', bean:'旅豆到账提醒', mkt:'营销活动推送' };
  repaintCurrentPage(settingsBodyHtml);
  toast(labels[k] + (s[k] ? ' 已开启' : ' 已关闭') + '\n设置已保存');
}
function clearCache(){
  const s = DB.settings;
  if(s.cacheMB <= 0){ toast('缓存已是干净的'); return; }
  const freed = s.cacheMB; s.cacheMB = 0;
  toast('缓存已清理 · 释放 '+freed+' MB\nTravel ID 与订单记录不受影响');
  setTimeout(function(){ repaintCurrentPage(settingsBodyHtml); }, 900);
}
