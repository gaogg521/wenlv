server {
    listen 80;
    server_name ziyou.1work.vip;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 301 https://ziyou.1work.vip$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name ziyou.1work.vip;
    ssl_certificate /etc/letsencrypt/live/ziyou.1work.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ziyou.1work.vip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/wanderlust-site/current;
    index index.html;
    server_tokens off;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    error_page 404 /404.html;
    location = /404.html { internal; }
    location ~ /\. { deny all; }
    location = /version.json { expires -1; }
    location ~* \.(?:css|js)$ { expires -1; try_files $uri =404; }
    location ~* \.(?:webp|png|jpg|svg)$ { expires 1h; try_files $uri =404; }
    location / { expires -1; try_files $uri $uri/ =404; }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
