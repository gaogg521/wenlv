<script>
/* =====================================================
   平台运营端（管理舱 · 经营与风控）
===================================================== */
VIEWS.admin = {
  dash(){
    /* v1.10：全部数字来自 dashRange(口径)，视图层零硬编码 */
    const r = dashRange(DB.x.range.cur);
    const N = function(v){ return Number(v).toLocaleString('zh-CN'); };
    const F = function(k){
      const v = k.v;
      if(k.fmt === 'money') return v >= 100000 ? '¥' + (v/10000).toFixed(1) + '万' : '¥' + Math.round(v).toLocaleString('zh-CN');
      if(k.fmt === 'int')   return N(Math.round(v));
      if(k.fmt === 'yuan')  return '¥' + Math.round(v);
      if(k.fmt === 'pct1')  return v.toFixed(1) + '%';
      if(k.fmt === 'x1')    return v.toFixed(1) + '×';
      return String(v);
    };
    /* 环比：金额用 %，比率用 pp；涨红跌绿（A 股口径） */
    const D = function(k){
      const v = k.d, unit = k.unit === 'pp' ? 'pp' : '%';
      if(Math.abs(v) < 0.05) return '<span class="vflat">— 持平</span>';
      return '<span class="' + (v > 0 ? 'vup' : 'vdn') + '">' + (v > 0 ? '▲ ' : '▼ ') + Math.abs(v).toFixed(1) + unit + '</span>';
    };
    const TG = function(k){
      const p = Math.max(0, Math.min(100, k.pct));
      const cls = k.pct >= 100 ? '' : (k.pct >= 90 ? 'mid' : 'low');
      return '<div class="tgt ' + cls + '"><i style="width:' + p.toFixed(1) + '%"></i></div>';
    };
    const LV = { ok:'#0f9d58', warn:'#f59f00', bad:'#e03131' };
    const bad = r.insight.filter(function(x){ return x.lv !== 'ok'; }).length;

    /* 趋势图：目标虚线位置 = 每列目标 / 刻度上限（与柱高同一坐标系，必然对齐） */
    const tPct = Math.max(2, Math.min(98, r.tv / r.maxV * 100));

    const fSteps = [
      { n:'曝光',     v:r.funnel.e, c:'#1c7ed6' },
      { n:'详情浏览', v:r.funnel.v, c:'#2f9e8f' },
      { n:'下单',     v:r.funnel.o, c:'#e87722' },
      { n:'核销完成', v:r.funnel.f, c:'#0f9d58' },
    ];

    return `
    <div class="admin-hero">
      <div class="ah-row">
        <div class="ah-ic">${ic('i-chart')}</div>
        <div><b>经营驾驶舱</b><span>${r.label} · ${r.days} 天 · ${N(r.cur.ord)} 单 · 全域合计</span></div>
        <div class="ah-live"><i></i>实时</div>
      </div>
    </div>
    <div class="rng-bar" style="margin-top:-18px">
      ${RANGE_OPTS.map(function(o){
        return '<b class="' + (o.k === r.k ? 'on' : '') + '" onclick="setDashRange(\'' + o.k + '\')">' + o.l + '</b>';
      }).join('')}
    </div>
    <div class="rng-hint">${ic('i-calendar')} 环比基线 <em>${r.prevLabel}</em> · 目标日均 <em>¥${N(Math.round(r.goal.gmv / r.days))}</em> · 达成率见各卡进度条</div>

    <div class="admin-kpi" style="margin-top:0">
      ${r.kpi.map(function(k){
        const tip = '本期 ' + F(k) + ' · 目标 ' + (k.unit === 'pp' ? k.note.replace('目标 ', '') : k.note.replace('目标 ', '')) +
                    ' · 环比 ' + (k.d >= 0 ? '+' : '') + k.d.toFixed(1) + (k.unit === 'pp' ? 'pp' : '%');
        return '<div class="ak" title="' + tip + '"><b class="kn">' + F(k) + '</b><span>' + k.l + '</span>' +
          '<div class="tr">' + D(k) + '</div>' + TG(k) + '</div>';
      }).join('')}
    </div>

    <div class="dgn">
      <div class="dgn-h">${ic('i-spark')} 经营诊断<span>${bad ? bad + ' 项需关注' : '全线健康 · 0 项待处理'}</span></div>
      ${r.insight.map(function(x){
        const c = LV[x.lv] || LV.ok;
        return '<div class="dgn-row' + (x.act ? ' jump' : '') + '"' + (x.act ? ' onclick="' + x.act + '"' : '') + '>' +
          '<em style="background:' + c + '"></em>' +
          '<div class="dt" style="color:' + c + '">' + x.t + '</div>' +
          '<div class="db">' + x.d + '</div>' +
          (x.act ? '<span class="go">' + ic('i-arrow') + '</span>' : '') +
        '</div>';
      }).join('')}
    </div>

    <div class="chart-card">
      <h4>日均成交额（千元/日）<span>每列 ${r.trend.per > 1 ? r.trend.per + ' 天日均' : '单日'} · 目标 ¥${N(Math.round(r.goal.gmv / r.days))}/日</span></h4>
      <div style="margin-top:14px">
        <div style="position:relative;height:74px">
          <div style="position:absolute;left:0;right:0;top:${(100 - tPct).toFixed(2)}%;border-top:1px dashed #f59f00;pointer-events:none;z-index:2"></div>
          ${r.trend.items.map(function(x){
            const h = Math.max(2, x.v / r.maxV * 100);
            const bg = x.cur ? 'linear-gradient(180deg,#f5a623,#e87722)' : 'linear-gradient(180deg,#14b8a6,#0f766e)';
            return '<div title="' + x.full + '" style="position:absolute;bottom:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;width:' + (100 / r.trend.items.length).toFixed(3) + '%;left:' + (100 / r.trend.items.length * r.trend.items.indexOf(x)).toFixed(3) + '%;padding:0 3px;box-sizing:border-box">' +
              '<b style="position:absolute;left:0;right:0;bottom:100%;margin-bottom:3px;text-align:center;font-size:8px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums">' + x.v.toFixed(1) + '</b>' +
              '<div style="height:' + h.toFixed(2) + '%;border-radius:5px 5px 2px 2px;background:' + bg + '"></div>' +
            '</div>';
          }).join('')}
        </div>
        <div style="display:flex;margin-top:5px">
          ${r.trend.items.map(function(x){
            return '<div style="flex:1;text-align:center;font-size:8.5px;color:var(--sub)">' + x.l + '</div>';
          }).join('')}
        </div>
      </div>
      <div class="legend" style="margin-top:9px">
        <i>${ic('i-trend')} 日均 ¥${N(Math.round(r.cur.gmv / r.days))}</i>
        <i style="margin-left:auto;color:#f59f00;white-space:nowrap">— — 目标 ¥${N(Math.round(r.goal.gmv / r.days))}</i>
      </div>
    </div>

    <div class="chart-box" style="margin-top:0">
      <div class="ch"><b>转化漏斗</b><span class="cv">${r.label} · 四端合计</span></div>
      ${funnelSVG(fSteps)}
      <div class="legend"><i>${ic('i-trend')} 曝光→核销 ${r.funnel.rate.toFixed(2)}%</i><i style="margin-left:auto">${ic('i-shield')} 已剔除异常流量</i></div>
    </div>

    <div class="chart-card" id="cityCard">
      <h4>分城经营明细<span>${r.label} · 合计等于大盘</span></h4>
      <div class="ct-h"><b>城市</b><b>GMV</b><b>占比</b><b>环比</b></div>
      ${r.cities.map(function(c){
        return '<div class="ct-r"' + (c.core ? '' : ' style="opacity:.72"') + '>' +
          '<div class="cn"><i style="background:' + c.c + '"></i><b>' + c.n + '</b></div>' +
          '<span class="cg">¥' + (c.gmv >= 10000 ? (c.gmv / 10000).toFixed(1) + '万' : Math.round(c.gmv).toLocaleString()) + '</span>' +
          '<em>' + c.share.toFixed(1) + '%</em>' +
          '<em class="' + (c.up >= 0 ? 'vup' : 'vdn') + '">' + (c.up >= 0 ? '+' : '') + c.up.toFixed(1) + '%</em>' +
        '</div>';
      }).join('')}
      <div class="ct-tot"><span>分城合计 · ${N(r.cur.ord)} 单</span><b>¥${N(r.cur.gmv)}</b></div>
    </div>

    <div class="chart-box">
      <div class="ch"><b>收入结构</b><span class="cv">方案 §2 · 四条业务线 · 随口径漂移</span></div>
      <div style="display:flex;align-items:center;gap:11px">
        ${donutSVG(r.biz, { size:96, center:r.biz[0].v + '%', sub:r.biz[0].n })}
        <div style="flex:1;min-width:0">
          ${r.biz.map(function(c){
            return '<div class="biz-line"><em style="background:' + c.c + '"></em>' +
              '<div class="bl-b"><b>' + c.n + '</b><span>' + c.d + '</span></div>' +
              '<b class="bl-v">' + c.v + '%</b></div>';
          }).join('')}
        </div>
      </div>
    </div>

    <div class="chart-card">
      <h4>实时业务流 <span>四端数据互通</span></h4>
      ${DB.admin.stream.slice(0, 6).map(function(s){
        return '<div class="stream-row"><span class="dot" style="background:' + s.c + '"></span><span class="st2">' + s.d + '</span><span class="sv2">' + s.t + '</span></div>';
      }).join('')}
    </div>

    <div class="sec-title">生态与功能入口 <span class="more">经营视图之上的能力层</span></div>
    <div class="eco-entry" onclick="pushEcoPage()">
      <div class="ee-ic">${ic('i-layers')}</div>
      <div class="ee-b"><b>生态架构与总体方案</b><span>三层架构 · 六大引擎 · 技术选型 · 五阶段验收</span></div>
      <div class="ee-a">${ic('i-arrow')}</div>
    </div>
    <div class="eco-entry" onclick="pushWeb3Page()">
      <div class="ee-ic" style="background:#e8f0f7;color:#2f6f9f">${ic('i-chain')}</div>
      <div class="ee-b"><b>Web3 数字底座</b><span>Travel ID 确权 · 旅豆链上凭证 · 贡献存证 · 境内外隔离</span></div>
      <div class="ee-a">${ic('i-arrow')}</div>
    </div>
    <div class="eco-entry" onclick="pushNftOpsPage()">
      <div class="ee-ic" style="background:#fdf0e4;color:#e87722">${ic('i-box')}</div>
      <div class="ee-b"><b>数字藏品发行中台</b><span>发行计划 · 批量铸造 · 转赠监控 · 合规红线</span></div>
      <div class="ee-a">${ic('i-arrow')}</div>
    </div>
    <div class="eco-entry" onclick="pushRightsPage()">
      <div class="ee-ic" style="background:#e7f6ee;color:#0f766e">${ic('i-ticket')}</div>
      <div class="ee-b"><b>权益核销与结算</b><span>核销漏斗 · 商家对账 · 差异处置 · 并入分账</span></div>
      <div class="ee-a">${ic('i-arrow')}</div>
    </div>
    <div class="note">
      <b>口径说明</b>　成交额 = 订单实付合计（含未核销、不含退款）；成交订单 = 支付成功单；客单价 = 成交额 ÷ 成交订单；
      权益核销率 = 已核销单 ÷ 成交单（最近 4 天订单仍在核销期内，故短口径偏低属在途）；复购率按近 90 天滚动窗口计算；
      分城按履约地归属，长尾归「其他城市」；环比基期为上一等长区间（「本月」对上一月同期）。数据截止 ${r.label.split(' – ')[1] || r.label}。
    </div>`;
  },

  risk(){
    const b = DB.admin.budget;
    const pct = Math.round(b.issued/b.total*100);
    const f = fcState();
    const fh = f.lv === 'red'
      ? '下期超支预测 ' + (f.rate * 100).toFixed(1) + '% · 破红灯线'
      : f.lv === 'amber'
        ? '下期超支预测 ' + (f.rate * 100).toFixed(1) + '% · 已破熔断线'
        : '下期超支预测 ' + (f.rate * 100).toFixed(1) + '% · 在可控区间';
    return `
    <div class="admin-hero">
      <div class="ah-row">
        <div class="ah-ic">${ic('i-shield')}</div>
        <div><b>积分风控</b><span>发行预算池 · 生命周期 · 反作弊预警</span></div>
        <div class="ah-live"><i></i>预警 ${DB.admin.warnings.length} 条</div>
      </div>
    </div>
    <div class="fc-alert ${f.lv}" style="margin:14px 14px 0">
      <div class="fh">${ic(f.lv === 'green' ? 'i-check' : 'i-alert')} 权益成本事前预警 · ${fh}</div>
      <div class="fd">本期实付 ¥${f.net.toLocaleString()} 已超预留池，且近周节奏比全期均速高 <b>${(f.trend * 100).toFixed(1)}%</b>。按当前节奏外推，下期成本将达 <b>¥${f.fcNext.toLocaleString()}</b>，¥${f.pool.toLocaleString()} 的池子在第 <b>${f.bottom.toFixed(1)}</b> 天见底 —— 等结算完再处置，钱已经花完了。</div>
      <button class="fc-ago" onclick="pushRightsPage()">查看下期预测与超支审批</button>
    </div>
    <div class="sec-title" style="padding-top:16px">积分发行预算池</div>
    <div class="card" style="padding:16px">
      <div class="budget-ring">
        <div class="br" style="background:conic-gradient(#0f766e 0 ${pct}%, #e8efee 0)"><b>${pct}%</b></div>
        <div class="br-info">
          <div class="bri"><span>本月预算上限</span><b>${b.total.toLocaleString()} 豆</b></div>
          <div class="bri"><span>已发行</span><b style="color:#0f766e">${b.issued.toLocaleString()} 豆</b></div>
          <div class="bri"><span>已核销</span><b>${b.used.toLocaleString()} 豆</b></div>
          <div class="bri"><span>剩余可发行</span><b>${(b.total-b.issued).toLocaleString()} 豆</b></div>
        </div>
      </div>
      <div style="font-size:10px;color:var(--sub);margin-top:10px;line-height:1.7">发行原则：预算驱动发行，与已批准营销预算及可承受订单贡献利润挂钩，严禁超发。</div>
    </div>
    <div class="sec-title">积分生命周期 <span class="more">方案 §9 · 六机制</span></div>
    <div class="life-wrap">
      ${[
        {t:'发行', d:'与订单贡献利润、商家营销预算或专项预算挂钩', k:'不超发'},
        {t:'发放', d:'订单履约完成、退款观察期结束后生效', k:'不见单不发'},
        {t:'使用', d:'兑换明确的服务、优惠或会员权益', k:'不兑现'},
        {t:'结算', d:'依据商家协议承担成本并统一对账', k:'可对账'},
        {t:'回收', d:'退款、作弊、重复领取时撤销或冲正', k:'可冲正'},
        {t:'到期', d:'明示有效期，依法告知并评估履约义务', k:'有期限'},
      ].map(function(x,i){ return `
        <div class="life-row">
          <div class="lf-no">${i+1}</div>
          <div class="lf-b"><div class="lf-h"><b>${x.t}</b><span>${x.k}</span></div><div class="lf-d">${x.d}</div></div>
        </div>`; }).join('')}
    </div>
    <div class="budget-formula">
      <div class="bf-t">${ic('i-calc')} 积分预算上限</div>
      <div class="bf-f">= min（ 已批准营销预算 ， 可承受的订单贡献利润比例 ）</div>
      <div class="bf-d">预算驱动发行，而不是无限增发。权益成本率按 GMV 计提，进入单城测算的权益成本项。</div>
    </div>
    <div class="sec-title">四本账分别建账 <span class="more">不可混同</span></div>
    <div class="book-grid">
      ${[['积分账','旅豆发行/消耗/结余'],['现金佣金账','合伙人、创作者佣金'],['商家应收账','结算与退款冲正'],['支付资金账','用户实付与通道清算']].map(function(x){
        return '<div class="book"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>';
      }).join('')}
    </div>
    <div class="sec-title">积分发放限额 <span class="more">按用户 / 活动 / 商家分层</span></div>
    <div class="card" style="padding:4px 14px 6px">
      ${[
        {n:'单用户单月上限', v:'2,000 豆', d:'超出需人工审批 · 防刷取'},
        {n:'单活动预算上限', v:'50,000 豆', d:'按营销预算批复额度执行'},
        {n:'单商家月结算上限', v:'30,000 豆', d:'与履约评分挂钩浮动'},
        {n:'单笔订单返豆上限', v:'订单金额 10%', d:'不得突破毛利率红线'},
      ].map(function(x){ return '<div class="row" style="padding:11px 0"><div class="rt"><b>'+x.n+'</b><span>'+x.d+'</span></div><b style="color:#0f766e;font-size:12.5px">'+x.v+'</b></div>'; }).join('')}
    </div>
    <div class="sec-title">风控预警 <span class="more">${DB.admin.warnings.length} 条待处理</span></div>
    ${DB.admin.warnings.map((w,i)=>`<div class="warn-card">
      <div class="wh"><div style="width:32px;height:32px;border-radius:10px;background:${w.c}18;color:${w.c};display:flex;align-items:center;justify-content:center">${ic('i-alert')}</div>
      <b>${w.t}</b><span class="lv" style="background:${w.c}18;color:${w.c}">${w.lv}</span></div>
      <p>${w.d}</p>
      <div class="wf"><button class="btn sm" onclick="handleWarn('${w.id}','freeze')">冻结返佣结算</button><button class="btn sm ghost" onclick="handleWarn('${w.id}','ignore')">标记误报</button></div>
    </div>`).join('')}
    <div class="note">风控规则：用户 / 活动 / 商家分别设置上限；线下数据真实性由订单、动态核销码、商家确认与异常检测联合验证。</div>`;
  },
  audit(){
    /* v1.10：审核统计改为派生，构成占比由件数归一得到，杜绝「百分比与件数不符」 */
    const ST = DB.x.auditStat;
    const passN = Math.round(ST.done * ST.passPct / 100);
    const rejN = ST.done - passN;
    const dist = ST.mix.map(function(x){
      return { n:x.n, c:x.c, v: Math.round(x.n2 / ST.done * 1000) / 10 };
    });
    return `
    <div class="admin-hero">
      <div class="ah-row">
        <div class="ah-ic">${ic('i-task')}</div>
        <div><b>准入审核</b><span>UGC 内容 · 商家资质 · 佣金核算</span></div>
        <div class="ah-live"><i></i>待审 ${DB.admin.audits.length} 项</div>
      </div>
    </div>
    <div class="kpi-grid" style="padding-top:14px">
      <div class="kpi-item"><b class="num">${ST.done}</b><span>本月已审</span><div class="trend up">环比 +${ST.mom}%</div></div>
      <div class="kpi-item"><b class="num">${ST.passPct}%</b><span>通过率</span><div class="trend up">${passN} 项通过</div></div>
      <div class="kpi-item"><b class="num">${ST.hours}h</b><span>平均时效</span><div class="trend up">优于 ${ST.sla}h 承诺</div></div>
      <div class="kpi-item"><b class="num">${rejN}</b><span>本月驳回</span><div class="trend" style="color:#e5484d">${ST.rejTop}</div></div>
    </div>
    <div class="chart-box">
      <div class="ch"><b>审核类型构成</b><span class="cv">本月 ${ST.done} 项</span></div>
      <div class="chart" style="align-items:center">
        ${donutSVG(dist, { size:112, center:dist[0].v + '%', sub:dist[0].n })}
        <div class="legend" style="flex:1">
          ${dist.map(function(x){ return '<i style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:2px;background:'+x.c+';display:inline-block"></span>'+x.n+' · '+x.v+'%</i>'; }).join('')}
        </div>
      </div>
    </div>
    <div class="sec-title">待审队列 <span class="more">${DB.admin.audits.length} 项</span></div>
      ${DB.admin.audits.length ? DB.admin.audits.map(function(x,i){ return `<div class="audit-card">
        <div class="ah"><div class="ai" style="background:${x.c}18;color:${x.c}">${ic(x.ic)}</div>
        <div><b>${x.n}</b><span>${x.t} · ${x.st}</span></div></div>
        <p>${x.d}</p>
        <div class="af"><button class="btn sm" onclick="handleAudit('${x.id}','pass')">${ic('i-check')} 通过</button><button class="btn sm ghost" onclick="handleAudit('${x.id}','reject')">驳回</button></div>
      </div>`; }).join('') : '<div class="empty">'+ic('i-task')+'审核队列已清空<br>所有待审事项均已处理</div>'}

function sensTableHtml(){
  const c = DB.admin.calc;
  const rowStep = Math.max(100, Math.round(c.price*0.25/10)*10);
  const colStep = Math.max(100, Math.round(c.orders*0.25/100)*100);
  const prices = [c.price - rowStep, c.price, c.price + rowStep];
  const orders = [c.orders - colStep, c.orders, c.orders + colStep];
  const cell = function(p, o){
    const gmv = p*o;
    const profit = gmv*c.rate/100 - gmv*c.varCost/100 - gmv*c.equity/100 - c.fixed;
    let bg = '#fdeced', fg = '#c92a2a';
    if(profit >= 0 && profit < c.fixed*0.3){ bg = '#fff6e8'; fg = '#b26a00'; }
    else if(profit >= c.fixed*0.3 && profit < c.fixed){ bg = '#e7f6ee'; fg = '#0f7a46'; }
    else if(profit >= c.fixed){ bg = '#c9ecda'; fg = '#09603a'; }
    return { v: Math.round(profit), bg: bg, fg: fg };
  };
  let html = '<thead><tr><th></th>' + orders.map(function(o){ return '<th>' + o.toLocaleString() + ' 单</th>'; }).join('') + '</tr></thead><tbody>';
  prices.forEach(function(p){
    html += '<tr><th>¥' + p + '</th>' + orders.map(function(o){ const r = cell(p,o); return '<td style="background:'+r.bg+';color:'+r.fg+'">'+(r.v>=0?'':'-') + Math.abs(r.v).toLocaleString() + '</td>'; }).join('') + '</tr>';
  });
  html += '</tbody>';
  return html;
}
function calcUpdate(k, v){
  DB.admin.calc[k] = Number(v);
  $('#cv_'+k).textContent = k==='fixed' ? (v/10000).toFixed(0)+'万' : (k==='orders'||k==='price' ? v : v+'%');

function calcResultHtml(){
  const c = DB.admin.calc;
  const gmv = c.orders * c.price;
  const revenue = gmv * c.rate / 100;
  const varC = gmv * c.varCost / 100;
  const eqC = gmv * c.equity / 100;
  const profit = revenue - varC - eqC - c.fixed;
  const be = c.price * (c.rate - c.varCost - c.equity) / 100 > 0 ? Math.round(c.fixed / (c.price * (c.rate - c.varCost - c.equity) / 100)) : Infinity;
  return `
    <div class="cr"><span>月 GMV</span><b>${money(gmv)}</b></div>
    <div class="cr"><span>平台月收入</span><b>${money(Math.round(revenue))}</b></div>
    <div class="cr"><span>月变动成本</span><b>${money(Math.round(varC))}</b></div>
    <div class="cr"><span>月权益成本</span><b>${money(Math.round(eqC))}</b></div>
    <div class="cr"><span>月固定成本</span><b>${money(c.fixed)}</b></div>
    <div class="cr big ${profit<0?'neg':''}"><span>月经营贡献结余</span><b>${money(Math.round(profit))}</b></div>
    <div class="cr big"><span>盈亏平衡月订单量</span><b>${be===Infinity?'无法平衡':be.toLocaleString()+' 单'}</b></div>
    <div class="cr-note">当前参数${(c.orders===3000&&c.price===399&&c.rate===20&&c.varCost===9&&c.equity===2&&c.fixed===180000)?'与总体方案 §8.2 示例假设一致':''} · 单位贡献利润 ${money(Math.round(c.price*(c.rate-c.varCost-c.equity)/100))}/单 · 固定成本需 ${be===Infinity?'—':be.toLocaleString()} 单覆盖</div>`;
}
/* 方案 §8.1：从亏损走到盈亏平衡的四条路径 */
function pathsHtml(){
  const c = DB.admin.calc;
  const gmv = c.orders * c.price;
  const margin = (c.rate - c.varCost - c.equity) / 100;
  const profit = gmv * margin - c.fixed;
  if(profit >= 0) return '<div class="path-ok">' + '<b>已实现盈亏平衡</b><span>月经营贡献结余 ' + money(Math.round(profit)) + '，每单贡献 ' + money(Math.round(c.price*margin)) + '</span></div>';
  const gap = -profit;
  if(margin <= 0) return '<div class="path-warn">综合变现率不高于变动成本率与权益成本率之和，单位贡献利润为负，单量越大亏损越大。需先修复定价结构。</div>';
  const needPrice = Math.ceil(c.fixed / (c.orders * margin));
  const needRate  = Math.round((c.fixed / gmv * 100 + c.varCost + c.equity) * 10) / 10;
  const needFixed = Math.round(gmv * margin);
  const needOrders= Math.ceil(c.fixed / (c.price * margin));
  const items = [
    { n:'提客单价', cur:'¥'+c.price, need:'¥'+needPrice, d:'+'+(Math.round((needPrice/c.price-1)*1000)/10)+'%', v:'靠主题游深度与二销组合拉高，非普涨' },
    { n:'提综合变现率', cur:c.rate+'%', need:needRate+'%', d:'+'+(Math.round((needRate-c.rate)*10)/10)+'pp', v:'增加内容授权、SaaS、跨境服务收入' },
    { n:'降月固定成本', cur:(c.fixed/10000)+'万', need:(Math.round(needFixed/1000)/10)+'万', d:(Math.round((needFixed/c.fixed-1)*1000)/10)+'%', v:'单城小队 + 共享中台，不做重资产前置' },
    { n:'提月订单量', cur:c.orders+'单', need:needOrders.toLocaleString()+'单', d:'+'+(Math.round((needOrders/c.orders-1)*1000)/10)+'%', v:'方案 §8.2 基准解法：约 5,000 单/月' },
  ];
  return '<div class="path-gap">距盈亏平衡缺口 <b>' + money(Math.round(gap)) + '</b>/月 · 以下任一单变量路径可达</div>' +
    items.map(function(it){
      return '<div class="path-row"><div class="pr-n">' + it.n + '</div>' +
        '<div class="pr-v"><span>' + it.cur + '</span><i>→</i><b>' + it.need + '</b><em>' + it.d + '</em></div>' +
        '<div class="pr-d">' + it.v + '</div></div>';
    }).join('');
}

function handleAudit(id, act){
  /* 按 id 定位：连点同一个按钮时，第二、三次已找不到该项，自然幂等 */
  const i = DB.admin.audits.findIndex(function(a){ return a.id === id; });
  if(i < 0) return;
  const x = DB.admin.audits[i];
  /* 处置即入账：本月已审 +1，通过率随之重算（统计不能停在静态快照） */
  const ST = DB.x.auditStat;
  const passBefore = Math.round(ST.done * ST.passPct / 100);
  ST.done += 1;
  ST.passPct = Math.round((passBefore + (act === 'pass' ? 1 : 0)) / ST.done * 1000) / 10;
  if(act === 'pass'){
    if(x.t === 'UGC 内容'){
      DB.wallet += 50;
      DB.txLog.unshift({d:'游记被平台推荐奖励', t:'刚刚', a:'+50', p:'plus', chain:''});
    }
    toast('已通过：'+x.n + ' · 本月通过率 ' + ST.passPct + '%');
  } else {
    toast('已驳回：'+x.n + ' · 本月通过率 ' + ST.passPct + '%');
  }
  DB.admin.audits.splice(i,1);
  renderBase();
}

function rolePeek(k){
  if(k === S.end) return;
  setEnd(k);
  clearStack();
  pushRolePage();
  toast('已切到「' + ENDS[k].name + '」视角');
}

function engSteps(k){
  return (ENG_STEPS[k]||[]).map((s,i)=>{
    const done = (S.engStep && S.engStep[k] || []).indexOf(s.k) >= 0;
    const btn = done
      ? `<button class="egm-btn ghost" disabled>${ic('i-check')} 已完成</button>`
      : `<button class="egm-btn" onclick="engDo('${k}','${s.k}')">${i===0?'开始':s.t.slice(0,4).trim()}</button>`;
    return `<div class="egm-step ${done?'done':''}">
      <div class="n">${done?'✓':i+1}</div>
      <div class="t"><b>${s.t}</b><span>${s.d}</span></div>
      ${btn}
    </div>`;
  }).join('');
}
function engMark(k, step){
  S.engStep = S.engStep || {};
  S.engStep[k] = S.engStep[k] || [];
  if(S.engStep[k].indexOf(step) < 0) S.engStep[k].push(step);
}
function engLog(k, d, lv){
  lv = lv || 'ok';
  const c = lv==='ok' ? '#0f9d58' : lv==='warn' ? '#e8a020' : '#e5484d';
  const bg = lv==='ok' ? '#e8f6ee' : lv==='warn' ? '#fdf3e0' : '#fdecec';
  /* 三本日志表按引擎分别初始化，避免首次写入时目标数组不存在 */
  if(k === 'gateway')      DB.gateway.logs   = DB.gateway.logs   || [];
  else if(k === 'contrib') DB.contrib.logs   = DB.contrib.logs   || [];
  else                      DB.engine.log     = DB.engine.log     || [];
  const target = k==='gateway' ? DB.gateway.logs : k==='contrib' ? DB.contrib.logs : DB.engine.log;
  target.unshift({ t:'刚刚', d:d, lv:lv, c:c, bg:bg });
}
function engDo(k, step){

}

/* ---------- 激励引擎 ---------- */
function rwCap(){
  const b = DB.admin.budget;
  /* 口径统一（与运营端风控页 / 支付流 applyOrder 一致）：
     total=已批准营销预算 · issued=已发行额度 · used=已核销 · 剩余可发=total-issued */
  const room = b.total - b.issued;
  engMark('reward','cap');
  engLog('reward','预算池校验通过：已批准营销预算 '+fmtNum(b.total)+' − 已发行 '+fmtNum(b.issued)+' = 剩余可发 '+fmtNum(room)+' 旅豆');
  engLog('reward','已核销 '+fmtNum(b.used)+'，剩余可发额度 '+fmtNum(room)+' 旅豆', room>0?'ok':'warn');
  toast('预算上限校验通过 · 可发 '+fmtNum(Math.max(0,room))+' 豆');
  repaintEngine('reward');
}
function rwBatch(){
  const nb = DB.engine.batches.find(x=>x.st==='待启用');
  if(!nb){ toast('所有批次已启用 · 无待启用批次'); repaintEngine('reward'); return; }
  nb.st = '进行中';
  engMark('reward','batch');
  engLog('reward','批次 '+nb.id+'「'+nb.n+'」已启用，额度 '+fmtNum(nb.amt)+' 挂入预算池，周期 '+nb.d);
  toast('批次已启用 · '+nb.n);
  repaintEngine('reward');
}
function rwIssue(){
  const t = DB.engine.tasks.find(x=>x.st==='pending');
  if(!t){ toast('没有待发放任务 · 全部已处理'); repaintEngine('reward'); return; }
  const b = DB.admin.budget;
  if(b.total - b.issued < t.amt){ toast('预算池额度不足 · 已拦截'); engLog('reward','拦截：'+t.n+' 需 '+t.amt+' 豆，剩余可发 '+fmtNum(Math.max(0,b.total-b.issued))+' 不足','warn'); repaintEngine('reward'); return; }
  t.st = 'done';
  b.issued += t.amt;
  DB.wallet += t.amt;
  const bat = DB.engine.batches[0]; bat.used += t.amt;
  DB.txLog.unshift({ d:t.n, t:todayStr(), a:'+'+t.amt, p:'plus', chain:'0x'+Math.random().toString(16).slice(2,10)+'…'+Math.random().toString(16).slice(2,6) });
  engMark('reward','issue');
  engLog('reward','发放 '+t.amt+' 豆 → '+t.to+'（'+t.n+'）；已发行 '+fmtNum(b.issued)+'，剩余可发 '+fmtNum(b.total-b.issued)+'，钱包余额 '+DB.wallet);
  toast('已发放 +'+t.amt+' 旅豆 · '+t.to);
  repaintEngine('reward');
}
function rwLife(){
  const fz = DB.engine.tasks.find(x=>x.st==='frozen');
  if(fz){
    fz.st = 'pending';
    engLog('reward','解冻 '+fz.n+'（'+fz.amt+' 豆）：T+7 售后期满，未发生退款，恢复可发放');
    toast('已解冻 · '+fz.n);
  } else {
    const rc = DB.engine.tasks.find(x=>x.st==='recycle');
    if(rc){
      rc.st = 'done';
      DB.engine.recycled = (DB.engine.recycled||0) + rc.amt;
      engLog('reward','回收 '+rc.n+'（'+rc.amt+' 豆）：有效期届满，回收后不重新发行，避免超发；回收账累计 '+fmtNum(DB.engine.recycled),'warn');
      toast('已回收 · 不再发行');
    } else {
      DB.engine.tasks.push({ id:'R-'+(90+DB.engine.tasks.length), n:'新增待发放 · 履约完成', amt:60, to:'U-'+(2000+Math.floor(Math.random()*900)), st:'pending', d:'履约确认后发放', why:'演示数据' });

      toast('已新增一笔待发放任务');

  engMark('reward','life');
  repaintEngine('reward');
}
function rwBook(){

  const books = DB.engine.books;
  /* 四本账与预算池字段同口径：发行账=已发行 · 流通账=持有量 · 核销账=已核销 · 回收账=累计回收 */

function ctCalc(){
  let any = false;
  DB.contrib.items.forEach(function(it){
    if(it.st==='待确认'){ it.st = '已确认'; it.cs = csOf(it); any = true; }
  });
  if(!any){ toast('没有待确认内容 · 已完成全部计算'); repaintEngine('contrib'); return; }
  const bad = DB.contrib.items.filter(x=>x.bad);
  engMark('contrib','cs');
  engLog('contrib','CS = 0.5Q + 0.3S + 0.2R 已计算：' + DB.contrib.items.filter(x=>!x.bad).map(x=>x.n.slice(0,10)+'='+x.cs).join('、'));
  if(bad.length) engLog('contrib','注意：'+bad.map(x=>x.n).join('、')+' 命中反作弊规则，CS 不参与分润', 'warn');
  toast('CS 已计算 · 参与分润 ' + DB.contrib.items.filter(x=>!x.bad).length + ' 条');
  repaintEngine('contrib');
}
function ctAnti(){
  const bad = DB.contrib.items.filter(x=>x.bad && x.st!=='已拦截');
  if(!bad.length){
    engLog('contrib','本轮未发现新增作弊特征，风控规则持续生效');
    toast('未发现新增作弊特征');
  } else {
    bad.forEach(function(x){ x.st = '已拦截'; x.cs = 0; });
    const names = bad.map(x=>x.n).join('、');
    engLog('contrib','反作弊拦截：'+names+'（同一 IP 批量注册 46 账号，互动结构异常）', 'err');
    /* 幂等写入：已存在同源告警则不重复追加，避免运营端告警列表被刷屏 */
    if(!DB.admin.warnings.some(w=>String(w.d).indexOf('安吉瑜伽谷避坑指南') >= 0)){
      DB.admin.warnings.unshift({ t:'刷单特征已确认', lv:'高', c:'#e5484d', d:'内容《安吉瑜伽谷避坑指南》同一 IP 批量注册 46 账号，已拦截并冻结该账号 CS 结算，建议人工复核。' });
    }
    toast('已拦截 ' + bad.length + ' 条作弊内容');
  }
  engMark('contrib','anti');
  repaintEngine('contrib');
}
function ctSplit(){
  const valid = DB.contrib.items.filter(x=>x.cs && !x.bad);
  const total = valid.reduce(function(s,x){ return s + x.cs; }, 0);
  if(!total){ toast('请先完成 CS 计算'); repaintEngine('contrib'); return; }
  const dist = valid.map(function(x){
    const share = x.cs / total;
    return { n:x.n, a:x.a, cs:x.cs, pct:Math.round(share*1000)/10, amt:Math.round(DB.contrib.pool * share) };
  });
  DB.contrib.dist = dist;
  engMark('contrib','split');
  engLog('contrib','当月分润池 ¥'+fmtNum(DB.contrib.pool)+' 按 CS 占比分配：' + dist.map(x=>x.a+' ¥'+fmtNum(x.amt)).join('、'));
  toast('分润已分配 · 合计 ¥' + dist.reduce(function(s,x){return s+x.amt;},0));
  repaintEngine('contrib');
}

/* ---------- 结算引擎 ---------- */
function stSplit(){
  const o = DB.settle.orders.find(x=>x.st==='待对账');
  if(!o){ toast('没有待分账订单 · 全部已处理'); repaintEngine('settle'); return; }
  const sum = DB.settle.ratio.reduce(function(s,r){ return s + r.pct; }, 0);
  o.split = DB.settle.ratio.map(function(r){ return { k:r.k, pct:r.pct, amt:Math.round(o.amt * r.pct / 100), c:r.c, to:r.to }; });
  o.st = '已分账';
  /* 预算池注入 5% 分账即确认，占用已发行额度；退款时原路回收（见 stRefund） */
  const poolIn = o.split.find(x=>x.k==='预算池注入');
  if(poolIn){
    DB.admin.budget.issued += poolIn.amt;
    engLog('settle','预算池注入 '+poolIn.amt+' 豆已占用发行额度，剩余可发 '+fmtNum(DB.admin.budget.total - DB.admin.budget.issued));
  }
  engMark('settle','split');
  engLog('settle','订单 '+o.id+'（'+o.merch+' ¥'+fmtNum(o.amt)+'）分账完成，占比合计 '+sum+'%：' + o.split.map(x=>x.k+' ¥'+x.amt).join('、'));
  if(Math.abs(o.split.reduce(function(s,x){return s+x.amt;},0) - o.amt) > 1) engLog('settle','注意：分账明细与订单金额存在四舍五入差额，已计入留存毛利','warn');
  toast('分账完成 · ' + o.id);
  repaintEngine('settle');
}
function stRefund(){
  const o = DB.settle.orders.filter(function(x){ return x.split && x.refund===0; })[0];
  if(!o){ toast('没有可冲正的已分账订单'); repaintEngine('settle'); return; }
  o.refund = o.amt;
  o.st = '已冲正';
  o.splitRev = o.split.map(function(x){ return { k:x.k, amt:-x.amt, c:x.c }; });
  const poolBack = o.split.find(x=>x.k==='预算池注入');
  if(poolBack){
    DB.admin.budget.issued = Math.max(0, DB.admin.budget.issued - poolBack.amt);
    engLog('settle','退款冲正：预算池注入 '+poolBack.amt+' 豆原路回收，剩余可发 '+fmtNum(DB.admin.budget.total - DB.admin.budget.issued), 'warn');
  }
  const beanBack = DB.txLog.filter(function(x){ return x.d.indexOf(o.merch) >= 0 || x.d.indexOf(o.amt) >= 0; })[0];
  if(beanBack){ engLog('settle','已发旅豆权益按规则扣回，冲正流水 '+beanBack.a+' 豆','warn'); }
  engMark('settle','refund');
  engLog('settle','订单 '+o.id+' 全额退款 ¥'+fmtNum(o.amt)+'，生成负向分账：' + o.splitRev.map(x=>x.k+' ¥'+x.amt).join('、'), 'warn');
  toast('已冲正 · ' + o.id);
  repaintEngine('settle');
}
function stRecon(){
  const done = DB.settle.orders.filter(x=>x.split);
  if(!done.length){ toast('请先完成订单分账'); repaintEngine('settle'); return; }
  const rows = done.map(function(o){
    const gross = o.split ? o.split.filter(x=>x.to==='商户/供应商').reduce(function(s,x){return s+x.amt;},0) : 0;
    /* 全额退款的订单应结为 0，不允许出现负数应结 */
    return { id:o.id, merch:o.merch, amt:o.amt, gross:gross, refund:o.refund, net:Math.max(0, gross - o.refund), st:o.st };
  });
  const totalNet = rows.reduce(function(s,r){ return s + r.net; }, 0);
  DB.settle.stmts = rows;
  engMark('settle','recon');
  engLog('settle','商家对账单已生成：'+rows.length+' 笔，商户应结合计 ¥'+fmtNum(totalNet)+'（已扣退款冲正）');
  toast('对账单已生成 · 应结 ¥'+fmtNum(totalNet));
  repaintEngine('settle');
}
function stComm(){
  if(!DB.settle.stmts.length){ toast('请先生成对账单'); repaintEngine('settle'); return; }
  const base = DB.settle.stmts.filter(r=>!r.refund).reduce(function(s,r){ return s + r.amt; }, 0);
  const comm = Math.round(base * 0.08);
  engMark('settle','comm');
  engLog('settle','佣金核算：可核验订单 ¥'+fmtNum(base)+' × 8% = ¥'+fmtNum(comm)+'，只挂直接贡献、不挂下线圈层');
  engLog('settle','已退款订单 ¥'+fmtNum(DB.settle.stmts.filter(r=>r.refund).reduce(function(s,r){return s+r.refund;},0))+' 不计佣，符合「只对真实服务与有效交易计酬」', 'warn');
  toast('佣金核算完成 · ¥'+fmtNum(comm));
  repaintEngine('settle');
}

function nftIssue(i){
  const p = DB.nftOps.plans[i];
  if(!p) return;
  if(p.st !== '进行中'){ toast('该计划未在进行中，不能铸造'); repaintNftOps(); return; }
  const left = p.supply - p.minted;
  if(left <= 0){ p.st = '已结束'; toast('该计划已铸造完毕'); repaintNftOps(); return; }
  const n = Math.min(120, left);
  p.minted += n;
  if(p.minted >= p.supply) p.st = '已结束';
  DB.nftOps.seq += 1;
  const bh = ++DB.web3.chainInfo.height;
  DB.nftOps.batches.unshift({ id:'BT-' + DB.nftOps.seq, plan:p.id, n:n, t:nftNow(),
    by:'运营 · 当前账号', hash:nftHash(), st:'已确认' });
  toast('已铸造 ' + n + ' 张 · ' + p.n + '\n批次 BT-' + DB.nftOps.seq + ' 已确认 · 区块 #' + bh.toLocaleString());
  repaintNftOps();
}

  const p = DB.nftOps.plans[i];
  if(!p) return;
  if(p.st === '已结束'){ toast('该计划已结束，不可恢复发行'); repaintNftOps(); return; }
  p.st = p.st === '进行中' ? '已暂停' : '进行中';
  toast(p.st === '进行中' ? '已恢复发行 · 变更记录上链' : '已暂停发行 · 停止新增铸造');

function agrApprove(i){

  const C = DB.rights.contracts, c = C[i];

  c.st = '已驳回';
  c.lg = (c.lg || []).concat([{ t:stampNow(), by:'运营 · 王璐', d:'驳回：维持原协议价 ¥' + c.from + ' / 次' }]);
  toast(c.m + ' 协议变更已驳回 · 维持 ¥' + c.from + ' / 次\n本期成本不变，超支缺口不变');
  repaintRights();
}

function rsnMerchantCard(m, i){
  const stMap = { '已确认':['#e7f6ee','#0f7a46'], '待确认':['#fff4e8','#b26a00'], '差异':['#fdeceb','#c92a2a'], '申诉中':['#fdeceb','#c92a2a'] };
  const st = stMap[m.st] || stMap['待确认'];
  const aps = DB.rights.appeals.filter(function(a){ return a.m === m.n && a.st === '待受理'; });
  const dfs = DB.rights.diffs.filter(function(d){ return d.m === m.n && d.st === '待处置'; });
  const btn = m.st === '已确认'
    ? `<button class="rm-btn off" onclick="rsnConfirm(${i})">已确认 · ¥${rightsLineNet(m).toLocaleString()} 可结算${m.by ? '（' + m.by + '）' : ''}</button>`
    : m.st === '差异' || m.st === '申诉中'
      ? `<button class="rm-btn off" onclick="rsnConfirm(${i})">先处置差异/申诉再确认</button>`
      : `<button class="rm-btn pri" onclick="rsnConfirm(${i})">登记商家确认（线下盖章回传）</button>`;
  const net = rightsLineNet(m);
  const ap = agrPrice(m), chg = ap !== m.price;
  return `
  <div class="rsn-card">
    <div class="rm-top">
      <div class="rm-ic" style="background:${m.c}14;color:${m.c}">${ic(m.ic)}</div>
      <div class="rm-b"><b>${m.n}</b><span>${m.op ? m.op + ' · ' : ''}${m.r} · 协议单价 ¥${ap} / 次${chg ? '（已由 ¥' + m.price + ' 调价生效）' : ''}</span></div>
      <span class="rm-st" style="background:${st[0]};color:${st[1]}">${m.st}</span>
    </div>
    <div class="rm-nums">
      <span>核销 <b>${m.cnt}</b> 次</span>
      <span>单价 <b>¥${ap}</b></span>
      <b class="rm-amt">¥${net.toLocaleString()}</b>
    </div>
    ${net !== m.amt ? `<div style="font-size:9px;color:#e03131;margin-top:2px">协议应收 ¥${m.amt.toLocaleString()} − 已核减 ¥${(m.amt - net).toLocaleString()} = 实结 ¥${net.toLocaleString()}</div>` : ''}
    ${aps.length ? `<div style="font-size:9.5px;color:#b26a00;margin-top:5px">${ic('i-alert')} 商家发起申诉 ${aps.length} 条 · 合计主张 ¥${aps.reduce(function(a,x){return a+x.amt;},0).toLocaleString()}，待受理</div>` : ''}
    ${dfs.length ? `<div style="font-size:9.5px;color:#c92a2a;margin-top:5px">${ic('i-alert')} 差异单 ${dfs.length} 条 · 合计 ¥${dfs.reduce(function(a,x){return a+x.amt;},0).toLocaleString()}，待处置</div>` : ''}
    ${btn}
  </div>`;
}
/* 商户端发起的申诉卡（运营端受理） */
function rsnAppealCard(a, i){
  const off = a.st !== '待受理';
  return `
  <div class="rsn-diff${off?' off':''}" style="border-left-color:${a.st==='已受理'?'#0f9d58':a.st==='已驳回'?'#8a94a6':'#e87722'}">
    <div class="rd-h"><span class="rd-id">${a.id}</span><b>${a.m} · ${a.n}</b>
      <span class="rm-st" style="background:${a.st==='已受理'?'#e7f6ee':a.st==='已驳回'?'#f1f3f6':'#fff4e8'};color:${a.st==='已受理'?'#0f7a46':a.st==='已驳回'?'#8a94a6':'#b26a00'}">${a.st}</span></div>
    <div class="rd-d">${a.d}</div>
    <div class="rd-f">
      <span class="rd-amt">主张 ¥${a.amt.toLocaleString()}</span>
      <span style="font-size:8.5px;color:var(--faint)">${a.at} · 商户端发起</span>
      ${off ? `<span class="rd-ok">${ic('i-check')} ${a.done || '已处理'}</span>`
            : `<button class="rd-btn" style="background:#2f6f9f" onclick="rsnAcceptAppeal(${i})">按商家主张调整</button>
               <button class="rd-btn" style="background:#8a94a6;margin-left:0" onclick="rsnRejectAppeal(${i})">驳回</button>`}    </div>
  </div>`;
}
function rsnDiffCard(d, i){
  const off = d.st !== '待处置';
  return `
  <div class="rsn-diff${off?' off':''}">
    <div class="rd-h"><span class="rd-id">${d.id}</span><b>${d.m} · ${d.n}</b></div>
    <div class="rd-d">${d.d}</div>
    <div class="rd-f">
      <span class="rd-amt">影响 ¥${d.amt.toLocaleString()}</span>
      ${off ? `<span class="rd-ok">${ic('i-check')} ${d.done}</span>`
            : `<button class="rd-btn" onclick="rsnResolve(${i})">按平台口径核减</button>`}
    </div>
  </div>`;
}
function rsnBillBox(){
  const R = DB.rights, s = rsnSum(), B = R.bill;
  const confirmCnt = R.merchants.filter(function(m){ return m.st === '已确认'; }).length;
  let btn, cls, label;
  if(B.st === '待生成'){ cls = ''; label = '生成本期对账单'; }
  else if(B.st === '已入分账'){ cls = ' off'; label = '已并入分账 · ' + B.voucher; }
  else if(s.wait || s.open || s.ap){ cls = ' g'; label = '还有 ' + (s.wait + s.open + s.ap) + ' 项未清，暂不能入分账'; }
  else { cls = ''; label = '并入本期分账'; }
  return `
  <div class="bill-box">
    <div class="bill-h">${ic('i-doc')} 本期对账单 · ${R.period}</div>
    <div class="bill-no">${B.no}</div>
    <div class="bill-d">${B.st === '待生成' ? '尚未生成。生成后按商户逐笔核算核销次数与协议单价，推送对方确认。'
      : '生成于 ' + B.at + ' · 已推送 ' + R.merchants.length + ' 家商户。商户可在商户端「我的权益对账单」自行核对、确认或申诉，平台也可线下代录。'}</div>
    <div class="bill-3">
      <div><b>¥${s.total.toLocaleString()}</b><span>本期应结</span></div>
      <div><b>${confirmCnt} / ${R.merchants.length}</b><span>商户已确认</span></div>
      <div><b style="color:${s.pending?'#ffd8a8':'#8ce99a'}">¥${s.pending.toLocaleString()}</b><span>待结</span></div>
    </div>
    <button class="bill-btn${cls}" onclick="${B.st==='待生成'?'rsnMakeBill()':(s.wait||s.open||s.ap?'rsnRemind()':'rsnPushSplit()')}">${label}</button>
    ${B.st !== '待生成' && (s.wait || s.open || s.ap) ? `<div style="font-size:9px;opacity:.82;margin-top:8px;line-height:1.6">未清项：${s.wait} 家未确认 · ${s.open} 条差异 · ${s.ap} 条申诉待受理${B.remind ? '（已催办 ' + B.remind + ' 次）' : ''}</div>` : ''}
  </div>`;
}
/** 催办：记录催办次数，通知未确认商户 */
function rsnRemind(){
  const R = DB.rights, s = rsnSum();
  R.bill.remind = (R.bill.remind || 0) + 1;
  const names = R.merchants.filter(function(m){ return m.st !== '已确认'; })
    .map(function(m){ return m.n; }).join('、');
  toast('已催办 ' + s.wait + ' 家未确认商户 · 累计 ' + R.bill.remind + ' 次\n通知：' + names +
    (s.ap ? '\n另有 ' + s.ap + ' 条申诉待受理' : ''));
  repaintRights();
}
function rightsHtml(){
  const R = DB.rights, s = rsnSum(), B = R.bill;
  const payPct = Math.round(s.settled / s.total * 100);
  return `
  <div class="nfo-hero">
    <div class="nfo-tag">${ic('i-ticket')} 运营侧 · 核销与对账</div>
    <div class="nfo-t">权益核销与结算</div>
    <div class="nfo-s">藏品与凭证挂的线下权益，核销一次、记一次账、结一次款——这是把「数字藏品」变成「可结算权益」的那一跳。</div>
    <div class="nfo-stats">
      <div><b class="num">${s.cnt.toLocaleString()}</b><span>本期核销次数</span></div>
      <div><b class="num">¥${s.total.toLocaleString()}</b><span>权益成本</span></div>
      <div><b class="num">¥${s.pending.toLocaleString()}</b><span>待结算</span></div>
    </div>
    <div class="nfo-prog">
      <div class="np-h"><span>已确认可结算</span><b>${payPct}%</b></div>
      <div class="nfo-bar"><i style="width:${payPct}%"></i></div>
    </div>
  </div>

  <div class="nfo-kpi">
    <div class="nk"><b class="num">89.9%</b><span>领取率</span></div>
    <div class="nk"><b class="num">63.1%</b><span>核销率</span></div>
    <div class="nk"><b class="num" style="color:${s.ap?'#e03131':'#0f9d58'}">${s.ap}</b><span>待受理申诉</span></div>
    <div class="nk"><b class="num" style="color:${R.merchants.length-rsnConfirmN()?'#b26a00':'#0f9d58'}">${R.merchants.length-rsnConfirmN()}</b><span>未清商家</span></div>
  </div>

  <div class="sec-title">核销漏斗 <span class="more">发行 → 领取 → 激活 → 核销 → 复购</span></div>
  <div class="rsn-card">
    <div class="rsn-h"><b>从发行到复购，每一层都在掉人</b><span>复购率 19.9%</span></div>
    ${R.funnel.map(function(f){ return `
      <div class="fs-row">
        <span class="fs-n">${f.n}</span>
        <div class="fs-bar"><i style="width:${f.p}%;background:${f.c}"></i></div>
        <span class="fs-v">${f.v.toLocaleString()}</span>
        <span class="fs-p">${f.p}%</span>
      </div>`; }).join('')}
    <div style="font-size:9px;color:var(--faint);line-height:1.6;margin-top:8px">核销率 63.1% 是行业偏上水平（文旅类数字权益通常在 35–55%）；真正的问题是<b style="color:#e87722">复购只有 19.9%</b>——权益兑完了没有第二件事可做。</div>
  </div>

  <div class="sec-title">本期对账单 <span class="more">生成 → 商家确认 → 入分账</span></div>
  ${rsnBillBox()}

  <div class="sec-title">按商家逐笔对账 <span class="more">${R.merchants.length} 家 · ${s.cnt.toLocaleString()} 次核销</span></div>
  ${R.merchants.map(function(m,i){ return rsnMerchantCard(m,i); }).join('')}

  <div class="sec-title">商家申诉 <span class="more">${R.appeals.filter(function(a){ return a.st === '待受理'; }).length} 条待受理 · 商户端发起</span></div>
  ${R.appeals.length ? R.appeals.map(function(a,i){ return rsnAppealCard(a,i); }).join('')
    : '<div class="rsn-card" style="text-align:center;color:var(--sub);font-size:10.5px;padding:20px">本期暂无商家申诉</div>'}
  ${(R.appealLog||[]).length ? R.appealLog.map(function(a){ return rsnAppealCard(a, -1); }).join('') : ''}

  <div class="sec-title">差异单 <span class="more">${s.open} 条待处置 · 商家与平台口径不一致</span></div>
  ${R.diffs.map(function(d,i){ return rsnDiffCard(d,i); }).join('')}

  <div class="sec-title">下期预算预测 · 事前预警 <span class="more">按周节奏外推 · 破线前干预</span></div>
  ${fcBox()}

  <div class="sec-title">这笔钱从哪出 · 已回流到分账 <span class="more">预算口径 vs 实绩口径</span></div>
  ${rsnOverrunBox()}
  <div class="spl-real" style="margin:0 14px 10px">
    <div class="rh">${ic('i-calc')} 实绩已回写到「一单 ¥298 怎么分」</div>
    <div class="rd">${splitRealNote().text}。分账页的「权益预留」行显示实绩单均 <b>¥${splitRowsReal().rows.filter(function(w){return w.g==='pool';})[0].v.toFixed(2)}</b>，「留存毛利」行同步扣减 <b>¥${Math.abs(splitRowsReal().gap).toFixed(2)}</b>，五口径合计恒为 ¥298 —— 权益超支不会凭空消失，只会从平台留存里扣。</div>
    <div class="spl-row-real"><span>合伙人端 / 运营端两处分账视图同源</span><b>合计 ¥298.0</b></div>
  </div>
  <div class="note" style="padding:0 16px 12px">权益成本不是「白送的营销费用」，而是<b>有协议单价的应付账款</b>：先有核销、再有对账、最后才入分账。池子不够就走超支审批调剂或协议调价，绝不靠超发旅豆填坑——这是积分与权益两条账必须分开的原因。</div>

  <div class="sec-title">协议变更审批 <span class="more">${agrOpenN()} 条待审批 · 商户端发起</span></div>
  ${agrCards()}

  <div class="sec-title">核销风控 <span class="more">四条硬约束</span></div>
  <div class="nfo-rule">
    ${RSN_RISK.map(function(r,i){ return `
      <div class="nr-row">
        <div class="nr-no">${i+1}</div>
        <div class="nr-b"><b>${r.n}</b><span>${r.d}</span></div>
      </div>`; }).join('')}
  </div>
  <div class="note" style="padding:12px 16px 16px">本期数据为演示示例（期间 ${R.period}）。核销与对账口径与运营端风控页预算池、示范闭环分账同源：权益预留 5%（¥14.9 / 单）先计入成本，实报实销、差额调剂。</div>`;
}
function rsnMakeBill(){
  const R = DB.rights;
  if(R.bill.st !== '待生成'){ toast('对账单已生成 · 单号 ' + R.bill.no); repaintRights(); return; }
  R.bill.st = '已生成';
  R.bill.no = 'ST-20261019-01';
  R.bill.at = nftNow();
  toast('对账单已生成并推送 ' + R.merchants.length + ' 家商户\n单号 ST-20261019-01 · 线下盖章后回传确认');
  repaintRights();
}
function rsnConfirm(i){
  const m = DB.rights.merchants[i];
  if(!m) return;
  if(m.st === '已确认'){
    toast(m.n + ' 本期已确认' + (m.by ? '（' + m.by + '）' : '') + ' · ¥' + rightsLineNet(m).toLocaleString());
    repaintRights(); return; }
  if(m.st === '差异' || m.st === '申诉中'){
    const openD = DB.rights.diffs.filter(function(d){ return d.m === m.n && d.st === '待处置'; }).length;
    const openA = DB.rights.appeals.filter(function(a){ return a.m === m.n && a.st === '待受理'; }).length;
    toast(m.n + ' 有 ' + openD + ' 条差异 / ' + openA + ' 条申诉待处理，不能直接确认');
    repaintRights(); return; }
  m.st = '已确认';
  m.by = m.by || '平台代录';
  toast(m.n + ' 对账已确认 · ¥' + rightsLineNet(m).toLocaleString() + ' 转入可结算');
  repaintRights();
}
function rsnResolve(i){
  const d = DB.rights.diffs[i];
  if(!d) return;
  if(d.st === '已处置'){ toast('该差异已处置'); repaintRights(); return; }
  d.st = '已处置';
  d.done = '核减 ¥' + d.amt + ' · ' + nftNow();
  const left = DB.rights.diffs.filter(function(x){ return x.m === d.m && x.st === '待处置'; }).length;
  if(!left){
    DB.rights.merchants.forEach(function(m){ if(m.n === d.m && m.st === '差异') m.st = '待确认'; });
  }
  toast('已按平台口径核减 ¥' + d.amt + ' · 账单同步' +
    (left ? '\n' + d.m + ' 还有 ' + left + ' 条差异待处置' : '\n' + d.m + ' 差异清零，可登记确认'));
  repaintRights();
}
function rsnPushSplit(){
  const R = DB.rights, s = rsnSum();
  if(R.bill.st === '待生成'){ toast('请先生成本期对账单'); repaintRights(); return; }
  if(R.bill.st === '已入分账'){ toast('本期已并入分账 · 凭证 ' + R.bill.voucher); repaintRights(); return; }
  if(s.wait || s.open || s.ap){
    toast('还不能入分账：' + s.wait + ' 家未确认 · ' + s.open + ' 条差异待处置' + (s.ap ? ' · ' + s.ap + ' 条申诉待受理' : ''));
    repaintRights(); return;
  }
  R.bill.st = '已入分账';
  R.bill.voucher = 'SV-20261019-03';
  toast('已并入本期分账 · 凭证 SV-20261019-03\n权益成本 ¥' + s.total.toLocaleString() + ' 计入结算引擎');
  repaintRights();
}
''
/* ===== 商家申诉受理（v1.7） ===== */
/** 受理：按商家主张调整应付 → 该条线金额上浮，权益成本与分账视图同步变化 */
function rsnAcceptAppeal(i){
  const a = DB.rights.appeals[i];
  if(!a) return;
  if(a.st !== '待受理'){ toast('该申诉已处理'); repaintRights(); return; }
  const m = DB.rights.merchants.filter(function(x){ return x.n === a.m; })[0];
  if(!m){ toast('未找到对应结算条线'); repaintRights(); return; }
  const before = m.amt;
  m.amt = m.amt + a.amt;
  a.st = '已受理';
  a.done = '按主张调整 +¥' + a.amt + ' · ' + nftNow();
  if(m.st === '申诉中') m.st = '待确认';
  toast(a.m + ' 申诉已受理 · 应付 ¥' + before.toLocaleString() + ' → ¥' + m.amt.toLocaleString() +
    '\n权益成本 +¥' + a.amt.toLocaleString() + '，分账视图实绩已同步');
  repaintRights();
}
/** 驳回：维持原额，商家可继续核对 */
function rsnRejectAppeal(i){
  const a = DB.rights.appeals[i];
  if(!a) return;
  if(a.st !== '待受理'){ toast('该申诉已处理'); repaintRights(); return; }
  a.st = '已驳回';
  a.done = '维持协议价 · ' + nftNow();
  const m = DB.rights.merchants.filter(function(x){ return x.n === a.m; })[0];
  if(m && m.st === '申诉中') m.st = '待确认';
  toast('申诉已驳回 · 维持协议价 ¥' + (m ? m.price : '—') + ' / 次\n商家可继续核对或线下补充材料');
  repaintRights();
}

setTimeout(()=>{ if(S.loggedIn) toast('演示原型 · 右侧面板可播放四端数据联动'); }, 900);
